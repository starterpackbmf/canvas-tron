  /* ===== workspace ===== */
  .workspace{position:fixed;inset:0;z-index:1;cursor:default;touch-action:none}
  .workspace.tool-block{cursor:crosshair}
  .workspace.tool-note{cursor:text}
  /* cursor de lápis no modo desenho: hotspot (3,21) = ponta do lápis */
  .workspace.tool-draw{cursor:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'%3E%3Cpath d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z' fill='%235ee7ff' stroke='%23041018' stroke-width='1.2' stroke-linejoin='round'/%3E%3C/svg%3E") 3 21, crosshair}
  .workspace.tool-eraser{cursor:not-allowed}
  .workspace.tool-eraser .stroke-hit{cursor:not-allowed !important}
  .workspace.panning{cursor:grabbing}
  .workspace.hand{cursor:grab}
  .workspace.marquee{cursor:crosshair}
  .marquee-rect{
    position:absolute;z-index:7;pointer-events:none;
    border:1px dashed var(--cyan);background:rgba(0,240,255,.08);
    box-shadow:0 0 10px rgba(0,240,255,.25);
  }

  /* ===== strokes (freehand drawings) ===== */
  /* z-index:5 puts the drawings IN FRONT of the blocks (blocks are z-index auto).
     The container stays pointer-events:none so only the actual stroke bands grab
     clicks — blocks remain interactive everywhere else. Edge handles (z-index 6)
     still sit above the strokes. */
  .strokes{position:absolute;top:0;left:0;width:8000px;height:8000px;pointer-events:none;overflow:visible;z-index:5}
  .strokes .stroke-hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:move}
  .strokes .stroke-line{
    fill:none;
    stroke-linecap:round;stroke-linejoin:round;
    pointer-events:none;
    filter:drop-shadow(0 0 3px currentColor);
    transition:filter .15s ease;
  }
  .strokes g.selected .stroke-line{filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor)}
  .strokes g.selected .stroke-hit{stroke:rgba(255,255,255,.08)}
  /* vínculo desenho↔bloco */
  .strokes g{transition:opacity .28s ease}
  .strokes g.hot .stroke-line{filter:drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px #fff)}
  .strokes g.hot .stroke-hit{stroke:rgba(255,255,255,.14)}
  .strokes g.hidden{opacity:0}
  .strokes g.hidden .stroke-hit{pointer-events:none}
  .world{position:absolute;top:0;left:0;transform-origin:0 0;width:0;height:0}
  .edges{position:absolute;top:0;left:0;width:8000px;height:8000px;pointer-events:none;overflow:visible}
  .edges path{
    fill:none;stroke-width:2.2;
    pointer-events:none;
    transition:opacity .28s ease;
  }
  .edges path.gone{opacity:0}
  .edges path.stub{stroke-width:2.6}
  /* fio do vínculo desenho↔bloco */
  .edges path.anchor{stroke-width:1.6;stroke-dasharray:5 5;opacity:.55;filter:drop-shadow(0 0 3px currentColor)}
  .edges path.anchor.selected{opacity:1;stroke-width:2.2;filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor)}
  .edges path.anchor-hit{stroke:transparent;stroke-width:14}
  .edges path.preview{stroke:var(--orange);stroke-dasharray:6 4;filter:drop-shadow(0 0 4px rgba(255,157,0,.7));pointer-events:none}

  /* ===== collapse badge ===== */
  .collapse-badge{
    position:absolute;
    min-width:30px;height:24px;padding:0 9px;
    display:flex;align-items:center;justify-content:center;gap:3px;
    background:rgba(5,12,24,.95);
    border:1.5px solid currentColor;
    border-radius:14px;
    font-size:11px;font-weight:700;
    cursor:pointer;
    box-shadow:0 0 12px currentColor,inset 0 0 8px rgba(255,255,255,.06);
    z-index:4;
    user-select:none;
    animation:badge-pop .32s cubic-bezier(.34,1.56,.64,1) both;
    transition:box-shadow .15s ease;
  }
  .collapse-badge:hover{box-shadow:0 0 18px currentColor,inset 0 0 10px rgba(255,255,255,.1)}
  .collapse-badge .icon{font-size:11px;line-height:1}
  /* badge com nome do próximo bloco: cresce com o texto, mas com teto + reticências */
  .collapse-badge.named{
    max-width:112px;text-transform:uppercase;letter-spacing:.4px;
    color:currentColor;
  }
  .collapse-badge.named .badge-txt{
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  @keyframes badge-pop{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-90deg)}
    60% {opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(10deg)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  }
  /* Hover on the whole badge expands slightly — uses wrapper because animation holds transform */
  .collapse-badge-wrap{
    position:absolute;transform:translate(-50%,-50%);
    transition:transform .12s ease;
  }
  .collapse-badge-wrap:hover{transform:translate(-50%,-50%) scale(1.15)}

  /* ===== ênfase: contorno correndo (arco de luz dá a volta na borda) ===== */
  @property --emph-ang{ syntax:"<angle>"; inherits:false; initial-value:0deg; }
  .block.emphasis{ z-index:2; box-shadow:0 0 15px rgba(var(--bc-rgb),.4); }
  .block.emphasis::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:4px;
    background:conic-gradient(from var(--emph-ang),
      rgba(var(--bc-rgb),0) 0deg, rgba(var(--bc-rgb),0) 232deg,
      rgba(var(--bc-rgb),.9) 300deg, rgba(255,255,255,.95) 322deg,
      rgba(var(--bc-rgb),.9) 340deg, rgba(var(--bc-rgb),0) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    animation:emph-run 2.8s linear infinite;
    pointer-events:none;
  }
  @keyframes emph-run{ to{ --emph-ang:360deg; } }
  html.pc .block.emphasis::before{ animation:none; background:none; }
  html.pc .block.emphasis{ animation:emph-respira 3.6s ease-in-out infinite; }
  @keyframes emph-respira{
    0%,100%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(var(--bc-rgb),.35),0 0 28px -8px rgba(var(--bc-rgb),.45); }
    50%{ box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(var(--bc-rgb),.6),0 0 46px -6px rgba(var(--bc-rgb),.7); }
  }
  @media (prefers-reduced-motion: reduce){
    .block.emphasis::before{ animation:none; background:none; }
    .block.emphasis{ box-shadow:0 0 22px rgba(var(--bc-rgb),.6); border-color:#fff; }
  }

  /* ===== blocks ===== */
  /* estilo sólido: bloco colorido, só o texto, sem descrição (17/10) */
  .block.estilo-solido{background:var(--bc);border-color:var(--bc);color:#0b0d10;justify-content:center;padding:12px 16px}
  .block.estilo-solido .title{color:#0b0d10;text-align:center;margin:0}
  .block.estilo-solido .body{display:none}
  .block{
    --bc:#00f0ff;
    --bc-rgb:0,240,255;
    position:absolute;
    padding:14px 16px;
    background:var(--blk-bg);
    border:1px solid var(--bc);border-width:var(--bw,1px);border-radius:6px;
    color:var(--white);font-size:13px;line-height:1.45;
    box-shadow:0 0 14px rgba(var(--bc-rgb),.35),inset 0 0 20px rgba(var(--bc-rgb),.06);
    cursor:move;
    transform-origin:center;
    display:flex;flex-direction:column;justify-content:center;
    transition:
      opacity .32s cubic-bezier(.4,0,.2,1),
      transform .32s cubic-bezier(.4,0,.2,1),
      filter .32s ease,
      box-shadow .2s ease;
  }
  .block.hidden{
    opacity:0;
    transform:scale(.45);
    pointer-events:none;
    filter:blur(2px);
  }
  .block.selected{
    box-shadow:
      0 0 0 2px rgba(var(--bc-rgb),.9),
      0 0 24px rgba(var(--bc-rgb),.7),
      inset 0 0 22px rgba(var(--bc-rgb),.12);
  }
  /* preenchimento do bloco: none (padrão) | soft (cor translúcida) | solid (cor cheia, texto escuro) */
  .block.fill-soft{background:rgba(var(--bc-rgb),.22)}
  .block.fill-solid{background:var(--bc);border-color:var(--bc);color:#08131c}
  .block.fill-solid .title{color:#08131c}
  .block.fill-solid .body{color:#12222e}
  .block.fill-solid .body b,.block.fill-solid .body i{color:inherit}
  .block .title{
    font-weight:var(--title-weight,700);letter-spacing:.5px;color:var(--bc);
    text-transform:uppercase;font-size:var(--title-size,13px);margin-bottom:6px;
    text-shadow:none;outline:none;
    text-align:center;
  }
  /* cor da fonte escolhida na pílula: precisa ganhar das regras de tema (body.onix .block.shp-rounded.estilo-solido .title) */
  html body .block.tem-cor-txt.tem-cor-txt.tem-cor-txt.tem-cor-txt .title,html body .block.tem-cor-txt.tem-cor-txt.tem-cor-txt.tem-cor-txt .body{color:var(--cor-txt)!important}
  .block .body{color:var(--body-text);outline:none;white-space:pre-wrap;word-wrap:break-word;min-height:1em;text-align:center;font-size:var(--body-size,15px)}
  /* imagem dentro do bloco (entre título e corpo) */
  .block .block-img{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:5px;margin:2px 0 8px;background:rgba(0,0,0,.25);pointer-events:none;user-select:none}

  /* ===== block shapes (forma por bloco) =====
     Retângulo/arredondado/pílula/elipse = só border-radius (borda+glow normais).
     Losango/hexágono = SVG "skin" atrás do conteúdo; a caixa fica transparente
     e o glow vai pelo drop-shadow do SVG (segue a silhueta). */
  .block.shaped-skin{
    background:transparent !important;border:none !important;box-shadow:none !important;
    padding:18px 26px; /* mais respiro pras bordas inclinadas */
  }
  .block-skin{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
  /* conteúdo acima do skin */
  .block.shaped-skin > .title,.block.shaped-skin > .body{position:relative;z-index:1}
  .block [contenteditable="true"]{background:rgba(var(--bc-rgb),.06);border-radius:3px;padding:2px 4px;margin:-2px -4px;cursor:text}
  .block [data-placeholder]:empty::before{
    content:attr(data-placeholder);
    opacity:.35;font-style:italic;pointer-events:none;
  }

  /* ports pequenos — só um detalhe, pra não tampar a setinha. Crescem no hover. */
  .port{
    position:absolute;width:8px;height:8px;
    background:var(--bg);border:1.5px solid var(--bc,var(--cyan));border-radius:50%;
    cursor:crosshair;transition:all .12s ease;z-index:2;opacity:.7;
  }
  /* área de clique invisível bem maior que a bolinha (28px): recolher/ligar
     sem precisar acertar 7px */
  .port::before{content:"";position:absolute;inset:-10px;border-radius:50%}
  .port:hover,.port.hot{background:var(--bc,var(--cyan));box-shadow:0 0 12px var(--bc,var(--cyan)),0 0 20px rgba(var(--bc-rgb,0,240,255),.6);transform:scale(2);opacity:1}
  .port.top{top:-4px;left:50%;transform:translateX(-50%)}
  .port.bottom{bottom:-4px;left:50%;transform:translateX(-50%)}
  .port.left{left:-4px;top:50%;transform:translateY(-50%)}
  .port.right{right:-4px;top:50%;transform:translateY(-50%)}
  .port.top:hover,.port.top.hot{transform:translateX(-50%) scale(2)}
  .port.bottom:hover,.port.bottom.hot{transform:translateX(-50%) scale(2)}
  .port.left:hover,.port.left.hot{transform:translateY(-50%) scale(2)}
  .port.right:hover,.port.right.hot{transform:translateY(-50%) scale(2)}

  .del{
    position:absolute;top:-10px;right:-10px;width:20px;height:20px;
    background:var(--bg);border:1.5px solid var(--danger);border-radius:50%;
    color:var(--danger);font-size:14px;line-height:16px;text-align:center;
    cursor:pointer;display:none;font-weight:700;z-index:3;
  }
  .block.selected .del{display:block}
  .del:hover{background:var(--danger);color:#fff;box-shadow:0 0 10px var(--danger)}

  /* Resize handles on block corners (visible when selected) */
  .resize{
    position:absolute;width:10px;height:10px;
    background:var(--bc);
    border:1.5px solid var(--bg);
    border-radius:2px;
    display:none;z-index:4;
    box-shadow:0 0 8px var(--bc);
  }
  .block.selected .resize{display:block}
  .resize.tl{top:-6px;left:-6px;cursor:nwse-resize}
  .resize.tr{top:-6px;right:-6px;cursor:nesw-resize}
  .resize.bl{bottom:-6px;left:-6px;cursor:nesw-resize}
  .resize.br{bottom:-6px;right:-6px;cursor:nwse-resize}
  .resize:hover{transform:scale(1.3);box-shadow:0 0 12px var(--bc)}

  /* ===== notes ===== */
  .note{
    --nc:#ff9d00;
    position:absolute;
    /* width:max-content lets the note size to its text even though .world is 0px wide;
       max-width caps it so long notes wrap into a readable column instead of 1 word/line */
    min-width:80px;max-width:340px;width:max-content;
    padding:8px 12px;
    color:var(--nc);font-weight:600;
    background:linear-gradient(180deg,rgba(9,19,34,.62),rgba(5,12,24,.62));
    border:1px solid rgba(var(--nc-rgb),.42);
    border-radius:9px;cursor:move;outline:none;
    line-height:1.45;white-space:pre-wrap;word-wrap:break-word;
    /* só a sombra escura pra legibilidade — sem halo neon (igual aos blocos) */
    text-shadow:0 1px 2px rgba(0,0,0,.85);
    box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(6px);
    opacity:.98;
  }
  .note.selected{border-color:rgba(var(--nc-rgb),.95);opacity:1;box-shadow:0 0 0 1px rgba(var(--nc-rgb),.55),0 8px 22px rgba(0,0,0,.4)}
  .note[contenteditable="true"]{cursor:text;background:rgba(2,6,14,.86);border-color:rgba(var(--nc-rgb),.9)}
  /* "sem moldura": só o texto, sem caixa/fundo (toggle na barra) */
  .note.bare{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;padding:2px 4px;text-shadow:0 1px 3px rgba(0,0,0,.95)}
  .note.bare.selected{border:1px dashed rgba(var(--nc-rgb),.7);box-shadow:none}
  .note.bare[contenteditable="true"]{background:rgba(2,6,14,.7);border-color:rgba(var(--nc-rgb),.7)}
  .note[contenteditable]:empty::before{content:attr(data-placeholder);opacity:.4;font-style:italic;pointer-events:none}

  /* ===== imagens ===== */
  .imgnode{
    position:absolute;cursor:move;border-radius:8px;--bc:#00f0ff;
    border:1px solid transparent;box-shadow:0 6px 20px rgba(0,0,0,.45);
  }
  .imgnode img{width:100%;height:100%;display:block;object-fit:fill;border-radius:7px;pointer-events:none;user-select:none}
  .imgnode.selected{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 18px rgba(0,240,255,.4),0 6px 20px rgba(0,0,0,.5)}
  .imgnode .del,.imgnode .resize{display:none}
  .imgnode.selected .del,.imgnode.selected .resize{display:block}

  /* ===== energy flow (animated pulse running along edges) ===== */
  /* long lit segment + tiny gap: over the steady gradient edge below, this
     reads as a continuous beam with a bright band flowing along it.
     keyframe offset MUST equal -(dash+gap) for a seamless loop */
  /* flow-glow: continuous blurred gradient halo — uniform glow that follows
     the degradê, no periodic notches. */
  .edges path.flow-glow{
    fill:none;stroke-width:6;stroke-linecap:round;
    opacity:.22;filter:blur(2.5px);pointer-events:none;
  }
  /* flow: SOLID continuous gradient beam — no dash means it can never show a
     notch. This is the body of the beam. */
  .edges path.flow{
    fill:none;stroke-width:3.2;stroke-linecap:round;
    opacity:.95;pointer-events:none;
  }
  /* flow-spark: a single bright band sweeping along (big gaps) in SCREEN blend.
     Over the solid beam it only ADDS light, so it reads as a surge of energy
     flowing — never a dashed line. */
  .edges path.flow-spark{
    fill:none;stroke-width:3.4;stroke-linecap:round;
    stroke-dasharray:18 64;opacity:.6;
    mix-blend-mode:screen;pointer-events:none;
    animation:edge-flow 1.7s linear infinite;
  }
  @keyframes edge-flow{ from{stroke-dashoffset:0} to{stroke-dashoffset:-82} }
  @media (prefers-reduced-motion: reduce){ .edges path.flow{animation:none} }

  /* ===== pulse — corrente disparada ao clicar num bloco (one-shot ~500ms) =====
     Uma faixa curta e brilhante que viaja UMA vez pela conexão, saindo do nó
     clicado. pathLength=100 normaliza o dash pra qualquer comprimento de linha. */
  /* dash period (12+200) > pathLength(100) → só UMA faixa na linha, sem wrap:
     a direção fica inequívoca. offset 12 → -110 varre origem → destino. */
  .edges path.pulse{
    fill:none;stroke-width:4.5;stroke-linecap:round;
    stroke-dasharray:12 200;opacity:.95;
    mix-blend-mode:screen;pointer-events:none;
    filter:drop-shadow(0 0 7px currentColor) drop-shadow(0 0 3px #fff);
  }
  .edges path.pulse.fwd{animation:pulse-fwd .55s ease-out forwards}
  @keyframes pulse-fwd{from{stroke-dashoffset:12;opacity:1}to{stroke-dashoffset:-110;opacity:.05}}
  @media (prefers-reduced-motion: reduce){ .edges path.pulse{display:none} }

  /* ===== presentation / focus mode ===== */
  .presentbar{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:20;
    display:flex;gap:4px;align-items:center;padding:6px 10px;
    background:linear-gradient(180deg,rgba(9,19,34,.9),rgba(5,12,24,.9));
    border:1px solid rgba(0,240,255,.3);
    border-radius:13px;
    backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 26px rgba(0,240,255,.15),inset 0 1px 0 rgba(255,255,255,.06);
    animation:fadein .18s ease;
  }
  .presentbar .pcount{
    color:var(--cyan);font-size:13px;font-weight:700;letter-spacing:1px;
    min-width:56px;text-align:center;text-shadow:0 0 8px rgba(0,240,255,.6);
  }
  .world.present .block{
    transition:opacity .4s cubic-bezier(.4,0,.2,1),filter .4s ease,
               box-shadow .3s ease,transform .32s cubic-bezier(.4,0,.2,1);
  }
  .world.present .block:not(.focused){opacity:.12;filter:blur(1.5px) saturate(.5)}
  .world.present .block.hidden{opacity:0}
  .world.present .note{opacity:.12;transition:opacity .4s ease}
  .world.present .edges{opacity:.22;transition:opacity .4s ease}
  /* desenhos escurecem um a um, pra que o vinculado ao bloco em foco possa acender */
  .world.present .strokes g{opacity:.22;transition:opacity .4s ease}
  .world.present .strokes g.lit{opacity:1}
  .world.present .strokes g.lit .stroke-line{filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 14px currentColor)}
  .world.present .strokes g.hidden{opacity:0}
  .block.focused{
    box-shadow:
      0 0 0 2px rgba(var(--bc-rgb),1),
      0 0 44px rgba(var(--bc-rgb),.95),
      0 0 100px rgba(var(--bc-rgb),.5),
      inset 0 0 28px rgba(var(--bc-rgb),.18);
    z-index:5;
  }

  /* ===== connection edit handles ===== */
  .edge-handle{
    position:absolute;width:8px;height:8px;
    background:var(--bg);border:1.5px solid currentColor;border-radius:50%;
    box-shadow:0 0 5px currentColor;cursor:grab;z-index:6;
  }
  .edge-handle.endpoint{border-radius:3px} /* squared = an endpoint you can re-attach */
  .edge-handle:hover{box-shadow:0 0 14px currentColor;background:color-mix(in srgb,currentColor 25%,var(--bg))}
  .edge-style-btn{
    position:absolute;z-index:6;cursor:pointer;user-select:none;white-space:nowrap;
    padding:3px 8px;border-radius:12px;
    background:rgba(5,12,24,.95);border:1.5px solid currentColor;color:currentColor;
    font-size:10px;font-weight:700;letter-spacing:.5px;
    box-shadow:0 0 12px rgba(0,0,0,.5);
  }
  .edge-style-btn:hover{box-shadow:0 0 12px currentColor}

  /* opacity slider for shape fill */
  .opacity-range{
    -webkit-appearance:none;appearance:none;width:80px;height:4px;border-radius:3px;
    background:rgba(0,240,255,.2);outline:none;cursor:pointer;margin:0 4px;
  }
  .opacity-range::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;
    background:currentColor;box-shadow:0 0 8px currentColor;cursor:pointer;
  }
  .opacity-range::-moz-range-thumb{
    width:13px;height:13px;border:none;border-radius:50%;
    background:currentColor;box-shadow:0 0 8px currentColor;cursor:pointer;
  }
  .pct{color:var(--cyan);font-size:10px;font-weight:700;min-width:30px;text-align:right}

  /* ===== holofote (spotlight no modo edição — sem mover a câmera) ===== */
  .world.spotlight .block:not(.lit):not(.hidden){
    opacity:.4;filter:saturate(.85);
    transition:opacity .3s ease,filter .3s ease;
  }
  .world.spotlight .block.lit{
    box-shadow:
      0 0 0 2px rgba(var(--bc-rgb),.9),
      0 0 42px rgba(var(--bc-rgb),.85),
      0 0 90px rgba(var(--bc-rgb),.4),
      inset 0 0 26px rgba(var(--bc-rgb),.15);
    z-index:3;
  }
  /* desenho vinculado a bloco fora do holofote apaga junto; vinculado ao bloco aceso, acende */
  .world.spotlight .strokes g.anchored:not(.lit):not(.hidden){opacity:.4}
  .world.spotlight .strokes g.lit .stroke-line{filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 0 14px currentColor)}

  /* ===== breadcrumb (caminho raiz → nó atual) ===== */
  /* baixo-esquerda: fora da rota de todas as barras de cima (não embola mais) */
  .breadcrumb{
    position:fixed;bottom:44px;left:16px;z-index:9;
    display:flex;align-items:center;flex-wrap:wrap;gap:1px;max-width:min(560px,52vw);
    padding:6px 10px;border-radius:10px;
    background:linear-gradient(180deg,rgba(9,19,34,.84),rgba(5,12,24,.84));
    border:1px solid rgba(0,240,255,.20);
    backdrop-filter:blur(14px) saturate(1.3);font-size:11px;
    box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);
    animation:fadein-bc .15s ease;
  }
  @keyframes fadein-bc{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .breadcrumb .crumb{
    color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;
    white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;
    transition:all .12s ease;
  }
  .breadcrumb .crumb:hover{color:var(--cyan);background:rgba(0,240,255,.08)}
  .breadcrumb .crumb.current{color:var(--cyan);font-weight:700;text-shadow:0 0 8px rgba(0,240,255,.5)}
  .breadcrumb .bc-sep{color:var(--muted);opacity:.45;font-size:10px;padding:0 1px}

  /* ===== minimap ===== */
  .minimap{
    position:fixed;right:14px;bottom:48px;z-index:9;
    background:linear-gradient(180deg,rgba(7,15,28,.88),rgba(3,8,18,.88));
    border:1px solid rgba(0,240,255,.22);
    border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(10px) saturate(1.2);overflow:hidden;cursor:crosshair;
    line-height:0;padding:4px;
  }
  .minimap .mm-view{fill:rgba(0,240,255,.10);stroke:var(--cyan);stroke-width:1.5}

  /* ===== cloud panel (Supabase) ===== */
  .cloud-overlay{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    background:rgba(2,5,12,.6);backdrop-filter:blur(3px);animation:fadein .15s ease;
  }
  .cloud-panel{
    width:min(560px,92vw);max-height:86vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(9,19,34,.97),rgba(5,12,24,.97));
    border:1px solid rgba(0,240,255,.28);border-radius:14px;
    box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 40px rgba(0,240,255,.12),inset 0 1px 0 rgba(255,255,255,.06);
    color:var(--white);overflow:hidden;
  }
  .cloud-head{
    display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid rgba(0,240,255,.18);
  }
  .cloud-head h3{margin:0;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 8px rgba(0,240,255,.4);flex:1}
  .cloud-x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
  .cloud-x:hover{color:var(--danger);background:rgba(255,59,92,.1)}
  .cloud-body{padding:14px 16px;overflow:auto}
  .cloud-body input[type=text],.cloud-body input[type=password]{
    width:100%;padding:9px 11px;margin:5px 0;box-sizing:border-box;
    background:rgba(2,6,14,.7);color:var(--white);
    border:1px solid rgba(0,240,255,.25);border-radius:8px;font-size:13px;outline:none;
  }
  .cloud-body input:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,240,255,.25)}
  .cloud-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-top:8px}
  .cloud-btn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
    background:rgba(0,240,255,.14);color:var(--cyan);
    border:1px solid var(--cyan);border-radius:8px;font-size:12px;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .12s ease;
  }
  .cloud-btn:hover{background:rgba(0,240,255,.24);box-shadow:0 0 14px rgba(0,240,255,.4)}
  .cloud-btn.ghost{background:transparent;color:var(--muted);border-color:rgba(0,240,255,.2)}
  .cloud-btn.ghost:hover{color:var(--cyan);border-color:var(--cyan);box-shadow:none}
  .cloud-btn.danger{background:transparent;border-color:rgba(255,59,92,.4);color:var(--danger)}
  .cloud-btn.danger:hover{background:rgba(255,59,92,.14);box-shadow:0 0 12px rgba(255,59,92,.3)}
  .cloud-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .cloud-saverow{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .cloud-saverow input{flex:1;margin:0}
  .cloud-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .cloud-item{
    display:flex;align-items:center;gap:8px;padding:9px 11px;
    background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.14);border-radius:9px;
    transition:all .12s ease;
  }
  .cloud-item:hover{border-color:rgba(0,240,255,.4);background:rgba(0,240,255,.08)}
  .cloud-item.current{border-color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(0,240,255,.3)}
  .cloud-item .nm{flex:1;font-size:13px;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cloud-item .dt{font-size:10px;color:var(--muted)}
  .cloud-ic{cursor:pointer;color:var(--muted);padding:3px 6px;border-radius:6px;font-size:13px}
  .cloud-ic:hover{color:var(--cyan);background:rgba(0,240,255,.1)}
  .cloud-ic.del:hover{color:var(--danger);background:rgba(255,59,92,.1)}
  .cloud-status{font-size:11px;color:var(--muted);margin-top:10px;min-height:14px}
  .cloud-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px;background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.12);border-radius:8px;padding:10px}
  .cloud-note code{color:var(--cyan);font-size:10px;background:rgba(0,240,255,.08);padding:1px 4px;border-radius:3px}
  .cloud-body textarea.attr-notes{
    width:100%;box-sizing:border-box;min-height:56px;resize:vertical;margin:5px 0;
    background:rgba(2,6,14,.7);color:var(--white);border:1px solid rgba(0,240,255,.25);
    border-radius:8px;font-size:13px;padding:9px 11px;outline:none;font-family:inherit;
  }
  .cloud-body textarea.attr-notes:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,240,255,.25)}
  .attr-chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
  .attr-chip{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;
    background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.3);color:var(--white);
    padding:3px 5px 3px 9px;border-radius:12px;
  }
  .attr-chip i{cursor:pointer;font-style:normal;color:var(--muted);font-size:13px;line-height:1}
  .attr-chip i:hover{color:var(--danger)}
  .attr-table{width:100%;border-collapse:collapse;font-size:12px}
  .attr-table th,.attr-table td{border:1px solid rgba(0,240,255,.14);padding:6px 9px;text-align:left;vertical-align:top}
  .attr-table th{color:var(--cyan);text-transform:uppercase;font-size:10px;letter-spacing:.5px;background:rgba(0,240,255,.05);white-space:nowrap}
  .attr-row{display:flex;gap:8px;align-items:center;margin:5px 0}
  .attr-row .attr-k{flex:0 0 40%;margin:0}
  .attr-row .attr-v{flex:1;margin:0}
  /* grade editável */
  .attr-table.editable td{padding:2px}
  .attr-table.editable td.prod{padding:6px 9px;white-space:nowrap;font-weight:600;display:flex;align-items:center;gap:6px}
  .attr-table.editable .prod-nm{max-width:200px;overflow:hidden;text-overflow:ellipsis}
  .attr-table.editable th.addc{cursor:pointer;color:var(--cyan);text-align:center;width:28px}
  .attr-table.editable th.addc:hover{background:rgba(0,240,255,.12)}
  .attr-table .cell{
    width:100%;min-width:120px;box-sizing:border-box;background:transparent;
    border:1px solid transparent;border-radius:4px;color:var(--white);
    padding:6px 8px;font-size:12px;outline:none;font-family:inherit;
  }
  .attr-table .cell::placeholder{color:rgba(255,255,255,.2)}
  .attr-table .cell:hover{border-color:rgba(0,240,255,.18)}
  .attr-table .cell:focus{border-color:var(--cyan);background:rgba(2,6,14,.7)}
  .attr-addrow{
    padding:8px 12px;background:rgba(0,240,255,.14);color:var(--cyan);
    border:1px solid var(--cyan);border-radius:8px;font-size:12px;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;cursor:pointer;outline:none;
  }
  .attr-addrow option{background:#0a1626;color:var(--white);text-transform:none;font-weight:400}

  /* ===== dock lateral da tabela (paleta) ===== */
  .attr-dock{
    position:fixed;top:0;right:0;bottom:0;width:320px;z-index:20;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(9,19,34,.96),rgba(5,12,24,.96));
    border-left:1px solid rgba(0,240,255,.25);
    box-shadow:-14px 0 40px rgba(0,0,0,.5);
    backdrop-filter:blur(14px) saturate(1.2);
    animation:dock-in .18s ease;
  }
  @keyframes dock-in{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  .attr-dock-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(0,240,255,.16)}
  .attr-dock-head h3{margin:0;flex:1;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 8px rgba(0,240,255,.4)}
  .attr-dock-hint{font-size:11px;color:var(--muted);padding:8px 14px;border-bottom:1px solid rgba(0,240,255,.1)}
  .attr-dock-hint.on{color:var(--cyan)}
  .attr-dock-body{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
  .attr-col{background:rgba(0,240,255,.04);border:1px solid rgba(0,240,255,.14);border-radius:10px;padding:9px 10px}
  .attr-col-head{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .attr-col-name{flex:1;background:transparent;border:none;border-bottom:1px solid rgba(0,240,255,.25);color:var(--cyan);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;outline:none;padding:2px 0}
  .attr-col-name:focus{border-bottom-color:var(--cyan)}
  .attr-cells{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px;min-height:6px}
  .attr-cell{
    display:inline-flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;
    background:rgba(5,14,28,.8);border:1px solid rgba(0,240,255,.3);color:var(--white);
    padding:4px 6px 4px 10px;border-radius:14px;transition:all .12s ease;
  }
  .attr-cell:hover{border-color:var(--cyan);background:rgba(0,240,255,.14);box-shadow:0 0 10px rgba(0,240,255,.3)}
  .attr-cell:active{transform:translateY(1px)}
  /* valor já aplicado a todos os selecionados */
  .attr-cell.on{background:rgba(0,240,255,.22);border-color:var(--cyan);color:var(--cyan);font-weight:700;box-shadow:0 0 10px rgba(0,240,255,.35)}
  .attr-cell.on::before{content:"✓ ";font-size:10px}
  .attr-cell i{font-style:normal;color:var(--muted);font-size:13px;line-height:1}
  .attr-cell i:hover{color:var(--danger)}
  .attr-addval{
    width:100%;box-sizing:border-box;background:rgba(2,6,14,.6);color:var(--white);
    border:1px solid rgba(0,240,255,.2);border-radius:7px;font-size:12px;padding:6px 9px;outline:none;
  }
  .attr-addval:focus{border-color:var(--cyan)}
  .attr-dock-foot{padding:10px 14px;border-top:1px solid rgba(0,240,255,.16)}
  .attr-dock-status{font-size:11px;color:var(--cyan);min-height:16px;margin-bottom:8px}
  /* mini-resumo dentro do bloco */
  .block .attr-line{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:7px}
  .block .attr-tag{
    font-size:9px;text-transform:uppercase;letter-spacing:.4px;padding:1px 6px;border-radius:8px;
    border:1px solid rgba(var(--bc-rgb),.4);color:var(--bc);opacity:.9;
  }
  .block .attr-tag.tier{background:rgba(var(--bc-rgb),.16);font-weight:700}

  /* ===== Mobile / toque ===== */
  .toolbar{padding-top:calc(6px + env(safe-area-inset-top))}
  .palette,.color-pop{margin-top:env(safe-area-inset-top)}

  /* Controle de zoom na tela (−/%/+/enquadrar) — útil no dedo e no mouse */
  .zoomctl{position:fixed;bottom:14px;right:14px;z-index:10;display:flex;align-items:center;gap:6px}
  .zoomctl .zoom{position:static;bottom:auto;right:auto}
  .zoom{cursor:pointer;user-select:none}
  .zbtn{
    width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:700;line-height:1;color:var(--cyan);cursor:pointer;
    background:linear-gradient(180deg,rgba(9,19,34,.78),rgba(5,12,24,.78));
    border:1px solid rgba(0,240,255,.2);border-radius:9px;
    backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.4);
    transition:border-color .12s ease,box-shadow .12s ease,transform .1s ease;
  }
  .zbtn:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.3)}
  .zbtn:active{transform:translateY(1px)}
  body.light .zbtn{color:#0a6b7a}

  /* Botão-menu (☰) e fundo escuro do drawer — só aparecem no mobile */
  .menu-fab{display:none}
  .mm-scrim{display:none}

  /* Telas estreitas OU toque grosso (dedo): a toolbar vira uma gaveta
     (bottom sheet) que abre pelo ☰; painéis viram folhas de tela cheia. */
  @media (max-width:640px), (pointer:coarse){
    .menu-fab{
      display:inline-flex;align-items:center;justify-content:center;
      position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;z-index:23;
      width:46px;height:46px;font-size:20px;color:var(--cyan);cursor:pointer;
      background:linear-gradient(180deg,rgba(9,19,34,.92),rgba(5,12,24,.92));
      border:1px solid rgba(0,240,255,.3);border-radius:12px;
      backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.5);
    }
    .mm-scrim{display:block;position:fixed;inset:0;z-index:21;background:rgba(0,0,0,.45)}

    /* toolbar = bottom sheet, escondida até abrir (.mm-open) */
    .toolbar{
      top:auto;left:0;right:0;bottom:0;transform:translateY(105%);
      width:100%;max-width:100%;border-radius:16px 16px 0 0;
      flex-wrap:wrap;justify-content:flex-start;gap:8px;
      padding:16px 14px calc(18px + env(safe-area-inset-bottom));
      max-height:72vh;overflow:auto;-webkit-overflow-scrolling:touch;z-index:22;
      transition:transform .22s cubic-bezier(.4,0,.2,1);
    }
    .toolbar.mm-open{transform:translateY(0)}
    .toolbar .dvr{display:none}
    .toolbar .tb-group{flex-direction:row;align-items:center;gap:10px;width:100%;padding:2px 0}
    .toolbar .tb-row{flex-wrap:wrap;gap:6px}
    .toolbar .tb-lbl{display:block;font-size:11px;min-width:52px;text-align:left;order:-1}
    .toolbar .tb-danger{margin-left:0}
    .ic{width:44px;height:44px;font-size:18px}   /* alvo de toque cheio na gaveta */
    .tool{padding:9px 13px;font-size:12px}
    .swatch{width:28px;height:28px}
    .minimap{display:none}
    .hint{display:none}                          /* atalhos de teclado não servem no dedo */
    .zoomctl{bottom:calc(12px + env(safe-area-inset-bottom))}
    .zbtn{width:40px;height:40px;font-size:21px}

    /* painéis (Nuvem / Atributos) viram folhas de tela quase cheia */
    .cloud-panel,.attr-dock{
      position:fixed;left:0;right:0;bottom:0;top:auto;
      width:100%;max-width:100%;max-height:82vh;
      border-radius:16px 16px 0 0;overflow:auto;-webkit-overflow-scrolling:touch;
      padding-bottom:calc(16px + env(safe-area-inset-bottom));z-index:24;
    }
  }
  /* Em toque, amplia a área de toque das alças de redimensionar sem mexer no
     quadradinho visível (portas já têm alvo invisível de ~28px via ::before). */
  @media (pointer:coarse){
    .resize::before{content:"";position:absolute;inset:-9px}
  }

  /* ===== blocos prontos ===== */
  .pm-overlay{position:fixed;inset:0;z-index:35;display:flex;align-items:flex-start;justify-content:center;padding-top:110px;background:rgba(2,5,12,.45);animation:fadein .12s ease}
  .pm-panel{width:min(720px,94vw);background:linear-gradient(180deg,rgba(9,19,34,.98),rgba(5,12,24,.98));border:1px solid rgba(0,240,255,.28);border-radius:14px;
    box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 40px rgba(0,240,255,.1);color:var(--white);padding:14px 16px 16px}
  .pm-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .pm-head > span:first-child{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);flex:1}
  .pm-key{font-size:11px;color:var(--muted)}
  .pm-mode{background:none;border:1px solid rgba(0,240,255,.25);color:var(--cyan);font:inherit;font-size:11px;padding:3px 9px;border-radius:999px;cursor:pointer}
  .pm-mode:hover{background:rgba(0,240,255,.1)}
  .pm-note{font-size:12px;color:var(--muted);margin:-4px 0 12px}
  .pm-x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px;border-radius:6px}
  .pm-x:hover{color:var(--danger);background:rgba(255,59,92,.1)}
  .pm-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .pm-col{display:flex;flex-direction:column;gap:6px}
  .pm-group{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .pm-group svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pm-item{display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;padding:8px 10px;border-radius:9px;
    background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);color:var(--white);font:inherit;transition:border-color .12s,background .12s}
  .pm-item:hover{border-color:var(--pc);background:rgba(255,255,255,.05)}
  .pm-sw{flex:none;width:16px;height:16px;border:2px solid;display:inline-block}
  .pm-txt{display:flex;flex-direction:column;min-width:0}
  .pm-txt b{font-size:13px;font-weight:600}
  .pm-txt small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pm-mine{border-top:1px solid rgba(0,240,255,.12);margin-top:14px;padding-top:12px}
  .pm-mine-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .pm-chip{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.1);border-radius:8px;overflow:hidden}
  .pm-chip:hover{border-color:var(--pc)}
  .pm-chip-go{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--white);font:inherit;font-size:12px;padding:6px 8px;cursor:pointer}
  .pm-chip-go .pm-sw{width:12px;height:12px}
  .pm-chip-x{background:none;border:none;border-left:1px solid rgba(255,255,255,.08);color:var(--muted);cursor:pointer;padding:6px 8px;font-size:14px}
  .pm-chip-x:hover{color:var(--danger)}
  .pm-empty{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
  .pm-empty b{color:var(--white);font-weight:600}
  body.light .pm-panel{background:#fbf9f4;border-color:rgba(10,143,166,.3);box-shadow:0 24px 70px rgba(0,0,0,.18)}
  body.light .pm-item{background:rgba(0,0,0,.02);border-color:rgba(0,0,0,.08)}
  body.light .pm-item:hover{background:rgba(0,0,0,.04)}
  @media (max-width:640px){
    .pm-overlay{padding-top:calc(60px + env(safe-area-inset-top))}
    .pm-cols{grid-template-columns:1fr}
    .pm-panel{max-height:80vh;overflow:auto}
  }
  /* check da Pendência */
  .block .task-check{
    position:absolute;top:8px;left:8px;z-index:2;width:18px;height:18px;border-radius:5px;padding:0;cursor:pointer;
    border:2px solid var(--bc);background:transparent;color:var(--bg);font-size:12px;font-weight:900;line-height:14px;
  }
  .block.task-done .task-check{background:var(--bc)}
  .block.has-task > .title{padding:0 18px}
  .block.task-done > .title,.block.task-done > .body{text-decoration:line-through;opacity:.5}

  /* ===== link de leitura (?ver=) ===== */
  body.view-only .toolbar,body.view-only .menu-fab,body.view-only .mm-scrim,body.view-only .hint{display:none !important}
  body.view-only .block .port,body.view-only .block .resize,body.view-only .block .del{display:none !important}
  body.view-only .note,body.view-only .imgnode,body.view-only svg.strokes *,body.view-only svg.edges *{pointer-events:none !important}
  body.view-only .block{cursor:grab}
  body.view-only .block:has(.doc-chip){cursor:pointer}
  .share-banner{
    position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:25;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);
    padding:9px 16px;border-radius:12px;font-size:13px;color:var(--white);
    background:rgba(5,12,24,.82);border:1px solid rgba(0,240,255,.25);backdrop-filter:blur(8px);
    box-shadow:0 8px 30px rgba(0,0,0,.4);
  }
  .share-banner b{color:var(--cyan);letter-spacing:.3px}
  .share-banner .share-meta{color:var(--muted);font-size:12px}
  .share-banner .share-tip{font-size:12px;color:var(--white);opacity:.8}
  .share-banner.missing{border-color:rgba(255,59,92,.4)}
  body.light .share-banner{background:rgba(255,255,255,.9);border-color:rgba(10,143,166,.3)}
  .share-box{margin:14px 0 4px;padding:12px;border:1px solid rgba(0,240,255,.18);border-radius:10px;background:rgba(0,240,255,.03)}
  .share-box .cloud-lbl{margin-top:0}
  .share-box input{margin:6px 0 !important;font-size:12px !important}
  .share-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
  .share-actions{display:inline-flex;align-items:center;gap:8px}
  .share-banner .seg{display:inline-flex;border:1px solid rgba(0,240,255,.3);border-radius:999px;overflow:hidden}
  .share-banner .seg button{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;padding:5px 12px;cursor:pointer}
  .share-banner .seg button.on{background:rgba(0,240,255,.16);color:var(--cyan)}
  .exp-wrap{position:relative}
  .exp-btn{background:none;border:1px solid rgba(0,240,255,.3);color:var(--white);font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}
  .exp-btn:hover{background:rgba(0,240,255,.1)}
  .exp-menu{position:absolute;right:0;top:calc(100% + 8px);display:flex;flex-direction:column;min-width:250px;padding:6px;border-radius:12px;
    background:#0b1628;border:1px solid rgba(0,240,255,.25);box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:2}
  .exp-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:none;border:none;color:var(--white);font:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}
  .exp-menu button:hover{background:rgba(0,240,255,.1)}
  .exp-menu b{font-size:13px;font-weight:600}
  .exp-menu small{font-size:11px;color:var(--muted)}
  .exp-msg{font-size:12px;color:var(--cyan)}
  body.light .exp-menu{background:#fff;border-color:rgba(10,143,166,.3)}

  /* leitura em documento (grafite, igual à popup de anotação) */
  .rd-overlay{position:fixed;inset:0;z-index:24;overflow:auto;-webkit-overflow-scrolling:touch;background:#1f1f1d;
    --d-text:#ecebe6;--d-muted:#9c9a92;--d-faint:#6f6d66;--d-line:rgba(255,255,255,.1);--d-head:rgba(255,255,255,.045);--d-check:#5fb85f}
  body.light .rd-overlay{background:#faf9f5;--d-text:#1f1e1d;--d-muted:#6f6d66;--d-faint:#a3a19a;--d-line:rgba(0,0,0,.1);--d-head:rgba(0,0,0,.04);--d-check:#3f8f3f}
  .rd-page{max-width:760px;margin:0 auto;padding:120px 24px 80px;color:var(--d-text);font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;font-size:16px;line-height:1.65}
  .rd-title{font-size:34px;font-weight:700;letter-spacing:-.3px;margin:0 0 28px;line-height:1.2}
  .rd-sec{padding:18px 0 6px;border-top:1px solid var(--d-line)}
  .rd-sec.root{border-top:none;padding-top:8px}
  .rd-h{margin:0 0 6px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:10px}
  .rd-h::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--rc)}
  h2.rd-h{font-size:26px}
  h3.rd-h{font-size:20px}
  .rd-body{margin:0 0 8px;color:var(--d-muted)}
  .rd-meta{margin:0 0 10px;font-size:12px;color:var(--d-faint)}
  .rd-doc h4{font-size:18px;margin:1.2em 0 .3em}
  .rd-doc h5,.rd-doc h6{font-size:16px;margin:1em 0 .2em}
  .rd-doc p{margin:0 0 .8em}
  .rd-doc blockquote{margin:0 0 1em;padding:2px 0 2px 14px;border-left:3px solid var(--d-faint);font-style:italic}
  .rd-doc hr{border:none;border-top:1px solid var(--d-line);margin:1.2em 0}
  .rd-doc ul,.rd-doc ol{margin:0 0 1em;padding-left:1.4em}
  .rd-doc ul.rd-check{list-style:none;padding-left:.2em}
  .rd-doc .rd-box{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border:1.5px solid var(--d-faint);border-radius:4px;margin-right:8px;font-size:10px;vertical-align:-2px}
  .rd-doc li.done > .rd-box{background:var(--d-check);border-color:var(--d-check);color:#fff}
  .rd-doc li.done{color:var(--d-muted);text-decoration:line-through}
  .rd-doc a{color:var(--d-text)}
  .rd-table{overflow-x:auto;margin:0 0 1.2em;-webkit-overflow-scrolling:touch}
  .rd-table table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45;min-width:520px}
  .rd-table th{text-align:left;font-weight:600;background:var(--d-head);padding:9px 10px}
  .rd-table th:first-child{border-radius:8px 0 0 0}
  .rd-table th:last-child{border-radius:0 8px 0 0}
  .rd-table td{padding:9px 10px;border-top:1px solid var(--d-line);vertical-align:top}
  .rd-table td + td{border-left:1px solid var(--d-line)}
  @media (max-width:760px){
    .share-banner{left:8px;right:8px;transform:none;max-width:none;border-radius:12px;padding:8px 10px;gap:6px 10px}
    .share-banner .share-tip{display:none}
    .rd-page{padding:150px 16px 60px;font-size:16px}
    .rd-title{font-size:26px}
    h2.rd-h{font-size:22px}
    h3.rd-h{font-size:18px}
  }
  .share-hint.strong{color:var(--cyan)}

  /* ===== bloco-documento: selo no bloco + popup de escrita (Editor.js) ===== */
  .block .doc-chip{
    position:relative;z-index:1;margin-top:8px;padding:7px 9px;border-radius:6px;
    border:1px dashed rgba(var(--bc-rgb),.45);background:rgba(var(--bc-rgb),.06);
    text-align:left;cursor:pointer;
  }
  .block .doc-chip:hover{border-style:solid;background:rgba(var(--bc-rgb),.12)}
  .doc-chip-head{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--bc);font-weight:700}
  .doc-chip-head svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .doc-chip-line{font-size:12px;color:var(--body-text);opacity:.85;margin-top:4px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .doc-chip-meta{font-size:10px;color:var(--muted);margin-top:4px}

  /* popup de anotação: visual neutro (grafite), sem o azul Tron. Leitura calma. */
  .doc-overlay{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);backdrop-filter:blur(4px);animation:fadein .15s ease;
  }
  .doc-panel{
    --d-bg:#262624;--d-text:#ecebe6;--d-muted:#9c9a92;--d-faint:#6f6d66;
    --d-line:rgba(255,255,255,.1);--d-hover:rgba(255,255,255,.06);--d-pop:#30302e;
    --d-check:#5fb85f;--d-sel:rgba(255,255,255,.12);--d-head:rgba(255,255,255,.045);
    width:min(820px,94vw);height:88vh;display:flex;flex-direction:column;
    background:var(--d-bg);border:1px solid var(--d-line);border-radius:14px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);color:var(--d-text);overflow:hidden;
    font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  }
  body.light .doc-panel{
    --d-bg:#faf9f5;--d-text:#1f1e1d;--d-muted:#6f6d66;--d-faint:#a3a19a;
    --d-line:rgba(0,0,0,.1);--d-hover:rgba(0,0,0,.05);--d-pop:#ffffff;
    --d-check:#3f8f3f;--d-sel:rgba(0,0,0,.08);--d-head:rgba(0,0,0,.04);
    box-shadow:0 24px 70px rgba(0,0,0,.18);
  }
  .doc-head{display:flex;align-items:center;gap:12px;padding:14px 20px 4px}
  .doc-status{font-size:12px;color:var(--d-muted);flex:1}
  .doc-status b{color:var(--d-text);font-weight:500}
  .doc-x{cursor:pointer;color:var(--d-muted);font-size:24px;line-height:1;padding:2px 8px;border-radius:6px;background:none;border:none}
  .doc-x:hover{color:var(--d-text);background:var(--d-hover)}
  .doc-scroll{flex:1;overflow:auto;padding:14px 56px 48px 72px;-webkit-overflow-scrolling:touch;scrollbar-color:var(--d-faint) transparent}
  .doc-title{
    width:100%;background:none;border:none;outline:none;color:var(--d-text);
    font-size:34px;font-weight:700;letter-spacing:-.3px;margin:0 0 10px;padding:0;font-family:inherit;
    resize:none;overflow:hidden;line-height:1.2;display:block;
  }
  .doc-title::placeholder{color:var(--d-faint)}
  .doc-loading{color:var(--d-muted);font-size:13px;padding:20px 0}

  /* conteúdo do editor */
  .doc-editor{color:var(--d-text);font-size:16px;line-height:1.65}
  .doc-editor .ce-block__content,.doc-editor .ce-toolbar__content{max-width:none}
  .doc-editor .ce-paragraph[data-placeholder]:empty::before,
  .doc-editor [data-placeholder-active]:empty::before{color:var(--d-faint)}
  .doc-editor h1.ce-header{font-size:28px;margin:.7em 0 .15em;font-weight:700;letter-spacing:-.2px}
  .doc-editor h2.ce-header{font-size:22px;margin:.8em 0 .1em;font-weight:700;letter-spacing:-.1px}
  .doc-editor h3.ce-header{font-size:18px;margin:.7em 0 .05em;font-weight:600}
  .doc-editor .cdx-quote__text{min-height:0;border:none;border-left:3px solid var(--d-faint);border-radius:0;padding:0 0 0 14px;margin:0;background:none;box-shadow:none;color:var(--d-text)}
  .doc-editor .cdx-quote__caption{display:none}
  .doc-editor .ce-delimiter::before{color:var(--d-faint)}
  .doc-editor .cdx-list{--checkbox-background:transparent;--color-border:var(--d-faint);--color-bg-checked:var(--d-check);--color-bg-checked-hover:var(--d-check);--color-tick:#fff}
  .doc-editor .cdx-list__checkbox-check{background:transparent;border-color:var(--d-faint)}
  .doc-editor .cdx-list__item:has(.cdx-list__checkbox--checked) .cdx-list__item-content{color:var(--d-muted);text-decoration:line-through}
  .doc-editor .ce-block--selected .ce-block__content{background:var(--d-sel)}
  .doc-editor ::selection{background:var(--d-sel)}
  .doc-editor a{color:var(--d-text);text-decoration:underline;text-decoration-color:var(--d-faint);text-underline-offset:3px;cursor:pointer}
  .doc-editor .ce-toolbar__plus,.doc-editor .ce-toolbar__settings-btn{color:var(--d-faint);background:transparent}
  .doc-editor .ce-toolbar__plus:hover,.doc-editor .ce-toolbar__settings-btn:hover{color:var(--d-text);background:var(--d-hover)}
  .doc-editor .ce-popover,.doc-editor .ce-inline-toolbar,.doc-editor .ce-popover--inline{
    --color-background:var(--d-pop);--color-text-primary:var(--d-text);--color-text-secondary:var(--d-muted);
    --color-border:var(--d-line);--color-shadow:rgba(0,0,0,.35);
    --color-background-item-hover:var(--d-hover);--color-background-item-focus:var(--d-sel);
    --color-background-icon-active:var(--d-sel);--color-text-icon-active:var(--d-text);
    --color-line-gray:var(--d-line);--color-background-item-confirm:#d9534f;
  }
  /* tabela (Dores, Camadas...): linhas finas, cabeçalho em negrito, sem cor de fundo */
  .doc-editor .tc-wrap{--color-background:var(--d-bg);--color-text-secondary:var(--d-faint);--color-border:var(--d-line)}
  .doc-editor .tc-table{font-size:15px;line-height:1.45;border-top:1px solid var(--d-line)}
  .doc-editor .tc-cell{padding:8px 10px}
  /* cabeçalho: faixa um tom acima do fundo, cantos de cima arredondados, sem divisória vertical */
  .doc-editor .tc-table--heading{border-top:none}
  .doc-editor .tc-table--heading .tc-row:first-child{font-weight:600;background:var(--d-head);border-radius:8px 8px 0 0;position:relative;top:auto}
  .doc-editor .tc-table--heading .tc-row:first-child .tc-cell{border-right-color:transparent}
  .doc-editor .tc-add-row,.doc-editor .tc-add-column{color:var(--d-faint)}
  .doc-editor .tc-add-row:hover,.doc-editor .tc-add-column:hover{color:var(--d-text);background:var(--d-hover)}
  .doc-editor .tc-add-row:before{background:transparent}
  .doc-editor .tc-cell--selected,.doc-editor .tc-row--selected{background:var(--d-sel)}
  .doc-editor .tc-toolbox__toggler{color:var(--d-faint)}
  /* tabela em repouso (fora de edição e sem o mouse em cima): some os "+" e a
     faixa reservada da direita, fica só a grade limpa. Hover mantém os "+"
     vivos pra dar tempo de clicar neles. */
  .doc-editor .ce-block:not(:focus-within):not(:hover) .tc-wrap{grid-template-columns:100% 0}
  .doc-editor .ce-block:not(:focus-within):not(:hover) .tc-add-row,
  .doc-editor .ce-block:not(:focus-within):not(:hover) .tc-add-column,
  .doc-editor .ce-block:not(:focus-within):not(:hover) .tc-row:after{display:none}
  .doc-editor .ce-block:not(:focus-within):not(:hover) .tc-cell:last-child{border-right:none}
  .doc-editor .tc-popover{--color-background:var(--d-pop);--color-border:var(--d-line);--color-background-hover:var(--d-hover);--color-text-secondary:var(--d-muted);background:var(--d-pop);border-color:var(--d-line);color:var(--d-text)}
  .doc-editor .tc-popover__item-icon{background:var(--d-hover);border-color:var(--d-line);color:var(--d-text)}
  .doc-editor .ce-popover__items{scrollbar-color:var(--d-faint) transparent}
  .doc-editor .ce-popover-item__icon{background:var(--d-hover);box-shadow:none;color:var(--d-text)}
  .doc-editor .cdx-search-field{background:var(--d-hover);border-color:var(--d-line)}
  .doc-editor .cdx-search-field__input{color:var(--d-text)}

  @media (max-width:640px){
    .doc-panel{width:100vw;height:100%;border-radius:0;border:none}
    .doc-head{padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
    .doc-scroll{padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
    .doc-title{font-size:24px}
  }

  /* ===== tema FUMÊ (padrão): sistema visual do canvas-fluxos =====
     Fonte da verdade: C:\Users\mateu\canvas-fluxos\PROMPT-VISUAL.md (valores exatos).
     Ferramenta escura e silenciosa: fundo quase preto com grade de pontos, cards de
     vidro fumê, cor só em detalhe (bolinha, porta, brilho no canto, chip).
     Tron (dark) e Claro seguem intactos atrás do botão de tema. */
  html:not(.pc) body.fume{
    color-scheme:dark;
    --bg:#0c0c0e;
    --grid:rgba(255,255,255,.075);
    --panel:#17171a;
    --panel-2:#1e1e22;
    --chrome:rgba(24,24,28,.78);
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.15);
    --ink:#ececf1;
    --ink-2:#a4a4b0;
    --ink-3:#6c6c78;
    --edge:rgba(225,225,235,.30);
    --rel:#d8b46a;
    --t-texto:#6fe3a6;
    --t-ideia:#f3cf62;
    --t-imagem:#6ea8ff;
    --t-roteiro:#ff8db3;
    --t-entrega:#b49cff;
    --ok:#6fe3a6;
    --run:#ff9ec4;
    --mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
    --field:#121215;
    /* vars antigas do app apontando pro sistema novo */
    --bg-2:#0c0c0e; --cyan:#ececf1; --white:#ececf1; --muted:#6c6c78;
    --blk-bg:#17171a; --body-text:#a4a4b0;
  }
  /* no app (modo PC) os temas de vidro leem o design system (canvas-comum); estes são os nomes antigos do Tron */
  html.pc body.fume{color-scheme:var(--cs,dark);--field:var(--campo);--muted:var(--ink-3);--white:var(--ink);--body-text:var(--ink-2);--bg-2:var(--bg);--blk-bg:var(--panel);--cyan:var(--ink)}
  html.pc[data-tema="claro"] body.fume{color-scheme:light}
  body.fume,body.fume #root{
    font-family:"Geist",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  body.fume :focus-visible{outline:1.5px solid rgba(255,255,255,.6);outline-offset:2px}

  /* ---------- fundo: grade de pontos (22px x zoom, anda com a câmera) + vinheta ---------- */
  body.fume .bg{
    background-color:var(--bg);
    background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.3px);
    background-size:var(--gs,22px) var(--gs,22px);
    background-position:var(--gx,0) var(--gy,0);
  }
  body.fume .bg::before{display:none}
  body.fume .bg::after{background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55))}
  body.fume .bg-particles{display:none}

  /* ---------- barras flutuantes de vidro ---------- */
  body.fume .toolbar,body.fume .hint,body.fume .drawbar,body.fume .palette,body.fume .presentbar,
  body.fume .breadcrumb,body.fume .zoom,body.fume .zbtn,body.fume .minimap,body.fume .cloud-panel,
  body.fume .exp-menu,body.fume .pm-panel{
    background:var(--chrome);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 12px 30px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
  }
  body.fume .toolbar{top:14px;border-radius:14px;padding:5px 7px}
  body.fume .drawbar,body.fume .palette,body.fume .presentbar{border-radius:14px}
  body.fume .breadcrumb,body.fume .minimap{border-radius:11px}
  body.fume .exp-menu{border-radius:12px;padding:6px}
  body.fume .zoomctl{bottom:16px;right:16px}
  body.fume .zoom,body.fume .zbtn{height:34px;border-radius:11px;color:var(--ink-2);font-weight:500}
  body.fume .zoom{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
  body.fume .zbtn{width:34px;font-size:17px}
  body.fume .zbtn:hover{background:rgba(255,255,255,.07);border-color:var(--line);color:var(--ink);box-shadow:0 12px 30px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
  /* dica do rodapé: pílula de vidro, atalhos como kbd */
  body.fume .hint{bottom:16px;border-radius:999px;font-size:12px;color:var(--ink-2);letter-spacing:0;padding:7px 14px}
  body.fume .hint b{font:500 10.5px/1 var(--mono);color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
  /* botões de ícone */
  body.fume .ic{color:var(--ink-2);border-radius:8px;border-color:transparent}
  body.fume .ic:hover{background:rgba(255,255,255,.07);border-color:transparent;color:var(--ink);box-shadow:none}
  body.fume .ic.active{background:rgba(255,255,255,.1);border-color:transparent;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  body.fume .ic.danger:hover{background:rgba(255,255,255,.07);border-color:transparent;color:var(--run);box-shadow:none}
  body.fume .dvr,body.fume .drawbar .vsep,body.fume .sep{background:var(--line)}
  body.fume .toolbar .tb-lbl{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  body.fume .toolbar .tb-danger .tb-lbl{color:var(--ink-3)}
  body.fume .toolbar .tb-danger .ic{color:var(--ink-3);border-color:transparent}
  body.fume .toolbar .tb-danger .ic:hover{color:var(--run)}
  /* seletores segmentados e botões das barras de seleção/desenho */
  body.fume .shape-btn,body.fume .fmt-btn,body.fume .tool,body.fume .width-btn{
    border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:8px;color:var(--ink-2);
  }
  body.fume .tool{font:500 12px/1 "Geist",ui-sans-serif,system-ui,sans-serif;text-transform:none;letter-spacing:0;border-radius:9px;padding:6px 11px}
  body.fume .shape-btn:hover,body.fume .fmt-btn:hover,body.fume .tool:hover,body.fume .width-btn:hover{
    background:rgba(255,255,255,.08);border-color:var(--line);color:var(--ink);box-shadow:none;
  }
  body.fume .shape-btn.active,body.fume .fmt-btn.active,body.fume .tool.active,body.fume .width-btn.active{
    background:rgba(255,255,255,.1);border-color:var(--line-2);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }
  body.fume .shape-btn.eraser.active{background:rgba(255,158,196,.1);border-color:rgba(255,158,196,.35);color:var(--run);box-shadow:none}
  body.fume .width-btn .dot{box-shadow:none}
  body.fume .swatch{box-shadow:none !important;border-color:rgba(255,255,255,.15)}
  body.fume .swatch:hover{border-color:var(--ink)}
  body.fume .drawbar .lbl,body.fume .palette .lbl{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  body.fume .drawbar .clear-strokes{color:var(--ink-2);border-color:var(--line);background:rgba(255,255,255,.04)}
  body.fume .drawbar .clear-strokes:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:var(--line);color:var(--run);box-shadow:none}
  body.fume .presentbar .pcount{font:500 12px/1 var(--mono);color:var(--ink);text-shadow:none}
  body.fume .breadcrumb .crumb{color:var(--ink-3)}
  body.fume .breadcrumb .crumb:hover{color:var(--ink);background:rgba(255,255,255,.07)}
  body.fume .breadcrumb .crumb.current{color:var(--ink);font-weight:500;text-shadow:none;filter:none}
  body.fume .cloud-head{border-bottom-color:var(--line)}
  body.fume .cloud-head h3{font-size:18px;font-weight:500;letter-spacing:-.01em;text-transform:none;color:var(--ink);text-shadow:none}
  body.fume .cloud-panel input{background:var(--field);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 9px;color:var(--ink)}
  body.fume .cloud-panel input:focus{border-color:rgba(255,255,255,.18);outline:none}
  body.fume .minimap .mm-view{fill:rgba(255,255,255,.08)}
  body.fume .marquee-rect{border:1px dashed var(--line-2);background:rgba(255,255,255,.04);box-shadow:none}

  /* ---------- card (bloco): vidro fumê, topo mais claro, brilho de cor num canto ---------- */
  body.fume .block{
    --glow:rgba(var(--bc-rgb),.16);
    background:
      radial-gradient(150px 70px at 100% 0%,var(--glow),transparent 72%),
      linear-gradient(180deg,rgba(255,255,255,.075) 0px,rgba(255,255,255,.015) 31px,transparent 52px),
      linear-gradient(180deg,rgba(52,52,60,.50) 0px,rgba(30,30,35,.80) 64px,rgba(23,23,27,.95) 140px);
    border:1px solid var(--line);
    color:var(--ink);font-size:13px;line-height:1.45;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -24px rgba(0,0,0,.9);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  }
  body.fume .block.selected{border-color:var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(255,255,255,.14),0 24px 48px -24px rgba(0,0,0,.9)}
  body.fume .block.focused{border-color:var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(255,255,255,.14),0 24px 48px -24px rgba(0,0,0,.9),0 0 60px -10px rgba(var(--bc-rgb),.5)}
  body.fume .block.emphasis{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -24px rgba(0,0,0,.9),0 0 60px -10px rgba(var(--bc-rgb),.5)}
  /* sólido no Fumê: vidro fosco tingido pela cor do bloco. Luz suave vindo de cima, reflexo leve embaixo,
     brilho espalhado (sem mancha num canto) e um halo discreto em volta. Só o título, sem o painel de baixo. */
  body.fume .block.estilo-solido{
    background:
      radial-gradient(120% 150% at 30% -35%,rgba(var(--bc-rgb),var(--sa1,.46)),transparent 64%),
      radial-gradient(110% 130% at 75% 140%,rgba(var(--bc-rgb),var(--sa2,.24)),transparent 66%),
      linear-gradient(180deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.025) 38%,rgba(255,255,255,0) 70%),
      linear-gradient(180deg,rgba(var(--bc-rgb),var(--sa3,.14)),rgba(var(--bc-rgb),calc(var(--sa3,.14) * .45))),
      linear-gradient(180deg,rgba(38,38,44,.70),rgba(20,20,24,.88));
    border:1px solid rgba(var(--bc-rgb),var(--sb,.18));color:var(--ink);padding:0;justify-content:center;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.13),
      inset 0 -12px 26px -18px rgba(var(--bc-rgb),.40),
      0 12px 36px -20px rgba(var(--bc-rgb),.38),
      0 22px 44px -26px rgba(0,0,0,.9);
    backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    transition:box-shadow .25s,border-color .25s;
  }
  /* Fundo no sólido: só o vidro / cor suave (padrão) / cor forte */
  body.fume .block.estilo-solido.fill-none{--sa1:.20;--sa2:.10;--sa3:.04;--sb:.14}
  body.fume .block.estilo-solido.fill-soft{--sa1:.46;--sa2:.24;--sa3:.14;--sb:.18}
  body.fume .block.estilo-solido.fill-solid{--sa1:.78;--sa2:.46;--sa3:.36;--sb:.40}
  body.fume .block.estilo-solido:hover{border-color:rgba(var(--bc-rgb),.32)}
  body.fume .block.estilo-solido.selected,body.fume .block.estilo-solido.focused{
    border-color:rgba(var(--bc-rgb),.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -12px 26px -18px rgba(var(--bc-rgb),.45),
      0 0 0 3px rgba(var(--bc-rgb),.10),0 0 44px -14px rgba(var(--bc-rgb),.55),0 22px 44px -26px rgba(0,0,0,.9);
  }
  body.fume .block.estilo-solido .title,body.fume .block.shp-rect.estilo-solido .title,body.fume .block.shp-rounded.estilo-solido .title{
    color:#f3f3f6;font-weight:500;font-size:var(--body-size,15px);line-height:1.35;text-align:center;padding:14px 16px;margin:0;
    text-shadow:0 1px 14px rgba(var(--bc-rgb),.30);
  }
  body.fume .block.estilo-solido .body{display:none}
  body.fume .block.estilo-solido [contenteditable="true"]{background-color:rgba(255,255,255,.06)}
  /* "fundo" do bloco não vira cor chapada: só aumenta o brilho do canto */
  body.fume .block.fill-soft{--glow:rgba(var(--bc-rgb),.30)}
  body.fume .block.fill-solid{--glow:rgba(var(--bc-rgb),.45);border-color:rgba(var(--bc-rgb),.28)}
  body.fume .block.fill-solid .title,body.fume .block.fill-solid .body{color:inherit}
  /* título: 12,5px peso 500, cor de texto (a cor do bloco fica na bolinha) */
  body.fume .block .title{
    color:var(--ink);font-weight:500;letter-spacing:0;text-transform:none;text-shadow:none;
    font-size:calc(var(--body-size,15px) * .8333);line-height:1.45;
  }
  body.fume .block .body{color:var(--ink-2);font-size:calc(var(--body-size,15px) * .8333);line-height:1.5}
  body.fume .block [contenteditable="true"]{background-color:rgba(255,255,255,.045)}
  /* retângulo/arredondado: cabeçalho com bolinha 6px que brilha + miolo num painel interno */
  body.fume .block.shp-rect,body.fume .block.shp-rounded{padding:0 0 6px;justify-content:flex-start}
  /* título centralizado, sem bolinha: a cor do bloco mora só no brilho do canto (pedido 13/10) */
  body.fume .block.shp-rect .title,body.fume .block.shp-rounded .title{
    text-align:center;margin:0;padding:10px 12px 9px;
  }
  body.fume .block.shp-rect .body,body.fume .block.shp-rounded .body{
    text-align:center;margin:0 6px;background:var(--panel);border:1px solid rgba(255,255,255,.045);border-radius:11px;padding:10px;
  }
  body.fume .block.shp-rect .body:empty:not([contenteditable="true"]),body.fume .block.shp-rounded .body:empty:not([contenteditable="true"]){display:none}
  body.fume .block.shp-rect > .block-img,body.fume .block.shp-rounded > .block-img{width:calc(100% - 12px);margin:0 6px 6px;border-radius:11px;background:var(--field)}
  body.fume .block.shp-rect .doc-chip,body.fume .block.shp-rounded .doc-chip,
  body.fume .block.shp-rect .board-chip,body.fume .block.shp-rounded .board-chip{margin:6px 6px 0}
  body.fume .block.shp-rect.estilo-solido,body.fume .block.shp-rounded.estilo-solido{justify-content:center;padding:0}
  /* losango/hexágono: o contorno SVG vira borda fina neutra */
  body.fume .skin-poly{fill:var(--panel) !important;stroke:var(--line-2) !important;filter:drop-shadow(0 18px 24px rgba(0,0,0,.6)) !important}
  body.fume .block.selected .skin-poly,body.fume .block.focused .skin-poly{stroke:rgba(255,255,255,.4) !important}
  /* chips dentro do bloco (documento, quadro) */
  body.fume .doc-chip,body.fume .board-chip{background:var(--field);border:1px solid rgba(255,255,255,.06);border-radius:8px}
  body.fume .doc-chip-head,body.fume .board-chip-head{font:500 10px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  body.fume .board-chip-head .late{color:var(--rel)}
  body.fume .board-chip-cols{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3)}
  body.fume .board-chip-cols b{color:var(--ink-2);font-weight:500}
  body.fume .doc-chip-line{color:var(--ink-2)}
  body.fume .doc-chip-meta{font-family:var(--mono);color:var(--ink-3)}
  /* porta: discreta e neutra (pedidos de 13/10: "chamando muita atenção" e "cor só no brilho").
     Pontinho cinza de 5px meio apagado; acende no hover do bloco ou seleção, e só ganha a cor
     do bloco (com brilho) com o mouse na própria porta. Área de clique continua grande (::before). */
  body.fume .port{width:5px;height:5px;background:var(--ink-2);border:0;opacity:.45;
    box-shadow:0 0 0 2px #141417;transition:transform .15s,box-shadow .15s,opacity .15s}
  body.fume .port.top{top:-2.5px}
  body.fume .port.bottom{bottom:-2.5px}
  body.fume .port.left{left:-2.5px}
  body.fume .port.right{right:-2.5px}
  body.fume .block:hover .port,body.fume .block.selected .port{opacity:.9}
  body.fume .port:hover,body.fume .port.hot{background:var(--bc);opacity:1;box-shadow:0 0 0 2px #141417,0 0 8px var(--bc)}
  body.fume .port.top:hover,body.fume .port.top.hot,body.fume .port.bottom:hover,body.fume .port.bottom.hot{transform:translateX(-50%) scale(1.6)}
  body.fume .port.left:hover,body.fume .port.left.hot,body.fume .port.right:hover,body.fume .port.right.hot{transform:translateY(-50%) scale(1.6)}
  body.fume .resize{background:var(--ink);border:1.5px solid #141417;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
  body.fume .resize:hover{box-shadow:0 2px 6px rgba(0,0,0,.6)}
  body.fume .del{width:22px;height:22px;top:-11px;right:-11px;line-height:19px;font-size:14px;font-weight:500;
    background:var(--chrome);border:1px solid var(--line);color:var(--ink-3);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  body.fume .del:hover{background:rgba(255,255,255,.12);border-color:var(--line-2);color:var(--run);box-shadow:none}

  /* ---------- conexões: bezier fina que não engrossa com o zoom ---------- */
  body.fume .edges path.edge-line{stroke:var(--edge);stroke-width:1.25;vector-effect:non-scaling-stroke;transition:stroke .2s,opacity .3s}
  /* estilo de linha do app: largura base e cor do efeito (a cor das linhas do canvas, ou a luz do tema) */
  html.pc .edges path.cc-l,html.pc .edges path.cc-lx{--cc-lw0:1.25px;color:var(--cc-linha,var(--luz,#ececf1));vector-effect:non-scaling-stroke}
  html.pc .edges path.cc-lx{stroke:currentColor}
  body.fume .edges path.edge-line.sel{stroke:#fff;stroke-width:1.6;filter:none !important}
  body.fume .edges path.edge-arrow{fill:var(--ink-3) !important}
  body.fume .edges path.stub{stroke:var(--edge);stroke-width:1.25;vector-effect:non-scaling-stroke}
  /* ⚡ fluxo ligado = "rodando": rosa tracejado 3 7 andando */
  body.fume .edges path.flow-glow,body.fume .edges path.flow-spark{display:none}
  body.fume .edges path.flow{stroke:var(--run);stroke-width:1.25;vector-effect:non-scaling-stroke;stroke-dasharray:3 7;opacity:1;animation:fume-run .7s linear infinite}
  @keyframes fume-run{to{stroke-dashoffset:-10}}
  body.fume .edges path.pulse{stroke:var(--run) !important;filter:none;mix-blend-mode:normal;stroke-width:2;opacity:.9}
  /* fio desenho↔bloco = relação livre: dourado tracejado 5 5 */
  body.fume .edges path.anchor{stroke:var(--rel) !important;stroke-dasharray:5 5;stroke-width:1.25;vector-effect:non-scaling-stroke;opacity:.85;filter:none}
  body.fume .edges path.anchor.selected{opacity:1;filter:none}
  body.fume .edges path.preview{stroke:var(--ink-2);stroke-dasharray:3 7;filter:none;vector-effect:non-scaling-stroke;stroke-width:1.25}
  body.fume .collapse-badge{background:var(--field);border:1px solid rgba(255,255,255,.06);box-shadow:0 0 0 3px var(--bg);font:500 10.5px/1 var(--mono);letter-spacing:.04em}
  body.fume .collapse-badge:hover{box-shadow:0 0 0 3px var(--bg)}
  body.fume .edge-style-btn{background:var(--chrome);border:1px solid var(--line);font:500 10px/1 var(--mono);letter-spacing:.06em;box-shadow:0 12px 30px -12px rgba(0,0,0,.7);backdrop-filter:blur(16px)}
  body.fume .edge-handle{background:#141417;box-shadow:none}
  body.fume .edge-handle:hover{box-shadow:none;background:var(--panel-2)}
  @media (prefers-reduced-motion: reduce){ body.fume .edges path.flow{animation:none} }

  /* ---------- anotações, imagens, desenhos ---------- */
  body.fume .note{
    background:var(--chrome);border:1px solid var(--line);border-radius:11px;
    color:color-mix(in srgb,var(--nc) 60%,#ececf1);font-weight:500;font-size:13px;
    text-shadow:none;box-shadow:0 12px 30px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  }
  body.fume .note.selected{border-color:var(--line-2);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 30px -12px rgba(0,0,0,.7)}
  body.fume .note[contenteditable="true"]{background:var(--panel);border-color:var(--line-2)}
  body.fume .note.bare{background:transparent;border-color:transparent;box-shadow:none;text-shadow:none;backdrop-filter:none}
  body.fume .imgnode{border-radius:11px;box-shadow:0 24px 48px -24px rgba(0,0,0,.9)}
  body.fume .imgnode img{border-radius:10px}
  body.fume .imgnode.selected{border-color:var(--line-2);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 24px 48px -24px rgba(0,0,0,.9)}
  body.fume .strokes .stroke-line{filter:none}
  body.fume .strokes g.selected .stroke-line,body.fume .strokes g.hot .stroke-line{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.7))}
  body.fume .world.present .strokes g.lit .stroke-line{filter:none}

  /* ---------- modais: documento (leitura estilo Notion) e quadro ---------- */
  body.fume .doc-overlay,body.fume .cloud-overlay{background:rgba(6,6,8,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  body.fume .doc-panel{
    --d-bg:#17171a;--d-text:#e4e4ea;--d-muted:#a4a4b0;--d-faint:#6c6c78;
    --d-line:rgba(255,255,255,.08);--d-hover:rgba(255,255,255,.07);--d-pop:#1e1e22;
    --d-sel:rgba(255,255,255,.1);--d-head:rgba(255,255,255,.04);--d-check:#6fe3a6;
    border-radius:18px;border-color:var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -24px rgba(0,0,0,.9);
  }
  body.fume .board-panel{
    --bs-mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
    --bs-line:rgba(255,255,255,.08);--bs-line-soft:rgba(255,255,255,.045);
    --bs-panel:#17171a;--bs-panel-2:#121215;
    --bs-ink:#ececf1;--bs-muted:#a4a4b0;--bs-muted-2:#6c6c78;
    --bs-accent:#ececf1;--bs-accent-dim:rgba(255,255,255,.07);--bs-accent-line:rgba(255,255,255,.15);
    --bs-warn:#d8b46a;--bs-warn-dim:rgba(216,180,106,.1);--bs-warn-line:rgba(216,180,106,.22);
    border-radius:18px;border-color:var(--line);color:var(--ink);
    background:linear-gradient(180deg,rgba(40,40,46,.92) 0px,rgba(23,23,27,.98) 140px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -24px rgba(0,0,0,.9);
  }
  body.fume .board-head,body.fume .board-foot{border-color:var(--line)}
  body.fume .board-head h3{font-size:18px;font-weight:500;letter-spacing:-.01em;text-transform:none;color:var(--ink);text-wrap:balance}
  body.fume .bs-count{background:var(--field);border-color:rgba(255,255,255,.06)}
  body.fume .board-col{background:rgba(255,255,255,.02);border-color:var(--bs-line-soft)}
  body.fume .board-col.is-doing .board-col-dot{background:var(--run);box-shadow:0 0 8px var(--run)}
  body.fume .board-col.is-done .board-col-dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  body.fume .board-col-name{color:var(--ink-3);letter-spacing:.08em;font-weight:500}
  body.fume .board-col.drop{border-color:var(--line-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  body.fume .board-card{
    background:linear-gradient(180deg,rgba(52,52,60,.50) 0px,rgba(30,30,35,.80) 64px,rgba(23,23,27,.95) 140px);
    border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -24px rgba(0,0,0,.9);
  }
  body.fume .board-card:hover{border-color:var(--line-2)}
  body.fume .board-card-title{font-size:12.5px;font-weight:500}
  body.fume .board-bar{height:2px}
  body.fume .board-bar-fill{background:linear-gradient(90deg,#b49cff,var(--run))}
  body.fume .bs-tag{font-size:10px;letter-spacing:.06em;color:var(--ink-3);border-color:var(--line);background:transparent}
  body.fume .bs-tag.video{color:var(--run);border-color:rgba(255,158,196,.3);background:rgba(255,158,196,.08)}
  body.fume .board-add-col{border-color:var(--line);color:var(--ink-3)}
  body.fume .board-add-col:hover{border-color:var(--line-2);color:var(--ink)}
  body.fume .board-saved{font-family:var(--mono);color:var(--ok)}
  body.fume .bs-scrim{background:rgba(6,6,8,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  body.fume .bs-sheet{
    border-radius:18px;border-color:var(--line);
    background:linear-gradient(180deg,rgba(40,40,46,.92) 0px,rgba(23,23,27,.98) 140px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px -24px rgba(0,0,0,.9);
  }
  body.fume .bs-title{font-size:18px;font-weight:500;letter-spacing:-.01em}
  body.fume .bs-label{color:var(--ink-3);letter-spacing:.08em}
  body.fume .bs-st.done .box{background:var(--ok);border-color:var(--ok)}
  body.fume .bs-add input,body.fume .bs-prazo input[type=date]{background:var(--field);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 9px}
  body.fume .bs-add input:focus,body.fume .bs-prazo input[type=date]:focus{border-color:rgba(255,255,255,.18)}
  body.fume .bs-btn{font:500 12px/1 "Geist",ui-sans-serif,system-ui,sans-serif;letter-spacing:0;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:9px;padding:8px 11px}
