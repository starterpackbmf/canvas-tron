  }, []);

  // Profundidade de cada bloco a partir da raiz do seu mapa (componente).
  // Raiz = bloco sem ligação chegando (from→to); se houver mais de um, o que
  // tem mais descendentes; se nenhum (ciclo), o de mais ligações. A distância
  // é medida ignorando a direção das ligações, então funciona mesmo se alguma
  // foi desenhada do filho pro pai.
  const blockDepth = useMemo(() => {
    const adj = new Map(), indeg = new Map(), out = new Map();
    blocks.forEach(b => { adj.set(b.id, []); indeg.set(b.id, 0); out.set(b.id, []); });
    edges.forEach(e => {
      if (!adj.has(e.from.id) || !adj.has(e.to.id)) return;
      adj.get(e.from.id).push(e.to.id); adj.get(e.to.id).push(e.from.id);
      out.get(e.from.id).push(e.to.id);
      indeg.set(e.to.id, indeg.get(e.to.id) + 1);
    });
    const reach = (id) => { // quantos blocos alcanço seguindo from→to
      const seen = new Set([id]); const q = [id];
      while (q.length) { const c = q.shift(); out.get(c).forEach(n => { if (!seen.has(n)) { seen.add(n); q.push(n); } }); }
      return seen.size;
    };

  const collapseEdgeById = useCallback((id) => {

      if (da == null || db == null || da === db) dir = "forward"; // empate: from é o pai

  /* ================== Modo Mapa ================== */
  const sizesRef = useRef(sizes); useEffect(() => { sizesRef.current = sizes; });
  const hiddenRef = useRef(hiddenBlockIds); useEffect(() => { hiddenRef.current = hiddenBlockIds; });

  const [layoutNonce, setLayoutNonce] = useState(0);
  const blockCenter = useCallback((b) => {

  // Radial: grava em `side` (L/R) o lado atual de cada filho da raiz, pra que

  const freezeSides = useCallback((rootId) => {
    const bl = blocksRef.current, byId = new Map(bl.map(b => [b.id, b]));

    const rc = blockCenter(root);
    const kids = edgesRef.current.filter(e => e.from.id === rootId && byId.has(e.to.id)).map(e => byId.get(e.to.id));
    const half = Math.ceil(kids.length / 2);
    const sideOf = (b, i) => b.side || (mapOnRef.current && Math.abs(blockCenter(b).x - rc.x) > 1 ? (blockCenter(b).x < rc.x ? "L" : "R") : (i < half ? "R" : "L"));

      setBlocks(p => p.map(b => m.has(b.id) && b.side !== m.get(b.id) ? { ...b, side: m.get(b.id) } : b));

  }, [blockCenter]);
  // Recalcula posições/portas e anima os blocos até lá (tween em JS pra

  const relayoutNow = useCallback((animate = true) => {
    const bl = blocksRef.current, ed = edgesRef.current;

    // Only react if clicking the workspace itself, not a child
    if (e.target !== wsRef.current && !e.target.classList.contains("world") && e.target.tagName !== "svg") return;
    // Blur any active editing so clicking outside always exits edit mode
    if (document.activeElement && document.activeElement.isContentEditable) {
      document.activeElement.blur();
    }
    const wp = screenToWorld(e.clientX, e.clientY);
    if (tool === "block") { createBlock(wp.x, wp.y); setTool("select"); return; }
    if (tool === "draw") {
      clearSelection();
      if (drawShape === "eraser") {
        e.preventDefault();
        return;
      }
      if (drawShape === "text") {
        createNote(wp.x, wp.y, drawColor, drawFontSize, noteFrame);
        setTool("select"); // one-shot: cria uma nota e volta pro mouse normal
        e.preventDefault();
        return;
      }
      // Start a new stroke
      beginDrawAt(e.clientX, e.clientY);
      e.preventDefault();
      return;
    }
    if (arrowModeRef.current) {
      // modo seta: retângulo de seleção (Shift soma à seleção atual)
      if (!e.shiftKey) clearSelection();
      marqueeRef.current = { sx: wp.x, sy: wp.y, additive: e.shiftKey, rect: { x: wp.x, y: wp.y, w: 0, h: 0 } };
      setMarquee({ x: wp.x, y: wp.y, w: 0, h: 0 });
      wsRef.current.classList.add("marquee");
      e.preventDefault();
      return;
    }
    // modo mão: arrastar o fundo move o mapa
    clearSelection();
    panRef.current = true;
    wsRef.current.classList.add("panning");
    e.preventDefault();
  };

  /* ----- fit/reset/clear ----- */
  const fitAllRef = useRef(null);
  const fitAll = (instantaneo) => {
    const items = [...blocks.filter(b => !hiddenBlockIds.has(b.id)), ...notes, ...images];
    // Include strokes' extents
    const strokeBounds = strokes.flatMap(s =>
      (s.points || []).map(p => ({ x: p.x + (s.x||0), y: p.y + (s.y||0), w: 0, h: 0 }))
    );
    const all = [...items, ...strokeBounds];
    if (!all.length) { setView({ x:0, y:0, scale:1 }); return; }
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    all.forEach(o => {
      const w = o.w ?? 0, h = o.h ?? 0;
      minX = Math.min(minX, o.x); minY = Math.min(minY, o.y);
      maxX = Math.max(maxX, o.x + w); maxY = Math.max(maxY, o.y + h);
    });
    const pad = 80;
    const cw = window.innerWidth - 160, ch = window.innerHeight - 160;
    const scale = Math.max(0.2, Math.min(cw/(maxX-minX+pad*2), ch/(maxY-minY+pad*2), 1.5));
    const alvo = { scale, x: 80 - minX*scale + (cw-(maxX-minX)*scale)/2, y: 80 - minY*scale + (ch-(maxY-minY)*scale)/2 };
    // no app: o mesmo voo do Fluxo e do mapa (export de PNG continua seco, pra capturar no lugar certo)
    if (PC && vooRef.current && instantaneo !== true) { pararFisica(); vooRef.current.ir({ x: alvo.x, y: alvo.y, s: alvo.scale }); return; }
    setView(alvo);
  };

  /* ----- export PNG (híbrido) -----
     html2canvas é instável com SVG (as ligações somiam). Aqui as linhas, setas
     e desenhos são pintados NA MÃO num <canvas> via Path2D (renderiza SVG path
     de forma confiável); o html2canvas cuida só da camada HTML (blocos/notas/
     imagens, que ele já renderiza bem). As duas são compostas. */
  const exportPNG = () => {
    const h2c = window.html2canvas;
    if (!h2c) { alert("A biblioteca de imagem ainda está carregando — tente de novo em instantes."); return; }
    const ws = wsRef.current;
    if (!ws) return;
    fitAll(true); // enquadra tudo antes de capturar
    setTimeout(() => {
      const v = viewRef.current;
      const W = window.innerWidth, H = window.innerHeight, S = 2;
      const out = document.createElement("canvas");
      out.width = Math.round(W * S); out.height = Math.round(H * S);
      const ctx = out.getContext("2d");
      ctx.fillStyle = theme === "light" ? "#f4f1ea" : theme === "fume" ? "#0c0c0e" : "#030612"; ctx.fillRect(0, 0, out.width, out.height);
      // aplica a mesma transformação da tela (escala 2 p/ qualidade)
      const worldTransform = () => { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.translate(v.x, v.y); ctx.scale(v.scale, v.scale); };
      // 1) ligações + setas (atrás dos blocos)
      worldTransform();
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      edgePaths.forEach(p => {
        try {
          if (p.collapsed) {
            if (p.stubD) { ctx.strokeStyle = p.color; ctx.lineWidth = 2.6; ctx.stroke(new Path2D(p.stubD)); }
            return;
          }
          ctx.strokeStyle = theme === "fume" ? "rgba(225,225,235,.30)" : p.color; ctx.lineWidth = theme === "fume" ? 1.25 : 2.2;
          if (p.curveD) ctx.stroke(new Path2D(p.curveD));
          if (p.arrowD) { ctx.fillStyle = theme === "fume" ? "rgba(225,225,235,.55)" : (p.toColor || p.color); ctx.fill(new Path2D(p.arrowD)); }
        } catch {}
      });
      // 2) camada HTML (blocos/notas/imagens) — SVG escondido, fundo transparente
      h2c(ws, {
        backgroundColor: null, scale: S, logging: false, useCORS: true,
        onclone: (doc) => {
          doc.querySelectorAll(".edges,.strokes,.bg-particles").forEach(el => el.remove());
          doc.querySelectorAll(".block-skin polygon").forEach(el => { el.style.filter = "none"; });
        },
      }).then(layer => {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(layer, 0, 0);
        // 3) desenhos à mão livre por cima (ficam na frente dos blocos)
        worldTransform();
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        strokes.forEach(s => {
          const d = strokeToPath(s); if (!d) return;
          try {
            const path = new Path2D(d);
            ctx.save(); ctx.translate(s.x || 0, s.y || 0);
            if (s.fill) { ctx.fillStyle = `rgba(${hexToRgb(s.fill)},${s.fillOpacity ?? 1})`; ctx.fill(path); }
            ctx.strokeStyle = s.color || DEFAULT_COLOR; ctx.lineWidth = s.width || 3; ctx.stroke(path);
            ctx.restore();
          } catch {}
        });
        const a = document.createElement("a");
        a.href = out.toDataURL("image/png"); a.download = "canvas-tron.png"; a.click();
      }).catch(err => { console.error(err); alert("Falha ao exportar PNG: " + err.message); });
    }, 250);
  };

  /* ----- export / import ----- */
  const exportJSON = () => {
    const data = { blocks, notes, strokes, images, edges, view, map: { on: mapOn, struct: mapStruct } };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "canvas-tron.json";
    a.click();
  };
  // Carregar: aceita .json (mapa salvo) E .md/.txt (Markdown vira árvore).
  // Decide pelo nome do arquivo; se não for JSON válido, tenta como Markdown.
  const importJSON = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const text = String(r.result || "");
      if (/\.(md|markdown|txt)$/i.test(f.name) || !/^\s*[\[{]/.test(text)) { importMarkdownText(text); return; }
      try {
        const data = JSON.parse(text);
        setBlocks(data.blocks || []);
        setNotes(data.notes || []);
        setStrokes(data.strokes || []);
        setImages(data.images || []);
        setEdges(data.edges || []);
        if (data.view) setView(data.view);
        setMapOn(!!(data.map && data.map.on)); setMapStruct((data.map && data.map.struct) || "right");
        // bump id counter
        const ids = [...(data.blocks||[]),...(data.notes||[]),...(data.strokes||[]),...(data.images||[])].map(o=>parseInt(String(o.id).replace(/\D/g,""),10));
        _nid = Math.max(_nid, ...ids.filter(Number.isFinite)) + 1;
      } catch { alert("Arquivo inválido: esperava um .json salvo pelo Canvas ou um .md com títulos/listas."); }
    };
    r.readAsText(f);
    e.target.value = "";
  };
  const clearAll = () => {
    if (!confirm("Limpar todo o canvas?")) return;
    setBlocks([]); setNotes([]); setStrokes([]); setImages([]); setEdges([]); clearSelection();
  };
  // apaga só os rabiscos (pincel, formas, setas) e mantém o mapa; cai no histórico, Ctrl+Z desfaz
  const clearStrokes = () => {
    if (!strokes.length) return;
    setStrokes([]);
    setSelection(prev => { const n = new Set([...prev].filter(id => !strokes.some(s => s.id === id))); return n; });
  };

  /* ----- Markdown → mind map ----- */
  const mdInlineToHtml = (text) => {
    // Very light inline markdown support; escape first to avoid injection
    const esc = text
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return esc
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/__(.+?)__/g,     "<b>$1</b>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>")
      .replace(/(^|[^_])_([^_]+)_/g,   "$1<i>$2</i>")
      .replace(/`(.+?)`/g, "<code>$1</code>")
      .replace(/\n/g, "<br>");
  };

  // Markdown → árvore. Títulos (#, ##, ###) viram níveis; listas (-, *, +, 1.)
  // aninhadas por indentação viram filhos do título/item acima (é assim que
  // XMind, Notion e ChatGPT exportam). Linhas soltas viram corpo do nó atual.
  const parseMarkdownTree = (text) => {
    const lines = text.split(/\r?\n/);
    const rootNode = { level: 0, title: "Mapa Mental", body: "", children: [] };
    const stack = [rootNode];      // títulos
    let listStack = [];            // [{indent, node}] itens de lista sob o título atual
    let pending = [];
    let inFence = false;
    const curNode = () => listStack.length ? listStack[listStack.length - 1].node : stack[stack.length - 1];
    const flush = () => {
      if (!pending.length) return;
      const cur = curNode();
      const extra = pending.join("\n").trim();
      if (extra) cur.body = (cur.body ? cur.body + "\n" : "") + extra;
      pending = [];
    };
    for (const raw of lines) {
      const line = raw.replace(/\t/g, "    ");
      if (/^\s*```/.test(line)) { inFence = !inFence; pending.push(line); continue; }
      if (inFence) { pending.push(line); continue; }
      const h = line.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
      if (h) {
        flush();
        listStack = [];
        const level = h[1].length;
        while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
        const parent = stack[stack.length - 1];
        const node = { level, title: h[2], body: "", children: [] };
        parent.children.push(node);
        stack.push(node);
        continue;
      }
      const li = line.match(/^(\s*)(?:[-*+]|\d+[.)])\s+(?:\[[ xX]\]\s+)?(.+?)\s*$/);
      if (li) {
        flush();
        const indent = li[1].length;
        while (listStack.length && listStack[listStack.length - 1].indent >= indent) listStack.pop();
        const parent = listStack.length ? listStack[listStack.length - 1].node : stack[stack.length - 1];
        const node = { level: 99, title: li[2], body: "", children: [] };
        parent.children.push(node);
        listStack.push({ indent, node });
        continue;
      }
      // linha em branco fecha a lista só se a próxima coisa não for item (tratado
      // naturalmente: item novo com indent menor/igual faz pop)
      pending.push(line);
    }
    flush();
    // Se só existe um título de topo, ele vira a raiz de verdade
    if (rootNode.children.length === 1 && !rootNode.body) return rootNode.children[0];
    return rootNode;
  };

  const buildMindMapFromTree = (root, originX, originY) => {
    const newBlocks = [];
    const newEdges = [];
    const COL_W = 360;
    const ROW_H = 140;
    const B_W = 260;
    const B_H = 90;

    // Row assignment via in-order traversal (leaves consume sequential rows;
    // parents center themselves between their first and last child rows)
    let rowCursor = 0;
    const assignLayout = (node, depth, color) => {
      node._depth = depth;
      node._color = color;
      if (!node.children || node.children.length === 0) {
        node._row = rowCursor++;
      } else {
        const firstRow = rowCursor;
        node.children.forEach((child, i) => {
          // Top-level children of synthetic root pick a distinct preset;
          // everyone else inherits parent color
          // ramos principais ganham cores distintas (como o Tab no Modo Mapa)
          const childColor = depth === 0 ? PRESET_COLORS[i % PRESET_COLORS.length] : color;
          assignLayout(child, depth + 1, childColor);
        });
        const lastRow = rowCursor - 1;
        node._row = (firstRow + lastRow) / 2;
      }
    };
    assignLayout(root, 0, "#00f0ff");

    const idMap = new Map();
    const addBlocks = (node) => {
      const id = uid();
      idMap.set(node, id);
      newBlocks.push({
        id,
        x: originX + node._depth * COL_W,
        y: originY + node._row   * ROW_H,
        w: B_W, h: B_H,
        color: node._color,
        title: mdInlineToHtml(node.title),
        body: node.body ? mdInlineToHtml(node.body) : "",
      });
      if (node.children) {
        node.children.forEach(child => {
          addBlocks(child);
          newEdges.push({
            id: uid(),
            from: { id: idMap.get(node),  port: "right" },
            to:   { id: idMap.get(child), port: "left"  },
          });
        });
      }
    };
    addBlocks(root);
    return { newBlocks, newEdges };
  };

  const importMarkdownText = (text) => {
      try {
        const tree = parseMarkdownTree(text);
        if (tree.level === 0 && !tree.children.length) { alert("Nenhum título (#) nem item de lista (-) encontrado no arquivo."); return; }
        // Modo Mapa com conteúdo: a árvore nova nasce ABAIXO do que já existe
        // (a raiz é a âncora do layout; no centro ela cairia em cima do mapa).
        // Senão, no centro da tela pra aparecer na hora.
        let ox, oy;
        const cur = blocksRef.current;
        if (mapOnRef.current && cur.length) {
          ox = Math.min(...cur.map(b => b.x));
          oy = Math.max(...cur.map(b => b.y + (sizesRef.current[b.id]?.h ?? b.h ?? 80))) + 140;
        } else {
          ox = (-view.x + window.innerWidth  / 2) / view.scale - 200;
          oy = (-view.y + window.innerHeight / 2) / view.scale - 200;
        }
        const { newBlocks, newEdges } = buildMindMapFromTree(tree, ox, oy);
        if (!newBlocks.length) { alert("Nenhum título ou item de lista encontrado no arquivo Markdown."); return; }
        setBlocks(prev => [...prev, ...newBlocks]);
        setEdges(prev => [...prev, ...newEdges]);
        // no Modo Mapa o layout assenta em ~300ms; depois enquadra tudo
        if (mapOnRef.current) setTimeout(() => fitAllRef.current && fitAllRef.current(), 500);
      } catch (err) {
        console.error(err);
        alert("Erro ao importar: " + err.message);
      }
  };
  const importMarkdown = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => importMarkdownText(r.result);
    r.readAsText(f);
    e.target.value = "";
  };

  /* ----- edge paths ----- */
  const STUB_LEN = 56;
  const PORT_DIR = {
    top:    { x: 0, y:-1 },
    bottom: { x: 0, y: 1 },
    left:   { x:-1, y: 0 },
    right:  { x: 1, y: 0 },
  };
  // Ligações recolhidas que saem da MESMA porta do mesmo bloco: as pílulas
  // abrem em leque (lado a lado numa porta vertical, empilhadas numa
  // horizontal) em vez de cair todas no mesmo ponto.
  const collapsedGroups = new Map();
  edges.forEach(e => {
    if (!e.collapsed) return;
    const key = e.collapseDir === "backward" ? e.to.id + ":" + e.to.port : e.from.id + ":" + e.from.port;
    if (!collapsedGroups.has(key)) collapsedGroups.set(key, []);
    collapsedGroups.get(key).push(e.id);
  });
  const edgePaths = edges.map(e => {
    const a = blocksById.get(e.from.id);
    const b = blocksById.get(e.to.id);
    if (!a || !b) return null;
    const sourceHidden = hiddenBlockIds.has(a.id);
    const targetHidden = hiddenBlockIds.has(b.id);
    const sa = sizes[a.id], sb = sizes[b.id];

    const dir1 = PORT_DIR[e.from.port] || { x: 1, y: 0 };
    const dir2 = PORT_DIR[e.to.port]   || { x:-1, y: 0 };

    if (e.collapsed) {
      // Draw a stub sprouting from the CLICKED (near) port, apontando na direção
      // do bloco filho oculto — assim vertentes diferentes (SIM/NÃO) se abrem em
      // leque em vez de sobrepor. O badge mostra o NOME do próximo bloco.
      const backward = e.collapseDir === "backward";
      const nearBlock   = backward ? b : a;
      const farBlock    = backward ? a : b;
      const nearPort    = backward ? e.to.port : e.from.port;
      const nearHidden  = backward ? targetHidden : sourceHidden;
      if (nearHidden) return null;
      const p1 = portWorldPos(a, e.from.port, sa);
      const p2 = portWorldPos(b, e.to.port, sb);
      const nearPos = backward ? p2 : p1;
      const fsz = backward ? sa : sb;
      const fw = fsz?.w ?? farBlock.w ?? 240, fh = fsz?.h ?? farBlock.h ?? 80;
      const fcx = farBlock.x + fw / 2, fcy = farBlock.y + fh / 2;
      let dx = fcx - nearPos.x, dy = fcy - nearPos.y;
      const dl = Math.hypot(dx, dy);
      const grp = collapsedGroups.get(nearBlock.id + ":" + nearPort) || [e.id];
      const gi = grp.indexOf(e.id), gn = grp.length;
      const pd = PORT_DIR[nearPort] || { x: 0, y: 1 };
      // No Modo Mapa a pílula sai SEMPRE reto pela porta (o filho escondido
      // fica parado onde estava e pode estar em cima do pai). No livre, sozinha
      // aponta pro filho escondido; em grupo, todas saem reto e abrem em leque.
      const dir = (mapOn || gn > 1 || dl <= 6) ? pd : { x: dx / dl, y: dy / dl };
      const spacing = pd.x === 0 ? 118 : 30; // porta vertical: pílulas lado a lado; horizontal: empilhadas
      const off = (gi - (gn - 1) / 2) * spacing;
      const perp = { x: -pd.y, y: pd.x };
      const stubEnd = { x: nearPos.x + dir.x * STUB_LEN + perp.x * off, y: nearPos.y + dir.y * STUB_LEN + perp.y * off };
      const label = (farBlock.title || "").replace(/<[^>]*>/g, "").trim();
      return {
        id: e.id,
        curveD: orthogonalPath(p1, dir1, p2, dir2),
        stubD: `M ${nearPos.x} ${nearPos.y} L ${stubEnd.x} ${stubEnd.y}`,
        stubEnd,
        color: farBlock.color || nearBlock.color || DEFAULT_COLOR,
        collapsed: true,
        count: collapsedCount(e),
        label,
      };
    }

    // Non-collapsed edge: hide entirely if either endpoint is in the hidden set
    if (sourceHidden || targetHidden) return null;
    const p1 = portWorldPos(a, e.from.port, sa);
    const p2 = portWorldPos(b, e.to.port, sb);
    const wps = e.waypoints || [];
    const style = e.style || "curved"; // padrão: linha curva (não mais ortogonal)
    const pts = [p1, ...wps, p2];

    // Choose how to draw the path: auto-route when straight, route through waypoints when bent
    let curveD;
    if (wps.length === 0) {
      if (style === "straight")      curveD = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
      else if (style === "ortho")    curveD = orthogonalPath(p1, dir1, p2, dir2);
      else                           curveD = mapOn ? mapBezier(p1, dir1, p2, dir2) : dirBezier(p1, dir1, p2, dir2);
    } else {
      if (style === "ortho")         curveD = roundedPolyPath(pts, 14);
      else if (style === "straight") curveD = roundedPolyPath(pts, 0);
      else                           curveD = catmullRomPath(pts);
    }
    // Midpoint of the central segment — anchors the style toggle
    const mi = Math.floor((pts.length - 1) / 2);
    const mid = { x: (pts[mi].x + pts[mi+1].x) / 2, y: (pts[mi].y + pts[mi+1].y) / 2 };

    // Directional arrowhead at the target end (on by default). Orient it along
    // the real travel direction into the port so it reads as "sai de A → vai pra B".
    const arrow = e.arrow === true; // padrão: só linha; seta é opt-in
    let arrowD = "";
    if (arrow) {
      let adx, ady;
      if (style === "straight") {
        const prev = pts[pts.length - 2] || p1;
        adx = p2.x - prev.x; ady = p2.y - prev.y;
      } else {
        adx = -dir2.x; ady = -dir2.y; // curva/orto chegam alinhadas à normal da porta
      }
      const al = Math.hypot(adx, ady) || 1;
      const ang = Math.atan2(ady / al, adx / al);
      const AH = 13, spread = 0.46;
      const wx1 = p2.x - AH * Math.cos(ang - spread), wy1 = p2.y - AH * Math.sin(ang - spread);
      const wx2 = p2.x - AH * Math.cos(ang + spread), wy2 = p2.y - AH * Math.sin(ang + spread);
      arrowD = `M ${p2.x} ${p2.y} L ${wx1} ${wy1} L ${wx2} ${wy2} Z`;
    }

    return {
      id: e.id,
      curveD,
      stubD: "",
      stubEnd: { x: 0, y: 0 },
      color: a.color || DEFAULT_COLOR,
      fromColor: a.color || DEFAULT_COLOR,
      toColor:   b.color || DEFAULT_COLOR,
      p1, p2, pts, wps, mid, style, arrow, arrowD,
      collapsed: false,
      count: 0,
    };
  }).filter(Boolean);

  /* ----- breadcrumb: caminho raiz → nó atual ----- */
  const buildCrumbs = (id) => {
    const chain = [];
    const seen = new Set();
    let cur = id;
    while (cur && !seen.has(cur)) {
      seen.add(cur);
      const b = blocksById.get(cur);
      if (!b) break;
      chain.unshift(b);
      const parent = edges.find(e => e.to.id === cur && !hiddenBlockIds.has(e.from.id));
      cur = parent ? parent.from.id : null;
    }
    return chain;
  };
  const crumbNodeId = present ? focusId : (selection.size === 1 ? [...selection][0] : null);
  const crumbs = (crumbNodeId && blocksById.has(crumbNodeId)) ? buildCrumbs(crumbNodeId) : [];
  const crumbText = (b) => {
    const t = (b.title || "").replace(/<[^>]*>/g, "").trim();
    return t || "(sem título)";
  };

  /* ----- minimap data ----- */
  const mmData = (() => {
    if (!showMinimap || present) return null;
    const vis = blocks.filter(b => !hiddenBlockIds.has(b.id));
    if (!vis.length) return null;
    const vw = window.innerWidth / view.scale, vh = window.innerHeight / view.scale;
    const vx = -view.x / view.scale, vy = -view.y / view.scale;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

                    <span className="lbl">Tamanho</span>

                        <button
                          key={sz}
                          className={`fmt-btn ${cur === sz ? "active" : ""}`}

            {hasBlockSel && (() => {

              return (
                <>
                  <div className="vsep"/>
                  <div className="group">
                    <span className="lbl">Imagem</span>
                    <button className="shape-btn" onClick={() => blockImgRef.current.click()} title={hasImg ? "Trocar a imagem do bloco" : "Inserir imagem no bloco"}>
                      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15 l-5-5 -8 8"/></svg>
                    </button>
                    {hasImg && (
                      <button className="shape-btn eraser" onClick={removeBlockImage} title="Remover a imagem do bloco">
                        <svg viewBox="0 0 24 24"><path d="M5 5 L19 19 M19 5 L5 19"/></svg>
                      </button>
                    )}
                  </div>
                  {!PC && <><div className="vsep"/>
                  <div className="group">
                    <span className="lbl">Modelo</span>
                    <button className="shape-btn" onClick={saveBlockAsPreset} title="Salvar como modelo: cor, forma, texto e documento deste bloco viram um bloco pronto (tecla M)">
                      <svg viewBox="0 0 24 24"><path d="M6 3h10l3 3v15H6z"/><path d="M9 3v5h6V3 M12 12v6 M9 15h6"/></svg>
                    </button>
                  </div></>}
                  <div className="vsep"/>
                  <div className="group">
                    <span className="lbl">Documento</span>
                    <button className={`shape-btn ${selBlock && selBlock.doc ? "active" : ""}`} onClick={() => selBlock && openDoc(selBlock.id)} title={selBlock && selBlock.doc ? "Abrir o documento do bloco" : "Criar um documento dentro do bloco (roteiro, notas)"}>
                      <svg viewBox="0 0 24 24"><path d="M14 3 H7 a2 2 0 0 0 -2 2 v14 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 V8 Z"/><path d="M14 3 v5 h5 M9 13 h6 M9 17 h4"/></svg>
                    </button>
                  </div>
                  {!PC && <><div className="vsep"/>
                  <div className="group">
                    <span className="lbl">Quadro</span>
                    <button className={`shape-btn ${selBlock && selBlock.board ? "active" : ""}`} onClick={createBoard} title={selBlock && selBlock.board ? "Abrir o quadro (pipeline) do bloco" : "Criar um quadro/pipeline dentro do bloco (colunas e cartões)"}>
                      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="4.5" height="16" rx="1"/><rect x="9.75" y="4" width="4.5" height="11" rx="1"/><rect x="16.5" y="4" width="4.5" height="16" rx="1"/></svg>
                    </button>
                  </div></>}
                  <div className="vsep"/>
                  <div className="group">
                    <span className="lbl">Ramo</span>
                    <button className="shape-btn" onClick={addYesNoBranch} title="Cria dois filhos ligados abaixo: NÃO (vermelho) e SIM (verde)">
                      <svg viewBox="0 0 24 24"><path d="M12 3 V9 M12 9 L5 15 M12 9 L19 15"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/></svg>
                    </button>
                  </div>
                  <div className="vsep"/>
                  <div className="group">
                    <span className="lbl">Ênfase</span>
                    <button className={`shape-btn ${selBlock && selBlock.emphasis ? "active" : ""}`} onClick={toggleBlockEmphasis} title="Destaca o bloco com um brilho pulsante">
                      <svg viewBox="0 0 24 24"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z"/></svg>
                    </button>
                  </div>
                </>
              );
            })()}
            {hasStrokeSel && (
              <>
                <div className="vsep"/>
                <div className="group">
                  <span className="lbl">Espessura</span>
                  {[2,4,7,11].map(w => {
                    const sel = strokes.find(s => selection.has(s.id));
                    const active = sel && sel.width === w;
                    return (
                      <button
                        key={w}
                        className={`width-btn ${active?"active":""}`}
                        onClick={() => setSelectedStrokeWidth(w)}
                        style={{ color: activeColor || "#00f0ff" }}
                        title={`${w}px`}
                      >
                        <div className="dot" style={{ width: w+"px", height: w+"px" }} />
                      </button>
                    );
                  })}
                </div>
                {(() => {
                  const sel = strokes.find(s => selection.has(s.id));
                  if (!sel || (sel.type !== "rect" && sel.type !== "ellipse")) return null;
                  const hasFill = !!sel.fill;
                  const fc = sel.fill || "#00f0ff";
                  const op = sel.fillOpacity ?? 0.25;
                  return (
                    <>
                      <div className="vsep"/>
                      <div className="group">
                        <span className="lbl">Preench.</span>
                        <button className={`shape-btn ${hasFill?"active":""}`} onClick={() => patchSelectedStrokes(hasFill ? { fill: null } : { fill: fc, fillOpacity: op })} title="Liga/desliga o preenchimento">
                          <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
                        </button>
                        {hasFill && PRESET_COLORS.map(c => (
                          <div key={c} className="swatch" style={{ background:c, color:c, width:18, height:18, boxShadow: fc===c?`0 0 0 2px #fff,0 0 8px ${c}`:`0 0 6px ${c}` }} onClick={() => patchSelectedStrokes({ fill: c })} title={c} />
                        ))}
                        {hasFill && (
                          <label className="swatch custom" style={{ width:18, height:18 }} title="Cor de preenchimento personalizada">
                            <input type="color" value={fc} onChange={(e) => patchSelectedStrokes({ fill: e.target.value })} />
                          </label>
                        )}
                        {hasFill && (
                          <span style={{ display:"flex", alignItems:"center", color: fc }}>
                            <input type="range" className="opacity-range" min="0" max="100" value={Math.round(op*100)} onChange={(e) => patchSelectedStrokes({ fillOpacity: Number(e.target.value)/100 })} title="Opacidade do preenchimento" />
                            <span className="pct">{Math.round(op*100)}%</span>
                          </span>
                        )}
                      </div>
                    </>
                  );
                })()}
              </>
            )}
            {hasNoteSel && (
              <>
                <div className="vsep"/>
                <div className="group">
                  <span className="lbl">Tamanho</span>
                  {[12,16,22,32].map(sz => {
                    const sel = notes.find(n => selection.has(n.id));
                    const active = sel && sel.fontSize === sz;
                    return (
                      <button
                        key={sz}
                        className={`width-btn ${active?"active":""}`}
                        onClick={() => setSelectedFontSize(sz)}
                        style={{ color: activeColor || "#ff9d00", fontSize: Math.min(sz, 20)+"px", fontWeight: 700, fontStyle: "italic" }}
                        title={`${sz}px`}
                      >T</button>
                    );
                  })}
                </div>
                <div className="vsep"/>
                <div className="group">
                  <span className="lbl">Moldura</span>
                  {(() => {
                    const sel = notes.find(n => selection.has(n.id));
                    const on = sel && sel.frame !== false;
                    return (
                      <button className={`shape-btn ${on?"active":""}`} onClick={toggleNoteFrame} title="Liga/desliga a caixa em volta do texto">
                        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
                      </button>
                    );
                  })()}
                </div>
              </>
            )}
          </div>
        );
      })()}

      <div
        ref={wsRef}
        className={`workspace ${tool === "select" && !arrowMode ? "hand" : ""} ${tool === "block" ? "tool-block" : ""} ${tool === "note" ? "tool-note" : ""} ${tool === "draw" && drawShape !== "eraser" ? "tool-draw" : ""} ${tool === "draw" && drawShape === "eraser" ? "tool-eraser" : ""}`}
        onMouseDown={onWorkspaceDown}
        onDoubleClick={(e) => {
          // duplo-clique finaliza a linha de pontos em andamento
          if (drawing && drawing.type === "polyline") { finishPolyline(); return; }
          // Double-click on empty canvas creates a new block
          if (tool !== "select") return;
          if (e.target !== wsRef.current && !e.target.classList.contains("world") && e.target.tagName !== "svg") return;
          const wp = screenToWorld(e.clientX, e.clientY);
          createBlock(wp.x, wp.y);
        }}
        onDragOver={(e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) e.preventDefault(); }}
        onDrop={(e) => {
          const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (f && f.type.indexOf("image/") === 0) { e.preventDefault(); addImageFromBlob(f, screenToWorld(e.clientX, e.clientY)); }
        }}
        onWheel={onWheel}
      >
        <div className={`world ${present ? "present" : ""} ${spotlight && !present ? "spotlight" : ""}`} style={{ transform:`translate(${view.x}px,${view.y}px) scale(${view.scale})` }}>
          {/* freehand strokes + shapes (z-index:5 → rendered IN FRONT of blocks) */}
          <svg className="strokes" xmlns="http://www.w3.org/2000/svg">
            {strokes.map(s => {
              const d = strokeToPath(s);
              if (!d) return null;
              const isSel = selection.has(s.id);
              // vínculo com bloco: some quando o ramo recolhe, acende junto na apresentação/holofote
              const anchored = !!(s.anchorId && blocksById.has(s.anchorId));
              const anchorHidden = anchored && hiddenBlockIds.has(s.anchorId);
              const lit = anchored && ((present && s.anchorId === focusId) || (spotlight && !present && selection.has(s.anchorId)));
              return (
                <g
                  key={s.id}
                  data-id={s.id}
                  className={`${isSel ? "selected" : ""} ${anchored ? "anchored" : ""} ${anchorHidden ? "hidden" : ""} ${lit ? "lit" : ""}`}
                  transform={`translate(${s.x||0},${s.y||0})`}
                  style={{ color: s.color || DEFAULT_COLOR }}
                >
                  <path
                    d={d}
                    className="stroke-hit"
                    style={s.fill ? { fill: "transparent", pointerEvents: "all" } : undefined}
                    onMouseDown={(ev) => {
                      ev.stopPropagation();
                      if (tool === "draw" && drawShape === "eraser") {
                        setStrokes(p => p.filter(x => x.id !== s.id));
                        return;
                      }
                      // Drawing tool active: a press on an existing stroke must
                      // START a new stroke/note here — not grab the old one.
                      if (tool === "draw") {
                        if (drawShape === "text") {
                          const wp = screenToWorld(ev.clientX, ev.clientY);
                          createNote(wp.x, wp.y, drawColor, drawFontSize, noteFrame);
                        } else {
                          beginDrawAt(ev.clientX, ev.clientY);
                        }
                        return;
                      }
                      selectOne(s.id, ev.shiftKey);
                      startDrag(ev, s.id);
                    }}
                  />
                  <path
                    d={d}
                    className="stroke-line"
                    style={{
                      stroke: s.color || DEFAULT_COLOR, strokeWidth: s.width || 3,
                      fill: s.fill || "none", fillOpacity: s.fill ? (s.fillOpacity ?? 1) : undefined,
                    }}
                  />
                </g>
              );
            })}
            {drawing && (() => {
              const d = strokeToPath(drawing);
              if (!d) return null;
              return (
                <path
                  d={d}
                  className="stroke-line"
                  style={{
                    stroke: drawing.color, strokeWidth: drawing.width, color: drawing.color,
                    fill: drawing.fill || "none", fillOpacity: drawing.fill ? (drawing.fillOpacity ?? 1) : undefined,
                  }}
                />
              );
            })()}
          </svg>

          <svg className="edges" xmlns="http://www.w3.org/2000/svg">
            <defs>
              {edgePaths.filter(p => !p.collapsed && p.fromColor !== p.toColor).map(p => (
                <linearGradient
                  key={`g-${p.id}`}
                  id={`edge-g-${p.id}`}
                  gradientUnits="userSpaceOnUse"
                  x1={p.p1.x} y1={p.p1.y}
                  x2={p.p2.x} y2={p.p2.y}
                >
                  <stop offset="0%"   stopColor={p.fromColor} style={{ stopColor: p.fromColor }} />
                  <stop offset="100%" stopColor={p.toColor}   style={{ stopColor: p.toColor   }} />
                </linearGradient>
              ))}
            </defs>
            {edgePaths.map(p => {
              const useGradient = !p.collapsed && p.fromColor !== p.toColor;
              const strokeVal = useGradient ? `url(#edge-g-${p.id})` : p.color;
              const isSel = selectedEdge === p.id;
              return (
                <g key={p.id}>
                  {/* Full curve — visible when not collapsed */}
                  <path
                    d={p.curveD}
                    className={"edge-line cc-l " + (p.collapsed ? "gone" : "") + (isSel ? " sel" : "")}
                    stroke={strokeVal}
                    data-stroke={p.color}
                    strokeWidth={isSel ? 4 : 2.2}
                    style={{ filter: isSel ? "drop-shadow(0 0 3px #fff)" : "none" }}
                  />
                  {/* camada do estilo de linha do app (cabo de transmissão, feixe de luz): segue a mesma curva */}
                  {PC && !p.collapsed && <path d={p.curveD} className="cc-lx" style={{ animationDelay: `-${(String(p.id).split("").reduce((s, ch) => s + ch.charCodeAt(0), 0) % 32) / 10}s` }}/>}
                  {/* Energy beam running source → target. Two layers, both using
                      the edge's own gradient so even the GLOW follows the degradê:
                      a thick blurred halo + a crisp core, flowing together. */}
                  {flow && !p.collapsed && (() => {
                    const fStroke = useGradient ? `url(#edge-g-${p.id})` : p.color;
                    return (
                      <>
                        <path d={p.curveD} className="flow-glow"  stroke={fStroke} />
                        <path d={p.curveD} className="flow"       stroke={fStroke} />
                        <path d={p.curveD} className="flow-spark" stroke={fStroke} />
                      </>
                    );
                  })()}
                  {/* Directional arrowhead at the target (A → B).
                      fill MUST come via style — the `.edges path{fill:none}` rule
                      would otherwise override a fill="" attribute and hide it. */}
                  {p.arrowD && (
                    <path
                      d={p.arrowD}
                      className="edge-arrow"
                      style={{ fill: p.toColor || p.color, stroke: "none" }}
                    />
                  )}
                  {/* Short stub — visible when collapsed */}
                  <path
                    d={p.stubD}
                    className={"stub " + (p.collapsed ? "" : "gone")}
                    stroke={p.color}
                    style={{ filter: "none" }}
                  />
                  {/* Invisible thick hit area — click selects, drag bends the line */}
                  <path
                    d={p.collapsed ? p.stubD : p.curveD}
                    fill="none"
                    stroke="transparent"
                    strokeWidth={18}
                    style={{ pointerEvents: "stroke", cursor: p.collapsed ? "pointer" : "grab" }}
                    onMouseDown={(ev) => {
                      ev.stopPropagation();
                      if (p.collapsed) { clearSelection(); setSelectedEdge(p.id); return; }
                      // Start a press: a tiny move turns it into a bend (waypoint), else it's a select
                      edgeEditRef.current = {
                        kind: "press", edgeId: p.id,
                        startScreen: { x: ev.clientX, y: ev.clientY },
                        wp: screenToWorld(ev.clientX, ev.clientY),
                        pts: p.pts,
                      };
                    }}
                    onDoubleClick={(ev) => {
                      // duplo-clique na conexão recolhe só esse ramo
                      ev.stopPropagation();
                      if (!p.collapsed) { edgeEditRef.current = null; collapseEdgeById(p.id); setSelectedEdge(null); }
                    }}
                  />
                </g>
              );
            })}
            {pulses.map(pl => {
              const p = edgePaths.find(x => x.id === pl.edgeId);
              if (!p || p.collapsed) return null;
              const col = pl.dir === "fwd" ? (p.fromColor || p.color) : (p.toColor || p.color);
              return (
                <path key={pl.key} d={p.curveD} pathLength="100"
                  className={`pulse ${pl.dir}`}
                  style={{ stroke: col, color: col }} />
              );
            })}
            {/* fios de vínculo desenho↔bloco: tracejado fino, cor do bloco, da porta até a
                borda do desenho. Clica pra selecionar, Del desvincula. */}
            {strokes.map(s => {
              if (!s.anchorId) return null;
              const b = blocksById.get(s.anchorId);
              if (!b || hiddenBlockIds.has(b.id)) return null;
              const bb = strokeBBox(s);
              if (!bb) return null;
              const pp = portWorldPos(b, s.anchorPort || "right", sizes[b.id]);
              // ponto da caixa do desenho mais próximo da porta
              const tx = Math.max(bb.x, Math.min(pp.x, bb.x + bb.w));
              const ty = Math.max(bb.y, Math.min(pp.y, bb.y + bb.h));
              const d = `M ${pp.x} ${pp.y} L ${tx} ${ty}`;
              const col = b.color || DEFAULT_COLOR;
              const sel = selectedAnchor === s.id;
              return (
                <g key={"anchor-" + s.id}>
                  <path d={d} className={`anchor ${sel ? "selected" : ""}`} style={{ stroke: col, color: col }} />
                  <path d={d} className="anchor-hit"
                    style={{ pointerEvents: "stroke", cursor: "pointer" }}
                    onMouseDown={(ev) => { ev.stopPropagation(); clearSelection(); setSelectedAnchor(s.id); }} />
                </g>
              );
            })}
            {preview && <path d={bezierPath(preview.from, preview.to)} className="preview" />}
          </svg>

          {/* collapse badges — positioned at the stub's outer end */}
          {edgePaths.filter(p => p.collapsed).map(p => (
            <div
              key={"badge-"+p.id}
              className="collapse-badge-wrap"
              style={{ left: p.stubEnd.x, top: p.stubEnd.y, color: p.color }}
              onMouseDown={(e) => { e.stopPropagation(); toggleEdgeCollapse(p.id); }}
              title={p.label ? `Expandir: ${p.label}` : "Expandir"}
            >
              <div className={`collapse-badge ${p.label ? "named" : ""}`} style={{ color: p.color }}>
                <span className="icon">▸</span><span className="badge-txt">{p.label || ("+" + p.count)}</span>
              </div>
            </div>
          ))}

          {images.map(im => (
            <ImageNode
              key={im.id}
              image={im}
              selected={selection.has(im.id)}
              onSelect={selectOne}
              onStartDrag={(e) => startDrag(e, im.id)}
              onStartResize={startResize}
              onDelete={removeImage}
              onEraser={(id) => {
                if (tool === "draw" && drawShape === "eraser") { removeImage(id); return true; }
                return false;
              }}
            />
          ))}

          {blocks.map(b => (
            <Block
              key={b.id}
              block={b}
              selected={selection.has(b.id)}
              hidden={hiddenBlockIds.has(b.id)}
              focused={present && b.id === focusId}
              lit={spotlight && !present && selection.has(b.id)}
              pendingEditRef={pendingEditRef}
              onSelect={(id, additive) => { selectOne(id, additive); pulseFrom(id); }}
              onStartDrag={(e) => startDrag(e, b.id)}
              onStartConnection={startConnection}
              onStartResize={startResize}
              onDelete={deleteBlock}
              onChange={updateBlock}
              onEditingBodyChange={(id, on) => {
                if (on) setEditingBodyId(id);
                else setEditingBodyId(curr => curr === id ? null : curr);
              }}
              onEditingTitleChange={(id, on) => {
                if (on) setEditingTitleId(id);
                else setEditingTitleId(curr => curr === id ? null : curr);
              }}
              onMeasure={reportSize}
              mapMode={mapOn}
              onEnterSibling={createSiblingBlock}
              editReq={editReq}
              onOpenDoc={openDoc}
              onOpenBoard={openBoard}
              readOnly={VIEW_ONLY}
            />
          ))}
          {marquee && <div className="marquee-rect" style={{ left: marquee.x, top: marquee.y, width: marquee.w, height: marquee.h }} />}
          {notes.map(n => (
            <Note
              key={n.id}
              note={n}
              selected={selection.has(n.id)}
              pendingEditRef={pendingNoteEditRef}
              onSelect={selectOne}
              onStartDrag={(e) => startDrag(e, n.id)}
              onChange={updateNote}
              onRemove={removeNote}
              onEditingChange={(id, on) => {
                if (on) setEditingNoteId(id);
                else setEditingNoteId(curr => curr === id ? null : curr);
              }}
              onEraser={(id) => {
                if (tool === "draw" && drawShape === "eraser") {
                  setNotes(p => p.filter(x => x.id !== id));
                  return true;
                }
                return false;
              }}
            />
          ))}

          {/* connection edit handles — shown for the selected (non-collapsed) edge.
              Rendered after blocks so they sit above the ports and stay clickable.
              scale(1/view.scale) keeps them a constant size on screen at any zoom. */}
          {selectedEdge && (() => {
            const p = edgePaths.find(x => x.id === selectedEdge);
            if (!p || p.collapsed) return null;
            const inv = `scale(${1/view.scale})`;
            const styleLabel = p.style === "curved" ? "↝ CURVA" : p.style === "straight" ? "╱ RETA" : "⌐ ORTO";
            return (
              <div className="edge-edit">
                <div
                  className="edge-style-btn"
                  style={{ left: p.mid.x, top: p.mid.y, color: p.toColor || p.color, transform: `translate(-50%,-50%) ${inv}` }}
                  title="Estilo da linha: curva → ortogonal → reta"
                  onMouseDown={(e) => { e.stopPropagation(); cycleEdgeStyle(p.id); }}
                >{styleLabel}</div>
                <div
                  className="edge-style-btn"
                  style={{ left: p.mid.x, top: p.mid.y + 24, color: p.toColor || p.color, transform: `translate(-50%,-50%) ${inv}` }}
                  title="Mostrar/ocultar a setinha de direção"
                  onMouseDown={(e) => { e.stopPropagation(); toggleEdgeArrow(p.id); }}
                >{p.arrow ? "➤ SETA" : "⊘ SETA"}</div>
                <div
                  className="edge-style-btn"
                  style={{ left: p.mid.x, top: p.mid.y + 48, color: p.toColor || p.color, transform: `translate(-50%,-50%) ${inv}` }}
                  title="Recolher só este ramo (esconde o lado do filho, o mais longe da raiz)"
                  onMouseDown={(e) => { e.stopPropagation(); collapseEdgeById(p.id); setSelectedEdge(null); }}
                >⊟ RECOLHER</div>
                {[["from", p.p1, p.fromColor], ["to", p.p2, p.toColor]].map(([end, pos, col]) => (
                  <div
                    key={end}
                    className="edge-handle endpoint"
                    style={{ left: pos.x, top: pos.y, color: col, transform: `translate(-50%,-50%) ${inv}` }}
                    title="Arraste para outra porta"
                    onMouseDown={(e) => {
                      e.stopPropagation();
                      edgeEditRef.current = { kind: "endpoint", edgeId: p.id, end, fixed: end === "from" ? p.p2 : p.p1, moved: false };
                    }}
                  />
                ))}
                {p.wps.map((w, i) => (
                  <div
                    key={"wp"+i}
                    className="edge-handle waypoint"
                    style={{ left: w.x, top: w.y, color: p.toColor || p.color, transform: `translate(-50%,-50%) ${inv}` }}
                    title="Arraste para mover · duplo-clique remove"
                    onMouseDown={(e) => { e.stopPropagation(); edgeEditRef.current = { kind: "waypoint", edgeId: p.id, index: i }; }}
                    onDoubleClick={(e) => { e.stopPropagation(); removeWaypoint(p.id, i); }}
                  />
                ))}
              </div>
            );
          })()}
        </div>
      </div>

      <div className="zoomctl">
        <button className="zbtn" onClick={() => zoomBy(1/1.2)} aria-label="Diminuir zoom" title="Diminuir zoom">−</button>
        <div className="zoom" onClick={() => { if (PC && zoomRef.current) { pararFisica(); zoomRef.current.para(1, window.innerWidth / 2, window.innerHeight / 2); } else zoomBy(1/view.scale); }} title="Voltar pra 100%  Ctrl 1">{Math.round(view.scale*100)}%</div>
        <button className="zbtn" onClick={() => zoomBy(1.2)} aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
        {PC && <i className="zsep"/>}
        <button className="zbtn" onClick={fitAll} aria-label="Enquadrar tudo" title="Enquadrar tudo">{PC ? <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M4 9V5a1 1 0 011-1h4M15 4h4a1 1 0 011 1v4M20 15v4a1 1 0 01-1 1h-4M9 20H5a1 1 0 01-1-1v-4"/></svg> : "⊡"}</button>
        {PC && <button className={"zbtn " + (showMinimap ? "on" : "")} onClick={() => setShowMinimap(v => !v)} aria-label="Minimapa" title="Minimapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><rect x="12" y="11" width="6" height="5" rx="1"/></svg></button>}
      </div>
      <div className="hint">
        {mapOn
          ? (<><b>Tab</b> filho • <b>Enter</b> irmão • <b>Ctrl+Enter</b> corpo • <b>setas</b> navegar • <b>F2</b> editar • <b>arrasta</b> reordena • <b>Del</b> apaga o ramo • <b>P</b> apresentar • <b>Ctrl+Z</b> desfazer</>)
          : PC ? (<><b>B</b> bloco • <b>Tab</b> filho • <b>botão direito</b> arrasta • <b>Ctrl+F</b> buscar • <b>?</b> atalhos • <b>Ctrl+Z</b> desfazer • <b>duplo-clique</b> editar • <b>Del</b> apagar</>)
          : (<><b>B</b> bloco • <b>Tab</b> filho • <b>N</b> texto • <b>D</b> desenho • <b>Ctrl</b> mão/seta • <b>P</b> apresentar • <b>Ctrl+Z</b> desfazer • <b>clica na linha</b> editar/estilo • <b>duplo-clique</b> editar • <b>Del</b> apagar</>)}
      </div>

      {mmData && (
        <div
          className="minimap"
          style={{ width: mmData.W, height: mmData.H }}
          onMouseDown={mmJump}
          onMouseMove={(e) => { if (e.buttons === 1) mmJump(e); }}
          title="Minimapa — clique/arraste pra navegar"
        >
          <svg width={mmData.W} height={mmData.H}>
            {mmData.vis.map(b => {
              const w = (sizes[b.id]?.w) || b.w || 240, h = (sizes[b.id]?.h) || b.h || 80;
              return (
                <rect
                  key={b.id}
                  x={(b.x - mmData.minX) * mmData.sc}
                  y={(b.y - mmData.minY) * mmData.sc}
                  width={Math.max(2, w * mmData.sc)}
                  height={Math.max(2, h * mmData.sc)}
                  rx={1.5}
                  fill={b.color || DEFAULT_COLOR}
                  opacity={selection.has(b.id) ? 1 : 0.7}
                />
              );
            })}
            <rect
              className="mm-view"
              x={(mmData.vx - mmData.minX) * mmData.sc}
              y={(mmData.vy - mmData.minY) * mmData.sc}
              width={mmData.vw * mmData.sc}
              height={mmData.vh * mmData.sc}
              rx={2}
            />
          </svg>
        </div>
      )}

      {presetOpen && !VIEW_ONLY && (
        <PresetMenu
          myPresets={myPresets}
          onPick={createFromPreset}
          onApply={applyPresetToSelection}
          applyCount={blocks.filter(b => selection.has(b.id)).length}
          onDeleteMine={deleteMyPreset}
          onClose={() => setPresetOpen(false)}
        />
      )}

      {VIEW_ONLY && shared && (
        <div className={`share-banner ${shared.status}`}>
          {shared.status === "loading" && <span>Abrindo o mapa compartilhado...</span>}
          {shared.status === "missing" && <span>Esse link não existe mais ou foi desligado por quem compartilhou.</span>}
          {shared.status === "ok" && (
            <>
              <b>{shared.name || "Mapa"}</b>
              <span className="share-meta">Só leitura{shared.updatedAt ? " · salvo em " + new Date(shared.updatedAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }).replace(",", " às") : ""}</span>
              {readMode === "map" && blocks.some(b => b.doc) && <span className="share-tip">Clique num bloco com documento pra ler</span>}
              <span className="share-actions">
                <span className="seg">
                  <button className={readMode === "map" ? "on" : ""} onClick={() => setReadMode("map")}>Mapa</button>
                  <button className={readMode === "doc" ? "on" : ""} onClick={() => setReadMode("doc")}>Documento</button>
                </span>
                <span className="exp-wrap">
                  <button className="exp-btn" onClick={() => setExportOpen(o => !o)}>Exportar</button>
                  {exportOpen && (
                    <span className="exp-menu">
                      <button onClick={() => exportAs("copy")}><b>Copiar texto</b><small>Markdown pronto pra colar no Claude</small></button>
                      <button onClick={() => exportAs("md")}><b>Baixar .md</b><small>Markdown com tudo, na ordem</small></button>
                      <button onClick={() => exportAs("json")}><b>Baixar .json</b><small>Os dados completos do mapa</small></button>
                    </span>
                  )}
                </span>
              </span>
              {exportMsg && <span className="exp-msg">{exportMsg}</span>}
            </>
          )}
        </div>
      )}
      {VIEW_ONLY && shared && shared.status === "ok" && readMode === "doc" && (
        <ReadingView name={shared.name} blocks={blocks} edges={edges} />
      )}

      {docId && blocks.some(b => b.id === docId) && (
        <DocEditor
          key={docId}
          block={blocks.find(b => b.id === docId)}
          onSave={saveDocPatch}
          onClose={() => setDocId(null)}
          readOnly={VIEW_ONLY}
        />
      )}

      {boardId && blocks.some(b => b.id === boardId) && (
        <BoardPanel
          key={boardId}
          block={blocks.find(b => b.id === boardId)}
          onSave={updateBlock}
          onClose={() => setBoardId(null)}
          readOnly={VIEW_ONLY}
        />
      )}

      {cloudOpen && (
        <CloudPanel
          client={supa}
          session={session}
          getDoc={getDoc}
          loadDoc={loadDoc}
          cloudDoc={cloudDoc}
          setCloudDoc={setCloudDoc}
          onClose={() => setCloudOpen(false)}
        />
      )}

      <input ref={fileRef} type="file" accept=".json,.md,.markdown,.txt" style={{display:"none"}} onChange={importJSON} />
      <input ref={mdRef} type="file" accept=".md,.markdown,.txt" style={{display:"none"}} onChange={importMarkdown} />
      <input ref={imgRef} type="file" accept="image/*" style={{display:"none"}} onChange={(e) => { const f = e.target.files[0]; if (f) addImageFromBlob(f, null); e.target.value = ""; }} />
      <input ref={blockImgRef} type="file" accept="image/*" style={{display:"none"}} onChange={(e) => { const f = e.target.files[0]; if (f) setBlockImageFromFile(f); e.target.value = ""; }} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
