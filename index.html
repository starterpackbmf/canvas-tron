<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#02040a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Canvas Tron — React</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script>
  // Força o JSX classic (React.createElement). Sem isso, versões novas do
  // Babel standalone usam o "automatic runtime" e injetam
  // `import ... from "react/jsx-runtime"`, que não existe via <script> global
  // (React vem do UMD) — o que deixava a página em tela preta.
  Babel.registerPreset("react-classic", {
    presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#030612; --bg-2:#050a1a;
    --cyan:#00f0ff; --orange:#ff9d00;
    --white:#e9fbff; --muted:#6b8aa0; --danger:#ff3b5c;
    --blk-bg:rgba(5,14,28,.9);   /* fundo do bloco (skin SVG lê esta var) */
    --body-text:#dcefff;
  }
  /* ===== tema claro (off-white quente, não branco puro) ===== */
  body.light{
    --bg:#f4f1ea; --bg-2:#ece8df;
    --cyan:#0a8fa6; --white:#1c2a36; --muted:#5f7283;
    --blk-bg:rgba(255,255,255,.93);
    --body-text:#22323f;
  }
  body.light .bg{
    background:
      radial-gradient(ellipse 120% 80% at 50% -15%,rgba(0,140,255,.07),transparent 60%),
      #f4f1ea;
  }
  body.light .bg::before{
    background-image:
      linear-gradient(rgba(20,60,90,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(20,60,90,.07) 1px,transparent 1px);
  }
  body.light .bg::after{background:radial-gradient(ellipse at center,transparent 60%,rgba(60,50,30,.10) 100%)}
  body.light .bg-particles{display:none}
  body.light .toolbar,body.light .hint,body.light .drawbar,body.light .palette,body.light .presentbar,
  body.light .breadcrumb,body.light .cloud-panel,body.light .attr-dock,body.light .zoom,body.light .minimap{
    background:rgba(255,255,255,.86);
    border-color:rgba(10,110,140,.22);
    box-shadow:0 10px 30px rgba(30,40,60,.14),inset 0 1px 0 rgba(255,255,255,.9);
  }
  body.light .ic,body.light .shape-btn,body.light .tool{color:#3f5668}
  body.light .toolbar .tb-lbl{color:rgba(40,70,90,.6)}
  body.light .toolbar .tb-danger .ic{color:rgba(200,30,60,.8)}
  body.light .block{
    background:var(--blk-bg);
    /* cor do bloco levemente escurecida pra ler bem no claro (borda, título) */
    --bc-ui:color-mix(in srgb,var(--bc) 72%,#0b1a26);
    border-color:var(--bc-ui);
    box-shadow:0 3px 12px rgba(20,30,50,.12),inset 0 0 0 1px rgba(255,255,255,.6);
  }
  body.light .block .title{color:var(--bc-ui)}
  body.light .block .body{color:var(--body-text)}
  body.light .block.fill-soft{background:rgba(var(--bc-rgb),.26)}
  body.light .block.fill-solid{background:var(--bc);border-color:var(--bc-ui)}
  body.light .block.fill-solid .title{color:#08131c}
  body.light .block.fill-solid .body{color:#12222e}
  body.light .block.selected{box-shadow:0 0 0 2px var(--bc-ui),0 6px 18px rgba(20,30,50,.18)}
  body.light .note{
    background:rgba(255,255,255,.72);
    color:color-mix(in srgb,var(--nc) 70%,#0b1a26);
    border-color:color-mix(in srgb,var(--nc) 50%,#fff);
  }
  body.light .edges path{filter:none}
  body.light .collapse-badge,body.light .edge-style-btn{background:rgba(255,255,255,.96);box-shadow:0 2px 8px rgba(20,30,50,.18)}
  body.light .cloud-panel input,body.light .attr-cell,body.light .attr-addval{background:rgba(255,255,255,.8);color:var(--white)}
  body.light .cloud-overlay{background:rgba(120,110,90,.35)}
  body.light .minimap .mm-view{fill:rgba(10,143,166,.12)}
  body.light .swatch{border-color:rgba(0,0,0,.12)}
  body.light .breadcrumb .crumb.current{filter:brightness(.7)}
  *{box-sizing:border-box}
  html,body,#root{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:"Segoe UI",Inter,system-ui,sans-serif;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}

  /* ===== background grid ===== */
  /* Apple-ish: preto, leve gradiente azul frio, grid quase imperceptível e
     vinheta nas bordas. Nada chama atenção — o conteúdo é o protagonista. */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse 120% 80% at 50% -15%,rgba(0,140,255,.10),transparent 60%),
      radial-gradient(ellipse 100% 70% at 50% 120%,rgba(0,80,150,.06),transparent 55%),
      #02040a;
  }
  /* grid quase invisível, sumindo nas bordas */
  .bg::before{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(120,180,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,180,255,.035) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse at center,black 28%,transparent 78%);
    mask-image:radial-gradient(ellipse at center,black 28%,transparent 78%);
  }
  /* vinheta — escurece as bordas pra dar foco ao centro */
  .bg::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.55) 100%);
  }
  /* partículas bem discretas, deriva lenta (desliga em prefers-reduced-motion) */
  .bg-particles{
    position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.4;
    background-image:
      radial-gradient(circle, rgba(190,215,255,.7) .6px, transparent 1.4px),
      radial-gradient(circle, rgba(160,200,255,.5) .5px, transparent 1.3px);
    background-size:170px 170px,230px 230px;
    background-position:0 0,80px 120px;
    animation:particles-drift 90s linear infinite;
  }
  @keyframes particles-drift{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(40px,-60px,0)}
  }
  @media (prefers-reduced-motion: reduce){ .bg-particles{animation:none} }

  /* modo PC: a barra do app (pasta, nome, salvo) fica à esquerda; as ferramentas vão pra direita */
  /* modo PC: ferramentas na barra lateral vertical, igual à do Fluxo (o topo é do app de fora: pasta, nome, salvo) */
  html.pc .toolbar,html.pc body.fume .toolbar{left:16px;right:auto;top:50%;transform:translateY(-50%);width:auto;max-width:none;
    flex-direction:column;flex-wrap:nowrap;gap:2px;padding:5px;border-radius:14px}
  html.pc .toolbar .tb-group{gap:2px}
  html.pc .toolbar .tb-row{flex-direction:column;gap:2px}
  html.pc .toolbar .tb-lbl{display:none}
  html.pc .toolbar .dvr{width:22px;height:1px;align-self:center;margin:4px 0;background:var(--line,rgba(255,255,255,.08))}
  html.pc .toolbar .ic{width:34px;height:34px}

  /* ---------- tema Ônix: vidro preto polido, aro prata, sem cor (a cor do bloco só no pontinho) ---------- */
  body.onix .bg{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px)!important;background-color:var(--bg)!important}
  body.onix .bg::after{background:radial-gradient(110% 85% at 50% 42%,transparent 50%,rgba(0,0,0,.72))}
  body.onix .fv-feixes{opacity:.2}
  body.onix .block,body.onix .block.estilo-solido{
    background:linear-gradient(180deg,#1c1c20 0%,#121214 45%,#0b0b0c 100%)!important;border:1px solid rgba(255,255,255,.09)!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -12px 22px -12px rgba(0,0,0,.85),0 26px 48px -22px #000!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  body.onix .block.fill-soft,body.onix .block.estilo-solido.fill-soft{background:linear-gradient(180deg,#232327 0%,#151517 45%,#0d0d0e 100%)!important}
  body.onix .block.fill-solid,body.onix .block.estilo-solido.fill-solid{background:linear-gradient(180deg,#2c2c31 0%,#1a1a1d 45%,#101012 100%)!important;border-color:rgba(255,255,255,.16)!important}
  body.onix .block::after{content:"";position:absolute;top:8px;right:8px;width:5px;height:5px;border-radius:50%;background:rgb(var(--bc-rgb));box-shadow:0 0 7px 1px rgb(var(--bc-rgb));pointer-events:none;z-index:3}
  body.onix .block.selected,body.onix .block.focused,body.onix .block.estilo-solido.selected{border-color:rgba(255,255,255,.36)!important;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 0 0 1px rgba(255,255,255,.14),0 0 36px -10px rgba(255,255,255,.3),0 26px 48px -22px #000!important}
  body.onix .block .title,body.onix .block.estilo-solido .title,body.onix .block.shp-rect.estilo-solido .title,body.onix .block.shp-rounded.estilo-solido .title{color:#ececf1!important;text-shadow:none!important}
  body.onix .block .body,body.onix .block.shp-rect .body,body.onix .block.shp-rounded .body{background:rgba(255,255,255,.025)!important;border-color:rgba(255,255,255,.06)!important}
  html.pc body.onix .block.emphasis{animation:onix-respira 3.6s ease-in-out infinite}
  @keyframes onix-respira{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(255,255,255,.12),0 0 26px -8px rgba(255,255,255,.2),0 26px 48px -22px #000}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(255,255,255,.24),0 0 44px -6px rgba(255,255,255,.34),0 26px 48px -22px #000}}
  body.onix .edges path.flow{stroke:#fff;stroke-width:2;stroke-dasharray:1.5 90;stroke-linecap:round;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 7px rgba(255,255,255,.7));animation:onix-luz 1.6s linear infinite}
  @keyframes onix-luz{to{stroke-dashoffset:-91.5}}
  body.onix .edges path.pulse{stroke:#fff!important}
  body.onix .toolbar,body.onix .hint,body.onix .bbx,body.onix .zoombar{background:var(--chrome)!important;border-color:rgba(255,255,255,.09)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 14px 34px -14px #000!important}

  /* ---------- fundos (escolha do app, à parte do tema; só nos temas de vidro) ---------- */
  html[data-fundo="pontos"] body.fume .bg{background-image:radial-gradient(circle,var(--ponto) 1px,transparent 1.3px)!important}
  html[data-fundo="grade"] body.fume .bg{background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px)!important}
  html[data-fundo="liso"] body.fume .bg{background-image:none!important}
  html[data-fundo="grafite"] body.fume .bg{background-image:radial-gradient(120% 90% at 25% 0%,var(--gf1),transparent 60%),linear-gradient(165deg,var(--gf2),var(--gf3))!important;background-size:100% 100%!important;background-position:0 0!important}
  html[data-fundo="tron"] body.fume .bg{background-image:radial-gradient(90% 55% at 50% 118%,var(--tr1),transparent 70%),linear-gradient(180deg,var(--gf3),var(--gf2))!important;background-size:100% 100%!important;background-position:0 0!important}
  /* ---------- tema Claro: cinza claro, cards brancos macios, cor só no pontinho, acento azul ---------- */
  body.claro .bg::after{background:none!important}
  body.claro .fv-feixes{opacity:0}
  body.claro .fv-vinheta{background:none}
  body.claro .toolbar,body.claro .hint,body.claro .bbx,body.claro .zoombar,body.claro .bbx-pop,body.claro .minimap{background:var(--chrome)!important;border-color:rgba(20,20,30,.07)!important;
    box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,20,30,.05),0 12px 30px -14px rgba(20,20,30,.22)!important;color:var(--ink)}
  body.claro .ic,body.claro .bbx-b,body.claro .bbx-t{color:var(--ink-2)}
  body.claro .ic:hover,body.claro .bbx-b:hover,body.claro .bbx-t:hover{background:rgba(20,20,30,.06)!important;color:var(--ink)}
  body.claro .ic.active,body.claro .bbx-b.on,body.claro .bbx-t.on{background:#1c1c21!important;color:#fff!important}
  body.claro .bbx-b[data-tip]:hover::after{background:#1c1c21;color:#fff}
  body.claro .bbx-sep,body.claro .toolbar .dvr{background:rgba(20,20,30,.1)!important}
  body.claro .hint b{background:rgba(20,20,30,.06)!important;color:var(--ink)!important;border-color:rgba(20,20,30,.08)!important}
  body.claro .block,body.claro .block.estilo-solido{
    background:linear-gradient(180deg,#ffffff,#f8f8f9)!important;border:1px solid rgba(20,20,30,.06)!important;color:var(--ink)!important;
    box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(20,20,30,.06),0 16px 36px -16px rgba(20,20,30,.24)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  body.claro .block.fill-soft,body.claro .block.estilo-solido.fill-soft{background:linear-gradient(180deg,#ffffff,#f1f1f3)!important}
  body.claro .block.fill-solid,body.claro .block.estilo-solido.fill-solid{background:linear-gradient(180deg,#f4f4f6,#e9e9ec)!important;border-color:rgba(20,20,30,.1)!important}
  body.claro .block::after{content:"";position:absolute;top:8px;right:8px;width:5px;height:5px;border-radius:50%;background:rgb(var(--bc-rgb));pointer-events:none;z-index:3}
  body.claro .block.selected,body.claro .block.focused,body.claro .block.estilo-solido.selected{border-color:#3b82f6!important;box-shadow:0 0 0 3px rgba(59,130,246,.16),0 16px 36px -16px rgba(20,20,30,.26)!important}
  body.claro .block .title,body.claro .block.estilo-solido .title,body.claro .block.shp-rect.estilo-solido .title,body.claro .block.shp-rounded.estilo-solido .title{color:#1c1c21!important;text-shadow:none!important}
  body.claro .block .body,body.claro .block.shp-rect .body,body.claro .block.shp-rounded .body{color:#4a4a54!important;background:#f4f4f6!important;border-color:rgba(20,20,30,.05)!important}
  html.pc body.claro .block.emphasis{animation:none;box-shadow:0 0 0 2px rgba(var(--bc-rgb),.55),0 0 26px -6px rgba(var(--bc-rgb),.45),0 16px 36px -16px rgba(20,20,30,.24)!important}
  body.claro .edges path.edge-line{stroke:var(--edge)}
  body.claro .edges path.edge-line.sel{stroke:#3b82f6}
  body.claro .edges path.flow{stroke:#3b82f6}
  body.claro .edges path.pulse{stroke:#3b82f6!important}
  body.claro .port,body.claro .handle{background:#fff;border-color:rgba(20,20,30,.25)}

  /* animações no app: bloco nasce, linha se desenha (o resto vem da peça comum) */
  html.pc .block{animation:ccNasce .5s var(--cc-ease) both}
  /* barras antigas (formatar texto, seleção de anotação) no app: mesma pílula de vidro da barra do bloco */
  html.pc .drawbar{top:14px;gap:2px;padding:4px 6px;border-radius:12px;background:var(--chrome)!important;border:1px solid var(--line)!important;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)!important;animation:ccMenu .2s var(--cc-ease)}
  html.pc .drawbar .lbl{display:none}
  html.pc .drawbar .vsep{height:18px;margin:0 4px;background:var(--line)!important}
  html.pc .drawbar .fmt-btn,html.pc .drawbar .shape-btn,html.pc .drawbar .width-btn{width:30px;height:30px;border:0!important;background:transparent!important;color:var(--ink-2)!important;box-shadow:none!important;border-radius:8px}
  html.pc .drawbar .fmt-btn:hover,html.pc .drawbar .shape-btn:hover{background:rgba(127,127,140,.14)!important;color:var(--ink)!important}
  html.pc .drawbar .fmt-btn.active,html.pc .drawbar .shape-btn.active{background:rgba(127,127,140,.22)!important;color:var(--ink)!important}
  html.pc .drawbar .swatch{width:18px!important;height:18px!important;box-shadow:none!important;border:1px solid rgba(127,127,140,.3)!important}
  @media (max-width:1100px){html.pc .drawbar{top:62px}}

  /* padrão dos três: canto de baixo numa pílula só, painel de 300px, e os dois andam pra esquerda quando o painel abre */
  html.pc .zoomctl{right:16px!important;bottom:16px!important;gap:2px;padding:4px;border-radius:12px;background:var(--chrome);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:0 12px 30px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);transition:right .3s var(--cc-ease)}
  html.pc .zoomctl .zbtn{width:30px;height:30px;border:0!important;border-radius:8px;background:transparent!important;color:var(--ink-2)!important;display:grid;place-items:center;box-shadow:none!important;font-size:15px;padding:0}
  html.pc .zoomctl .zbtn svg{width:15px;height:15px}
  html.pc .zoomctl .zbtn:hover{background:rgba(127,127,140,.14)!important;color:var(--ink)!important}
  html.pc .zoomctl .zbtn.on{background:rgba(127,127,140,.2)!important;color:var(--ink)!important}
  html.pc .zoomctl .zoom{background:transparent!important;border:0!important;box-shadow:none!important;color:var(--ink-2)!important;font:500 11px/1 "Geist Mono",ui-monospace,Consolas,monospace!important;width:46px;text-align:center;padding:0!important}
  html.pc .zoomctl .zsep{width:1px;height:16px;background:var(--line);margin:0 3px}
  html.pc .minimap{right:16px!important;bottom:62px!important;border-radius:12px!important;background:var(--chrome)!important;border:1px solid var(--line)!important;transition:right .3s var(--cc-ease)}
  html.pc:has(.pnl) .zoomctl,html.pc:has(.pnl) .minimap{right:332px!important}
  html.pc .pnl{width:300px}
  html.previa .toolbar,html.previa .hint,html.previa .zoomctl,html.previa .minimap,html.previa .bbx,html.previa .pnl,html.previa .drawbar{display:none!important}
  html.pc.wco .bbx,html.pc.wco .drawbar{top:56px!important}
  html.pc:has(.pnl) .hint{display:none}

  /* cores do canvas (painel, aba Canvas): linhas, destaque e fundo por cima do tema */
  html[data-cor-linha] .edges path.edge-line,html[data-cor-linha] .edges path.stub{stroke:var(--cc-linha)!important}
  html[data-cor-acento] .block.selected,html[data-cor-acento] .block.estilo-solido.selected{border-color:var(--cc-acento)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--cc-acento) 22%,transparent),0 0 30px -8px var(--cc-acento),0 22px 44px -26px rgba(0,0,0,.6)!important}
  html[data-cor-acento] .edges path.flow,html[data-cor-acento] .edges path.pulse,html[data-cor-acento] .edges path.edge-line.sel{stroke:var(--cc-acento)!important}
  html[data-cor-acento] .toolbar .ic.active{background:var(--cc-acento)!important;color:#0c0c0e!important}
  html[data-cor-fundo]{--gf2:var(--cc-fundo);--gf3:color-mix(in srgb,var(--cc-fundo) 50%,#000)}
  html[data-cor-fundo] body.fume .bg,html[data-cor-fundo] body .bg{background-color:var(--cc-fundo)!important}
  .pnl .ccc{color:var(--ink,#ececf1)}
  /* painel do app (Bloco | Canvas) */
  .pnl{position:fixed;right:16px;top:62px;bottom:16px;width:290px;z-index:28;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
    background:var(--chrome,rgba(24,24,28,.86));border:1px solid var(--line,rgba(255,255,255,.08));backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 18px 44px -18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);color:var(--ink,#ececf1);font-family:"Geist",ui-sans-serif,system-ui,"Segoe UI",sans-serif;animation:ccPainel .3s var(--cc-ease)}
  .pnl-tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line,rgba(255,255,255,.08))}
  .pnl-tabs button{flex:1;border:0;background:transparent;color:var(--ink-2,#a4a4b0);height:30px;border-radius:8px;font:500 12px "Geist",sans-serif;cursor:pointer}
  .pnl-tabs button.on{background:rgba(127,127,140,.18);color:var(--ink,#ececf1)}
  .pnl-tabs .pnl-x{flex:none;width:30px;display:grid;place-items:center}
  .pnl-tabs .pnl-x svg{width:14px;height:14px}
  .pnl-c{flex:1;overflow-y:auto;padding:4px 12px 16px;scrollbar-width:thin}
  .pnl section{padding:12px 0 6px;border-bottom:1px solid var(--line,rgba(255,255,255,.06));animation:ccSecao .34s var(--cc-ease) both}
  .pnl section:nth-child(2){animation-delay:.03s}.pnl section:nth-child(3){animation-delay:.06s}.pnl section:nth-child(4){animation-delay:.09s}.pnl section:nth-child(n+5){animation-delay:.12s}
  .pnl section:last-child{border-bottom:0}

  /* ===== toolbar ===== */
  /* ===== shared HUD surface (toolbar + todas as barras) ===== */
  .toolbar{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;
    padding:6px 9px;max-width:96vw;

    background:linear-gradient(180deg,rgba(9,19,34,.86),rgba(5,12,24,.86));
    border:1px solid rgba(0,240,255,.20);

    width:36px;height:34px;display:inline-flex;align-items:center;justify-content:center;

  .ic .ic-svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  /* divisória vertical entre grupos */
  .dvr{width:1px;height:20px;margin:0 5px;background:linear-gradient(transparent,rgba(0,240,255,.35),transparent)}
  /* grupos da toolbar: fileira de ícones + rótulo curto embaixo (Criar · Editar · Ver · Arquivo) */

  .fmt-btn{

  /* ===== color palette ===== */
  .palette{
    position:fixed;top:86px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;gap:6px;align-items:center;
    padding:7px 11px;
    background:linear-gradient(180deg,rgba(9,19,34,.9),rgba(5,12,24,.9));
    border:1px solid rgba(0,240,255,.20);
    border-radius:12px;
    backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06),inset 0 0 22px rgba(0,240,255,.05);
    animation:fadein .15s ease;
  }
  @keyframes fadein{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
  .palette .lbl{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
  .swatch{
    width:22px;height:22px;border-radius:50%;

  }
  .swatch:hover{transform:scale(1.15);border-color:#fff}
  .swatch.custom{
    background:conic-gradient(#ff3b5c,#ffdd00,#00ff88,#00f0ff,#9d4bff,#ff3b9a,#ff3b5c);
    box-shadow:0 0 8px rgba(255,255,255,.3);

  }

    position:fixed;bottom:14px;right:14px;z-index:10;

    background:linear-gradient(180deg,rgba(9,19,34,.78),rgba(5,12,24,.78));
    border:1px solid rgba(0,240,255,.2);
    padding:6px 12px;border-radius:9px;letter-spacing:.5px;
    backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(0,0,0,.4);
