  body.fume .bs-btn.danger{color:var(--run);border-color:var(--line);background:rgba(255,255,255,.04)}
  body.fume .bs-btn.danger:hover{background:rgba(255,158,196,.1)}
  /* ação principal da ficha: o único botão branco sólido da área */
  body.fume .bs-foot .bs-btn:not(.danger):not(.ghost){background:#f4f4f6;color:#121214;border-color:#f4f4f6}
  body.fume .bs-foot .bs-btn:not(.danger):not(.ghost):hover{background:#ffffff}

  /* ===== quadro (board/pipeline) dentro do bloco: cartões replicados do Valt "Não Esquece" ===== */
  .board-chip{margin-top:8px;border:1px solid rgba(var(--bc-rgb,0,240,255),.22);border-radius:8px;background:rgba(var(--bc-rgb,0,240,255),.05);padding:7px 9px;text-align:left}
  .board-chip-head{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--bc,#00f0ff)}
  .board-chip-head svg{width:13px;height:13px;fill:currentColor}
  .board-chip-head .late{margin-left:auto;color:#f2a63b}
  .board-chip-cols{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:5px;font-size:10px;color:#9fc2d6;text-transform:uppercase;letter-spacing:.3px}
  .board-chip-cols b{color:#fff;font-weight:700}
  .board-panel{
    --bs-mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
    --bs-line:rgba(255,255,255,.09);--bs-line-soft:rgba(255,255,255,.06);--bs-panel:#0e1726;--bs-panel-2:#0b1320;
    --bs-ink:#e9f4fb;--bs-muted:#8fa9bb;--bs-muted-2:#5f7489;
    --bs-accent:var(--cyan,#00f0ff);--bs-accent-dim:rgba(0,240,255,.12);--bs-accent-line:rgba(0,240,255,.34);
    --bs-warn:#f2a63b;--bs-warn-dim:rgba(242,166,59,.13);--bs-warn-line:rgba(242,166,59,.34);
    position:relative;width:min(1120px,96vw);height:min(88vh,920px);display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0a1324,#060c18);border:1px solid rgba(0,240,255,.22);border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden;color:var(--bs-ink);
  }
  .board-head{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid rgba(0,240,255,.14)}
  .board-head h3{margin:0;flex:1;font-size:15px;letter-spacing:.5px;color:#cfeefc;text-transform:uppercase;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bs-counts{display:flex;gap:8px}
  .bs-count{background:var(--bs-panel-2);border:1px solid var(--bs-line-soft);border-radius:10px;padding:6px 11px;display:flex;flex-direction:column;gap:2px;min-width:62px}
  .bs-count .n{font-weight:700;font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
  .bs-count .k{font-family:var(--bs-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--bs-muted-2)}
  .bs-count.hot{border-color:var(--bs-warn-line);background:var(--bs-warn-dim)}
  .bs-count.hot .n,.bs-count.hot .k{color:var(--bs-warn)}
  .board-cols{flex:1;display:flex;gap:14px;align-items:flex-start;padding:16px;overflow:auto}
  .board-col{flex:0 0 300px;max-width:300px;display:flex;flex-direction:column;background:rgba(255,255,255,.02);border:1px solid var(--bs-line-soft);border-radius:14px;max-height:100%;transition:border-color .15s,background .15s}
  .board-col.drop{border-color:var(--bs-accent);box-shadow:inset 0 0 0 1px rgba(0,240,255,.4);background:rgba(255,255,255,.03)}
  .board-col-head{display:flex;align-items:center;gap:7px;padding:12px 12px 8px}
  .board-col-dot{width:8px;height:8px;border-radius:50%;background:var(--bs-muted-2);flex:0 0 auto}
  .board-col.is-doing .board-col-dot{background:var(--bs-accent);box-shadow:0 0 8px var(--bs-accent)}
  .board-col.is-done .board-col-dot{background:var(--bs-muted)}
  .board-col-name{flex:1;background:transparent;border:none;color:#c6ddea;font-family:var(--bs-mono);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;outline:none;min-width:0}
  .board-col-count{font-family:var(--bs-mono);font-size:11px;color:var(--bs-muted-2)}
  .board-col-x{cursor:pointer;color:var(--bs-muted-2);font-size:16px;line-height:1;padding:0 4px}
  .board-col-x:hover{color:var(--danger,#ff3b5c)}
  .board-col-cards{display:flex;flex-direction:column;gap:9px;padding:0 10px 12px;overflow:auto}
  .board-col-empty{color:var(--bs-muted-2);font-size:12px;text-align:center;padding:8px 4px;opacity:.7}
  /* cartão compacto (igual ao kcard do Valt): tag + prioridade, título, barra, chips de prazo */
  .board-card{background:var(--bs-panel);border:1px solid var(--bs-line);border-radius:12px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
  .board-card:hover{border-color:var(--bs-muted-2)}
  .board-card.done-card{opacity:.6}
  .board-card-top{display:flex;align-items:center;gap:7px}
  .bs-tag{font-family:var(--bs-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid var(--bs-line);color:var(--bs-muted);white-space:nowrap}
  .bs-tag.video{color:var(--bs-accent);border-color:var(--bs-accent-line);background:var(--bs-accent-dim)}
  .bs-prio{display:inline-flex;align-items:center;gap:5px;font-family:var(--bs-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid;white-space:nowrap}
  .bs-prio .pt{width:6px;height:6px;border-radius:50%;background:currentColor}
  .board-card-title{font-size:14.5px;line-height:1.32;font-weight:500;color:var(--bs-ink);word-break:break-word}
  .board-card-title.empty{color:var(--bs-muted-2)}
  .board-card-prog{display:flex;align-items:center;gap:8px}

/* fundo vivo (o mesmo do Mapa mental): feixes de luz, poeira e vinheta */
.fv-feixes,.fv-poeira,.fv-vinheta{position:absolute;inset:0;pointer-events:none}
.fv-feixes{overflow:hidden;opacity:.6}
.fv-feixe{position:absolute;top:-40%;width:22%;height:180%;transform:rotate(24deg);will-change:transform;
  background:linear-gradient(90deg,transparent,rgba(236,236,241,.052) 45%,rgba(236,236,241,.077) 50%,rgba(236,236,241,.052) 55%,transparent);
  animation:fvDeriva 19s cubic-bezier(.22,1,.36,1) infinite alternate}
.fv-feixe:nth-child(1){left:8%}
.fv-feixe:nth-child(2){left:46%;width:12%;animation-duration:23s;animation-delay:-6s;opacity:.7}
.fv-feixe:nth-child(3){left:72%;width:28%;animation-duration:27s;animation-delay:-12s;opacity:.55}
@keyframes fvDeriva{from{transform:translateX(-6%) rotate(24deg)}to{transform:translateX(9%) rotate(24deg)}}
.fv-poeira{width:100%;height:100%}
.fv-vinheta{background:linear-gradient(180deg,rgba(236,236,241,.035),transparent 30%)}
.fv-leve .fv-feixes,.fv-leve .fv-poeira{display:none}
@media (prefers-reduced-motion:reduce){.fv-feixe{animation:none}}
/* busca (Ctrl F) e atalhos (?), iguais nos três canvas */
.cc-glass{background:rgba(20,20,23,.92);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:0 12px 30px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05);color:#ececf1;font-family:"Geist",ui-sans-serif,system-ui,"Segoe UI",sans-serif}
.cc-busca{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;border-radius:11px;width:min(380px,calc(100vw - 32px));box-sizing:border-box}
.cc-busca[hidden],.cc-atalhos[hidden]{display:none!important}
.cc-busca svg{width:14px;height:14px;color:#6c6c78;flex:none}
.cc-busca input{flex:1;min-width:0;border:0!important;background:transparent!important;outline:none!important;box-shadow:none!important;color:#ececf1;font:13px inherit;font-family:inherit}
.cc-busca input::placeholder{color:#6c6c78}
.cc-busca .cc-conta{font:500 11px "Geist Mono",ui-monospace,Consolas,monospace;color:#6c6c78;font-variant-numeric:tabular-nums}
.cc-busca button{border:0;background:transparent;color:#6c6c78;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;padding:0;cursor:pointer}
.cc-busca button:hover{background:rgba(255,255,255,.08);color:#ececf1}
[data-achado]{outline:1.5px solid rgba(243,207,98,.55)!important;outline-offset:3px}
[data-achado="atual"]{outline:2px solid #f3cf62!important;box-shadow:0 0 0 6px rgba(243,207,98,.14),0 0 30px rgba(243,207,98,.25)!important}
.cc-atalhos{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(0,0,0,.5)}
.cc-atalhos .cc-caixa{width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 80px);overflow:auto;border-radius:16px;padding:18px 20px;box-sizing:border-box}
.cc-atalhos h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;align-items:center}
.cc-atalhos h3 button{margin-left:auto;border:0;background:transparent;color:#6c6c78;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.cc-atalhos h3 button:hover{background:rgba(255,255,255,.08);color:#ececf1}
.cc-atalhos h3 svg{width:14px;height:14px}
.cc-atalhos .cc-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 24px}
.cc-atalhos h5{margin:14px 0 6px;font:500 10px/1 "Geist Mono",ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#6c6c78}
.cc-atalhos .cc-l{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:12.5px;color:#a4a4b0}
.cc-atalhos kbd{font:500 11px "Geist Mono",ui-monospace,Consolas,monospace;color:#ececf1;background:rgba(255,255,255,.07);border-radius:5px;padding:2px 6px;white-space:nowrap}
/* animações do Canvas (iguais nos três): nascer, sair, linha se desenhando, menus, troca de tela, painel.
   Curva única (a do mapa mental). Somem com "reduzir movimento" do Windows. */
:root{--cc-ease:cubic-bezier(.22,1,.36,1);--cc-anel:150,190,255}
.cc-nasce{animation:ccNasce .5s var(--cc-ease) both}
@keyframes ccNasce{0%{opacity:0;scale:.9;box-shadow:0 0 0 0 rgba(var(--cc-anel),.5)}45%{opacity:1;scale:1.015}70%{box-shadow:0 0 0 12px rgba(var(--cc-anel),0)}100%{opacity:1;scale:1}}
.cc-sai{animation:ccSai .18s ease-in forwards!important;pointer-events:none}
@keyframes ccSai{to{opacity:0;scale:.86}}
.cc-linha{stroke-dasharray:1;stroke-dashoffset:1;animation:ccLinha .5s var(--cc-ease) forwards}
@keyframes ccLinha{to{stroke-dashoffset:0}}
@keyframes ccMenu{from{opacity:0;translate:0 -6px;scale:.98}}
@keyframes ccItem{from{opacity:0;translate:-4px 0}}

/* ================== Modo Mapa (layout automático, estilo XMind) ==================
   Árvore = ligações pai→filho (from→to). Cada filho tem UM pai (a primeira
   ligação manda); ordem dos irmãos = ordem das ligações no array `edges`.
   Raízes ficam onde estão (âncora); a subárvore se organiza em volta.
   Nós escondidos (ramo recolhido) ficam fora do cálculo. */
const MAP_GAP_X = 84;       // pai → filho (estruturas horizontais)
const MAP_GAP_Y = 26;       // entre irmãos (vertical)
const MAP_DOWN_GAP_X = 30;  // entre irmãos (estrutura "baixo")

  const byId = new Map(blocks.map(b => [b.id, b]));
  const size = (id) => { const b = byId.get(id); const s = sizes[id]; return { w: s?.w ?? b.w ?? 240, h: s?.h ?? b.h ?? 80 }; };

    const p = e.from.id, c = e.to.id;
    if (!byId.has(p) || !byId.has(c) || p === c || parentOf.has(c)) return;
    parentOf.set(c, p); edgeOf.set(c, e);
    if (!children.has(p)) children.set(p, []);

  // pra pílula não cair em cima deles
  const hasPill = new Set(), pillCount = new Map();

    if (!e.collapsed) return;
    const near = e.collapseDir === "backward" ? e.to.id : e.from.id;
    hasPill.add(near); pillCount.set(near, (pillCount.get(near) || 0) + 1);

  const spanH = new Map();
  const measureH = (id) => {
    if (spanH.has(id)) return spanH.get(id);
    const ks = kids(id); let sum = 0;
    ks.forEach(k => { sum += measureH(k); });
    if (ks.length) sum += MAP_GAP_Y * (ks.length - 1);

  };

    const { w, h } = size(id); const H = measureH(id);
    const x = dir > 0 ? xEdge : xEdge - w;
    pos.set(id, { x, y: yTop + (H - h) / 2 });
    const ks = kids(id); if (!ks.length) return;
    let sum = 0; ks.forEach(k => { sum += measureH(k); }); sum += MAP_GAP_Y * (ks.length - 1);
    let cy = yTop + (H - sum) / 2;
    const nx = dir > 0 ? x + w + MAP_GAP_X + extra(id) : x - MAP_GAP_X - extra(id);
    ks.forEach(k => {
      placeH(k, dir, nx, cy);
      ports.set(edgeOf.get(k).id, dir > 0 ? { from: "right", to: "left" } : { from: "left", to: "right" });
      cy += measureH(k) + MAP_GAP_Y;

  // ---- vertical (organograma: filhos abaixo)
  const spanV = new Map();
  const measureV = (id) => {
    if (spanV.has(id)) return spanV.get(id);
    const ks = kids(id); let sum = 0;
    ks.forEach(k => { sum += measureV(k); });
    if (ks.length) sum += MAP_DOWN_GAP_X * (ks.length - 1);
    const v = Math.max(size(id).w, sum, pillSpanX(id)); spanV.set(id, v); return v;
  };
  const placeV = (id, xLeft, y) => {
    const { w, h } = size(id); const W = measureV(id);
    pos.set(id, { x: xLeft + (W - w) / 2, y });
    const ks = kids(id); if (!ks.length) return;
    let sum = 0; ks.forEach(k => { sum += measureV(k); }); sum += MAP_DOWN_GAP_X * (ks.length - 1);

    const ny = y + h + MAP_DOWN_GAP_Y + extra(id);
    ks.forEach(k => {
      placeV(k, cx, ny);

      cx += measureV(k) + MAP_DOWN_GAP_X;

  roots.forEach(r => {
    const { w, h } = size(r.id);
    if (struct === "down") { placeV(r.id, r.x + w / 2 - measureV(r.id) / 2, r.y); return; }
    if (struct === "right") { placeH(r.id, 1, r.x, r.y + h / 2 - measureH(r.id) / 2); return; }

      if (!list.length) return;

      list.forEach(k => {

    stack(L, -1, r.x - MAP_GAP_X - extra(r.id));

};

// Orthogonal (manhattan) routing with rounded corners
const roundedPolyPath = (points, r = 12) => {
  if (!points || points.length < 2) return "";
  if (points.length === 2) return `M ${points[0].x} ${points[0].y} L ${points[1].x} ${points[1].y}`;
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length - 1; i++) {
    const prev = points[i-1], cur = points[i], next = points[i+1];
    const dx1 = cur.x - prev.x, dy1 = cur.y - prev.y;
    const len1 = Math.hypot(dx1, dy1) || 1;
    const dx2 = next.x - cur.x, dy2 = next.y - cur.y;
    const len2 = Math.hypot(dx2, dy2) || 1;
    const rr = Math.min(r, len1 / 2, len2 / 2);
    const ax = cur.x - (dx1 / len1) * rr;
    const ay = cur.y - (dy1 / len1) * rr;
    const bx = cur.x + (dx2 / len2) * rr;
    const by = cur.y + (dy2 / len2) * rr;
    d += ` L ${ax} ${ay} Q ${cur.x} ${cur.y} ${bx} ${by}`;
  }
  const last = points[points.length - 1];
  d += ` L ${last.x} ${last.y}`;
  return d;
};

const orthogonalPath = (p1, dir1, p2, dir2) => {
  const OFFSET = 32;

  const s2 = { x: p2.x + dir2.x * OFFSET, y: p2.y + dir2.y * OFFSET };
  const h1 = dir1.x !== 0; // source port is horizontal (left/right)
  const h2 = dir2.x !== 0; // target port is horizontal (left/right)
  const pts = [p1, s1];
  if (h1 && h2) {
    // Both horizontal: bend twice at mid-x, so we always approach target port straight
    const midX = (s1.x + s2.x) / 2;
    pts.push({ x: midX, y: s1.y });
    pts.push({ x: midX, y: s2.y });
  } else if (!h1 && !h2) {
    // Both vertical: bend twice at mid-y
    const midY = (s1.y + s2.y) / 2;
    pts.push({ x: s1.x, y: midY });
    pts.push({ x: s2.x, y: midY });
  } else if (h1 && !h2) {
    // Source horizontal, target vertical: single corner
    pts.push({ x: s2.x, y: s1.y });

    // Source vertical, target horizontal: single corner

// Cubic bezier that leaves p1 along dir1 and arrives at p2 along dir2 (smooth "curva" style)

// Smooth Catmull-Rom spline through an arbitrary list of points (free "curva" through waypoints)
const catmullRomPath = (pts) => {
  if (!pts || pts.length < 2) return "";

  let d = `M ${pts[0].x} ${pts[0].y}`;

    const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;

  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx*dx + dy*dy || 1;
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = a.x + t*dx, cy = a.y + t*dy;
  return Math.hypot(p.x - cx, p.y - cy);

const strokeBBox = (s) => {
  if (!s) return null;

  let pts = [];
  if (s.points && s.points.length) pts = s.points;
  else if (s.p1 && s.p2) pts = [s.p1, s.p2];
  if (!pts.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  pts.forEach(p => { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); });

const strokeToPath = (s) => {
  if (!s) return "";

  if (t === "freehand") {
    if (!s.points || s.points.length < 2) return "";
    return "M " + s.points.map(p => `${p.x} ${p.y}`).join(" L ");
  }
  // polyline: liga os pontos por segmentos retos + setinha aberta no fim
  if (t === "polyline") {
    if (!s.points || s.points.length < 2) return "";
    let d = "M " + s.points.map(p => `${p.x} ${p.y}`).join(" L ");
    if (s.arrow !== false) {
      const p2 = s.points[s.points.length - 1], p1 = s.points[s.points.length - 2];
      const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const head = Math.min(15, len * 0.6);
      if (head > 1) {
        const spread = 0.5;
        const ax = p2.x - head * Math.cos(ang - spread), ay = p2.y - head * Math.sin(ang - spread);
        const bx = p2.x - head * Math.cos(ang + spread), by = p2.y - head * Math.sin(ang + spread);
        d += ` M ${ax} ${ay} L ${p2.x} ${p2.y} L ${bx} ${by}`;
      }
    }
    return d;
  }
  if (!s.p1 || !s.p2) return "";
  const { p1, p2 } = s;
  if (t === "line") {
    return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
  }
  if (t === "rect") {
    const x = Math.min(p1.x, p2.x), y = Math.min(p1.y, p2.y);
    const w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
    return `M ${x} ${y} h ${w} v ${h} h ${-w} z`;
  }
  if (t === "ellipse") {
    const cx = (p1.x + p2.x) / 2;
    const cy = (p1.y + p2.y) / 2;
    const rx = Math.abs(p2.x - p1.x) / 2;
    const ry = Math.abs(p2.y - p1.y) / 2;
    if (rx < 0.5 || ry < 0.5) return "";
    return `M ${cx - rx} ${cy} A ${rx} ${ry} 0 1 0 ${cx + rx} ${cy} A ${rx} ${ry} 0 1 0 ${cx - rx} ${cy}`;
  }
  if (t === "arrow") {
    const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const head = Math.min(18, Math.hypot(p2.x - p1.x, p2.y - p1.y) * 0.4);
    const spread = 0.5;
    const ax = p2.x - head * Math.cos(ang - spread);
    const ay = p2.y - head * Math.sin(ang - spread);
    const bx = p2.x - head * Math.cos(ang + spread);
    const by = p2.y - head * Math.sin(ang + spread);
    return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y} M ${ax} ${ay} L ${p2.x} ${p2.y} L ${bx} ${by}`;
  }
  return "";
};

// Approximate midpoint of the bezier used for edges
const bezierMidpoint = (a, b) => {
  const dx = Math.abs(b.x - a.x) * 0.5 + 40;
  const c1x = a.x + dx, c1y = a.y;
  const c2x = b.x - dx, c2y = b.y;
  // de Casteljau at t=0.5
  const t = 0.5, it = 1 - t;
  const x = it*it*it*a.x + 3*it*it*t*c1x + 3*it*t*t*c2x + t*t*t*b.x;

  // bloco descartado/apagado enquanto editava: avisa o pai pra barra de
  // formatação não ficar presa na tela
  useEffect(() => () => { onEditingTitleChange?.(block.id, false); onEditingBodyChange?.(block.id, false); }, []);

  // Notify parent when body/title editing starts/stops, so it can show the format bar
  useEffect(() => {
    onEditingBodyChange?.(block.id, editingBody);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editingBody]);
  useEffect(() => {
    onEditingTitleChange?.(block.id, editingTitle);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editingTitle]);

  // When entering body edit mode, imperatively set innerHTML and focus
  useEffect(() => {
    if (editingBody && bodyRef.current) {
      bodyRef.current.innerHTML = block.body || "";
      bodyRef.current.focus();
      const range = document.createRange();
      range.selectNodeContents(bodyRef.current);
      range.collapse(false);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editingBody]);

  // Same for title
  useEffect(() => {
    if (editingTitle && titleRef.current) {
      titleRef.current.innerHTML = block.title || "";
      titleRef.current.focus();
      const range = document.createRange();
      range.selectNodeContents(titleRef.current);
      range.collapse(false);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editingTitle]);

  useEffect(() => {
    if (editingTitle && titleRef.current) {
      const t = titleRef.current; t.focus();
      const r = document.createRange(); r.selectNodeContents(t);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  }, [editingTitle]);
  useEffect(() => {
    if (editingBody && bodyRef.current) {
      const t = bodyRef.current; t.focus();
      const r = document.createRange(); r.selectNodeContents(t);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  }, [editingBody]);

  const downAtRef = useRef(null);
  const color = block.color || DEFAULT_COLOR;
  const shapeDef = SHAPE_BY_KEY[block.shape] || SHAPE_BY_KEY.rounded; // padrão: quadrado arredondado
  const useSkin = !!shapeDef.skin;
  const skinGlow = (selected || focused || lit)
    ? `drop-shadow(0 0 11px ${color}) drop-shadow(0 0 4px ${color})`
    : `drop-shadow(0 0 5px ${color})`;
  return (
    <div
      ref={elRef}
      data-bid={block.id}
      className={`block ${selected ? "selected" : ""} ${hidden ? "hidden" : ""} ${focused ? "focused" : ""} ${lit ? "lit" : ""} ${block.emphasis ? "emphasis" : ""} ${block.task ? "has-task" : ""} ${block.task && block.task.done ? "task-done" : ""} shp-${shapeDef.key} ${useSkin ? "shaped-skin shape-"+shapeDef.key : ""} ${block.fill === "soft" ? "fill-soft" : block.fill === "solid" ? "fill-solid" : block.fill === "none" ? "fill-none" : ""} ${block.estilo === "solido" ? "estilo-solido" : ""} ${block.corTexto ? "tem-cor-txt" : ""}`}
      style={{
        left: block.x, top: block.y,
        width: (block.w || 240) + "px",
        minHeight: (block.h || 80) + "px",
        "--bc": color, "--bc-rgb": hexToRgb(color),
        // tamanho de fonte do bloco inteiro (corpo); título acompanha um pouco menor
        "--body-size": (block.fontSize || 15) + "px",
        "--title-size": Math.round((block.fontSize || 15) * 0.87) + "px",
        ...(block.corTexto ? { "--cor-txt": block.corTexto } : {}),
        ...(shapeDef.radius ? { borderRadius: shapeDef.radius } : {}),
      }}
      onMouseDown={(e) => {
        // link de leitura: deixa o evento subir pro fundo (arrastar = mover a tela)
        if (readOnly) { downAtRef.current = { x: e.clientX, y: e.clientY }; return; }
        if (e.target.classList.contains("port")) return;
        if (e.target.classList.contains("del")) return;
        if (e.target.isContentEditable) return;
        e.stopPropagation();
        onSelect(block.id, e.shiftKey);
        onStartDrag(e);
      }}
      onClick={(e) => {
        // link de leitura: um clique (sem arrastar) abre o quadro/documento
        if (!readOnly || !(block.board || block.doc)) return;
        const d = downAtRef.current;
        if (d && Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6) return;
        if (block.board) onOpenBoard?.(block.id); else onOpenDoc?.(block.id);
      }}
      onDoubleClick={(e) => {
        e.stopPropagation();
        if (readOnly) return;
        // Use closest() so clicking on inner spans (from bold/italic/color formatting)
        // still correctly resolves to the parent title or body element
        // bloco com documento: título e corpo seguem editáveis; o resto abre o documento
        if (e.target.closest(".title") || (block.estilo === "solido" && !block.board && !block.doc)) setEditingTitle(true);
        else if (block.board && !e.target.closest(".body")) onOpenBoard?.(block.id);
        else if (block.doc && !e.target.closest(".body")) onOpenDoc?.(block.id);
        else setEditingBody(true);
      }}
    >
      {useSkin && (
        <svg className="block-skin" viewBox="0 0 100 100" preserveAspectRatio="none">
          <polygon
            className="skin-poly"
            points={shapeDef.points}
            style={{
              fill: block.fill === "solid" ? color : block.fill === "soft" ? `rgba(${hexToRgb(color)},.22)` : "var(--blk-bg)",
              stroke: color,
              strokeWidth: selected ? 2.4 : 1.6,
              vectorEffect: "non-scaling-stroke",
              filter: skinGlow,
            }}
          />
        </svg>
      )}
      {block.task && (
        <button
          className="task-check"
          title={block.task.done ? "Marcar como pendente" : "Marcar como feito"}
          onMouseDown={(e) => e.stopPropagation()}
          onDoubleClick={(e) => e.stopPropagation()}
          onClick={(e) => { e.stopPropagation(); if (!readOnly) onChange(block.id, { task: { done: !block.task.done } }); }}
        >{block.task.done ? "✓" : ""}</button>
      )}
      {editingTitle ? (
        <div
          ref={titleRef}
          className="title"
          data-placeholder="TÍTULO"
          contentEditable
          suppressContentEditableWarning
          onBlur={(e) => {
            setEditingTitle(false);
            const html = e.currentTarget.innerHTML;
            const plain = e.currentTarget.textContent.trim();
            if (enterToBodyRef.current) { enterToBodyRef.current = false; return; } // Enter já salvou e segue pro corpo
            if (discardIfEmpty(plain ? html : "", block.body)) return;
            onChange(block.id, { title: plain ? html : "" });
          }}
          onKeyDown={(e) => {
            if (e.key === "Escape") { e.preventDefault(); e.currentTarget.blur(); }
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              const html = e.currentTarget.innerHTML;
              const plain = e.currentTarget.textContent.trim();
              if (plain) freshRef.current = false;
              // Modo Mapa: Enter salva e já cria o irmão (Ctrl+Enter vai pro corpo)
              if (mapMode && !e.ctrlKey && !e.metaKey) {
                e.currentTarget.blur(); // onBlur salva (ou descarta se vazio)
                if (plain) onEnterSibling?.(block.id);
                return;
              }
              enterToBodyRef.current = true;
              onChange(block.id, { title: plain ? html : "" });
              setEditingTitle(false);
              setTimeout(() => { setEditingBody(true); enterToBodyRef.current = false; }, 0);
            }
          }}
        />
      ) : (
        <div
          ref={titleRef}
          className="title"
          data-placeholder="TÍTULO"
          dangerouslySetInnerHTML={{ __html: block.title || "" }}
        />
      )}
      {block.image && <img className="block-img" src={block.image} draggable={false} alt="" />}
      {(editingBody || (block.body && block.body.replace(/<[^>]*>/g, "").trim() !== "")) && (
        editingBody ? (
          <div
            ref={bodyRef}
            className="body"
            contentEditable
            suppressContentEditableWarning
            onBlur={(e) => {
              setEditingBody(false);
              const html = e.currentTarget.innerHTML;
              const plain = e.currentTarget.textContent.trim();
              if (discardIfEmpty(block.title, plain ? html : "")) return;
              onChange(block.id, { body: plain ? html : "" });
            }}
            onKeyDown={(e) => {
              if (e.key === "Escape") { e.preventDefault(); e.currentTarget.blur(); }
            }}
          />
        ) : (
          <div
            ref={bodyRef}
            className="body"
            dangerouslySetInnerHTML={{ __html: block.body || "" }}
          />
        )
      )}
      {block.doc && (() => {
        const st = docStats(block.doc);
        return (
          <div className="doc-chip" title="Duplo clique abre o documento">
            <div className="doc-chip-head">
              <svg viewBox="0 0 24 24"><path d="M14 3 H7 a2 2 0 0 0 -2 2 v14 a2 2 0 0 0 2 2 h10 a2 2 0 0 0 2 -2 V8 Z"/><path d="M14 3 v5 h5 M9 13 h6 M9 17 h4"/></svg>
              Documento
            </div>
            {st.first && <div className="doc-chip-line">{st.first}</div>}
            <div className="doc-chip-meta">{st.words.toLocaleString("pt-BR")} palavras{st.spoken ? " · " + st.spoken : ""}</div>
          </div>
        );
      })()}
      {block.board && block.board.cols && (() => {
        const cols = block.board.cols;
        const st = boardStats(block.board);
        return (
          <div className="board-chip" title="Duplo clique abre o quadro">
            <div className="board-chip-head">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="4.5" height="16" rx="1"/><rect x="9.75" y="4" width="4.5" height="11" rx="1"/><rect x="16.5" y="4" width="4.5" height="16" rx="1"/></svg>
              Quadro · {st.ativos} ativo{st.ativos !== 1 ? "s" : ""}
              {st.atrasados > 0 && <span className="late">⚠ {st.atrasados} atrasado{st.atrasados !== 1 ? "s" : ""}</span>}
            </div>
            <div className="board-chip-cols">
              {cols.map(c => <span key={c.id}>{c.name} <b>{c.cards.length}</b></span>)}
            </div>
          </div>
        );
      })()}
      <div className="del" onMouseDown={(e) => { e.stopPropagation(); onDelete(block.id); }}>×</div>
      {["top","right","bottom","left"].map(p => (
        <div key={p} className={`port ${p}`} data-port={p}
          onMouseDown={(e) => { e.stopPropagation(); onStartConnection(block.id, p, e); }} />
      ))}
      {["tl","tr","bl","br"].map(c => (
        <div key={c} className={`resize ${c}`}
          onMouseDown={(e) => { e.stopPropagation(); onSelect(block.id, false); onStartResize(block.id, c, e); }} />
      ))}
    </div>
  );
}

/* ================== Note ================== */
function Note({ note, selected, pendingEditRef, onSelect, onStartDrag, onChange, onEraser, onEditingChange, onRemove }) {
  const ref = useRef(null);
  const [editing, setEditing] = useState(false);

  // Auto-enter edit mode when the note was just created (mirrors the blocks)
  useEffect(() => {
    if (pendingEditRef && pendingEditRef.current === note.id) {
      pendingEditRef.current = null;
      setEditing(true);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Tell the parent when this note enters/leaves edit mode, so it can show the
  // rich-text format bar (bold/italic/underline/size/color) — same bar the blocks use.
  useEffect(() => {
    onEditingChange?.(note.id, editing);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editing]);

  // On entering edit mode, load the stored HTML imperatively and select it all
  // so the user can immediately retype or apply formatting to the whole note.
  useEffect(() => {
    if (editing && ref.current) {
      ref.current.innerHTML = note.text || "";
      ref.current.focus();
      const r = document.createRange(); r.selectNodeContents(ref.current);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editing]);

  const color = note.color || "#ff9d00";
  const common = {
    ref,
    className: `note ${selected ? "selected" : ""} ${note.frame === false ? "bare" : ""}`,
    style: { left: note.x, top: note.y, "--nc": color, "--nc-rgb": hexToRgb(color), fontSize: (note.fontSize || 14) + "px" },
  };

  // While editing: a plain contentEditable surface (HTML set imperatively above).
  if (editing) {
    return (
      <div
        {...common}
        contentEditable
        suppressContentEditableWarning
        data-placeholder="Anotação…"
        onBlur={(e) => {
          setEditing(false);
          const html = e.currentTarget.innerHTML;
          const plain = e.currentTarget.textContent.trim();
          // nota criada e deixada vazia → remove (não vira fantasma invisível)
          if (!plain) { onRemove?.(note.id); return; }
          onChange(note.id, { text: html });
        }}
        onKeyDown={(e) => {
          if (e.key === "Escape") { e.preventDefault(); e.currentTarget.blur(); }
        }}
      />
    );
  }

  // Display mode: render the stored HTML; click to select/drag, double-click to edit.
  return (
    <div
      {...common}
      onMouseDown={(e) => {
        e.stopPropagation();
        if (onEraser && onEraser(note.id)) return;
        onSelect(note.id, e.shiftKey);
        onStartDrag(e);
      }}
      onDoubleClick={(e) => { e.stopPropagation(); setEditing(true); }}
      dangerouslySetInnerHTML={{ __html: note.text || "" }}
    />
  );
}

/* ================== ImageNode ================== */
function ImageNode({ image, selected, onSelect, onStartDrag, onStartResize, onDelete, onEraser }) {
  return (
    <div
      className={`imgnode ${selected ? "selected" : ""}`}
      style={{ left: image.x, top: image.y, width: image.w, height: image.h }}
      onMouseDown={(e) => {
        e.stopPropagation();
        if (onEraser && onEraser(image.id)) return;
        onSelect(image.id, e.shiftKey);
        onStartDrag(e);
      }}
    >
      <img src={image.src} draggable={false} alt="" />
      <div className="del" onMouseDown={(e) => { e.stopPropagation(); onDelete(image.id); }}>×</div>
      {["tl","tr","bl","br"].map(c => (
        <div key={c} className={`resize ${c}`}
          onMouseDown={(e) => { e.stopPropagation(); onSelect(image.id, false); onStartResize(image.id, c, e, "image"); }} />
      ))}
    </div>
  );
}

/* ================== CloudPanel (Supabase — login + mapas) ================== */
function CloudPanel({ client, session, getDoc, loadDoc, cloudDoc, setCloudDoc, onClose }) {
  const [maps, setMaps] = useState([]);
  const [status, setStatus] = useState("");
  const [name, setName] = useState(cloudDoc.name || "");
  // login
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");

  useEffect(() => { setName(cloudDoc.name || ""); }, [cloudDoc.name]);

  // link de leitura do mapa aberto: undefined = carregando, null = sem link
  const [shareToken, setShareToken] = useState(undefined);
  const [shareMsg, setShareMsg] = useState("");
  const shareErr = (error) => /share_token/.test(error.message)
    ? "O link ainda não está ligado no banco. Falta rodar o SQL que te passei."
    : "Erro: " + error.message;
  useEffect(() => {
    setShareToken(undefined); setShareMsg("");
    if (!client || !session || !cloudDoc.id) return;
    client.from("canvas_maps").select("share_token").eq("id", cloudDoc.id).single().then(({ data, error }) => {
      if (error) { setShareToken(null); setShareMsg(shareErr(error)); return; }
      setShareToken(data ? data.share_token || null : null);
    });
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [client, session, cloudDoc.id]);
  const copyShare = async (tk) => {
    try { await navigator.clipboard.writeText(shareUrl(tk)); setShareMsg("Link copiado. É só mandar pro seu amigo."); }
    catch { setShareMsg("Copie o link acima e mande pro seu amigo."); }
  };

  const refresh = useCallback(async () => {
    if (!client || !session) return;
    setStatus("Carregando…");
    const { data, error } = await client.from("canvas_maps").select("id,name,updated_at").order("updated_at", { ascending: false });
    if (error) { setStatus("Erro: " + error.message); return; }
    setMaps(data || []); setStatus("");
  }, [client, session]);

  useEffect(() => { if (session) refresh(); }, [session, refresh]);

  const login = async () => {
    if (!client) return;
    setStatus("Entrando…");
    const { error } = await client.auth.signInWithPassword({ email: email.trim(), password: pass });
    setStatus(error ? "Erro: " + error.message : "");
  };
  const signup = async () => {
    if (!client) return;
    setStatus("Criando conta…");
    const { error } = await client.auth.signUp({ email: email.trim(), password: pass });
    setStatus(error ? "Erro: " + error.message : "Conta criada — se pedir confirmação, cheque seu email e depois entre.");
  };
  const logout = async () => { await client.auth.signOut(); setMaps([]); };

  const save = async () => {
    const nm = (name || "").trim() || "Sem título";
    setStatus("Salvando…");
    const doc = getDoc();
    let res;
    if (cloudDoc.id) {
      res = await client.from("canvas_maps").update({ name: nm, data: doc, updated_at: new Date().toISOString() }).eq("id", cloudDoc.id).select("id").single();
    } else {
      res = await client.from("canvas_maps").insert({ name: nm, data: doc }).select("id").single();
    }
    if (res.error) { setStatus("Erro: " + res.error.message); return null; }
    setCloudDoc({ id: res.data.id, name: nm });
    setStatus("Salvo ✓"); refresh();
    return res.data.id;
  };
  // cria o link já salvando a versão atual (o amigo vê o que está na nuvem)
  const createShare = async () => {
    const id = await save();
    if (!id) return;
    const tk = newShareToken();
    const { error } = await client.from("canvas_maps").update({ share_token: tk }).eq("id", id);
    if (error) { setShareMsg(shareErr(error)); return; }
    setShareToken(tk);
    copyShare(tk);
  };
  const stopShare = async () => {
    if (!confirm("Desligar o link? Quem tiver ele não vai conseguir abrir mais.")) return;
    const { error } = await client.from("canvas_maps").update({ share_token: null }).eq("id", cloudDoc.id);
    if (error) { setShareMsg("Erro: " + error.message); return; }
    setShareToken(null); setShareMsg("Link desligado.");
  };
  const saveAsNew = async () => {
    const nm = (name || "").trim() || "Sem título";
    setStatus("Salvando cópia…");
    const res = await client.from("canvas_maps").insert({ name: nm, data: getDoc() }).select("id").single();
    if (res.error) { setStatus("Erro: " + res.error.message); return; }
    setCloudDoc({ id: res.data.id, name: nm });
    setStatus("Cópia salva ✓"); refresh();
  };
  const open = async (m) => {
    setStatus("Abrindo…");
    const { data, error } = await client.from("canvas_maps").select("data,name").eq("id", m.id).single();
    if (error) { setStatus("Erro: " + error.message); return; }
    loadDoc(data.data || {});
    setCloudDoc({ id: m.id, name: data.name });
    onClose();
  };
  const novo = () => {
    loadDoc({ blocks: [], notes: [], strokes: [], images: [], edges: [], view: { x: 20, y: 20, scale: 1 } });
    setCloudDoc({ id: null, name: "" });
    onClose();
  };
  const rename = async (m) => {
    const nn = prompt("Novo nome:", m.name); if (nn == null) return;
    const nm = nn.trim() || "Sem título";
    await client.from("canvas_maps").update({ name: nm }).eq("id", m.id);
    if (cloudDoc.id === m.id) setCloudDoc({ id: m.id, name: nm });
    refresh();
  };
  const del = async (m) => {
    if (!confirm(`Excluir "${m.name}"? (não dá pra desfazer)`)) return;
    await client.from("canvas_maps").delete().eq("id", m.id);
    if (cloudDoc.id === m.id) setCloudDoc({ id: null, name: "" });
    refresh();
  };

  const fmt = (s) => { try { return new Date(s).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };

  return (
    <div className="cloud-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="cloud-panel">
        <div className="cloud-head">
          <h3>☁ Nuvem</h3>
          {session && <span className="cloud-btn ghost" onClick={logout} title={session.user?.email}>Sair</span>}
          <span className="cloud-x" onClick={onClose}>×</span>
        </div>

        {!client ? (
          <div className="cloud-body"><div className="cloud-status">⚠ SDK do Supabase não carregou — recarrega a página.</div></div>
        ) : !session ? (
          <div className="cloud-body">
            <div className="cloud-lbl">Email</div>
            <input type="text" placeholder="voce@email.com" value={email} onChange={(e) => setEmail(e.target.value)} />
            <div className="cloud-lbl">Senha</div>
            <input type="password" placeholder="senha" value={pass} onChange={(e) => setPass(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") login(); }} />
            <div className="cloud-row" style={{ marginTop: 12 }}>
              <button className="cloud-btn" onClick={login}>Entrar</button>
              <button className="cloud-btn ghost" onClick={signup}>Criar conta</button>
            </div>
            <div className="cloud-status">{status}</div>
            <div className="cloud-note">É a mesma conta do seu app de notas (mesmo projeto). Logou aqui, seus mapas te seguem em qualquer navegador ou celular.</div>
          </div>
        ) : (
          <div className="cloud-body">
            <div className="cloud-saverow">
              <input type="text" placeholder="Nome do mapa" value={name} onChange={(e) => setName(e.target.value)} />
              <button className="cloud-btn" onClick={save}>Salvar</button>
            </div>
            <div className="cloud-row">
              {cloudDoc.id && <button className="cloud-btn ghost" onClick={saveAsNew}>Salvar como novo</button>}
              <button className="cloud-btn ghost" onClick={novo}>＋ Novo mapa</button>
              <button className="cloud-btn ghost" onClick={refresh}>↻ Atualizar</button>
            </div>
            <div className="share-box">
              <div className="cloud-lbl">Link de leitura</div>
              {!cloudDoc.id ? (
                <div className="share-hint">Salve o mapa na nuvem pra poder compartilhar.</div>
              ) : shareToken === undefined ? (
                <div className="share-hint">Carregando...</div>
              ) : shareToken ? (
                <>
                  <input type="text" readOnly value={shareUrl(shareToken)} onFocus={(e) => e.target.select()} />
                  <div className="cloud-row">
                    <button className="cloud-btn" onClick={() => copyShare(shareToken)}>Copiar link</button>
                    <button className="cloud-btn ghost" onClick={stopShare}>Desligar link</button>
                  </div>
                  <div className="share-hint">Quem abrir vê a última versão salva. Mudou o mapa? Clica em Salvar.</div>
                </>
              ) : (
                <>
                  <button className="cloud-btn" onClick={createShare}>Criar link de leitura</button>
                  <div className="share-hint">Salva a versão atual e gera um link. Quem abrir só lê: não precisa de login e não edita nada.</div>
                </>
              )}
              {shareMsg && <div className="share-hint strong">{shareMsg}</div>}
            </div>
            <div className="cloud-list">
              {maps.map((m) => (

                </div>
              ))}
              {!maps.length && <div className="cloud-status">Nenhum mapa salvo ainda. Dá um nome e clica em Salvar.</div>}
            </div>

  );
}

/* ================== Leitura em documento + exportar ==================
   Usado no link de leitura: o mapa vira texto corrido na ordem das setas,
   e dá pra baixar em Markdown/JSON ou copiar o texto (pra colar no Claude). */

// ordem de leitura: raízes (sem seta chegando) de cima pra baixo, depois
// segue as setas na ordem em que foram criadas. Bloco solto vai pro fim.
const mapOutline = (blocks, edges) => {
  const byId = new Map(blocks.map(b => [b.id, b]));
  const kids = new Map(), hasParent = new Set();
  (edges || []).forEach(e => {
    if (!byId.has(e.from.id) || !byId.has(e.to.id) || e.from.id === e.to.id) return;
    if (!kids.has(e.from.id)) kids.set(e.from.id, []);
    kids.get(e.from.id).push(e.to.id);
    hasParent.add(e.to.id);
  });
  const pos = (a, b) => (a.y - b.y) || (a.x - b.x);
  const roots = blocks.filter(b => !hasParent.has(b.id)).sort(pos);
  const seen = new Set(), out = [];
  const walk = (id, depth) => {
    if (seen.has(id)) return; seen.add(id);
    out.push({ block: byId.get(id), depth });
    (kids.get(id) || []).forEach(k => walk(k, depth + 1));
  };
  roots.forEach(r => walk(r.id, 0));
  blocks.slice().sort(pos).forEach(b => walk(b.id, 0)); // ciclos / soltos
  return out;
};

// HTML de dentro do bloco/documento só com o básico (vem de outra pessoa)
const SAFE_TAGS = new Set(["B", "STRONG", "I", "EM", "U", "S", "MARK", "CODE", "BR", "A"]);
const safeInline = (html) => {
  const box = document.createElement("div");
  box.innerHTML = String(html || "");
  const walk = (node) => Array.from(node.childNodes).map(n => {
    if (n.nodeType === 3) return n.textContent.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    if (n.nodeType !== 1) return "";
    const inner = walk(n);
    if (!SAFE_TAGS.has(n.tagName)) return inner;
    if (n.tagName === "BR") return "<br>";
    if (n.tagName === "A") {
      const href = n.getAttribute("href") || "";
      return /^https?:\/\//i.test(href) ? `<a href="${href.replace(/"/g, "&quot;")}" target="_blank" rel="noopener noreferrer">${inner}</a>` : inner;
    }
    const t = n.tagName.toLowerCase();
    return `<${t}>${inner}</${t}>`;
  }).join("");
  return walk(box);
};
const inlineMd = (html) => {
  const box = document.createElement("div");
  box.innerHTML = String(html || "");
  const walk = (node) => Array.from(node.childNodes).map(n => {
    if (n.nodeType === 3) return n.textContent.replace(/\u00a0/g, " ");
    if (n.nodeType !== 1) return "";
    const inner = walk(n);
    const t = n.tagName;
    if (t === "BR") return "\n";
    if (!inner.trim()) return inner;
    const wrap = (m) => { const lead = inner.match(/^\s*/)[0], tail = inner.match(/\s*$/)[0]; return lead + m + inner.trim() + m + tail; };
    if (t === "B" || t === "STRONG") return wrap("**");
    if (t === "I" || t === "EM") return wrap("*");
    if (t === "S") return wrap("~~");
    if (t === "CODE") return wrap("`");
    if (t === "A") { const h = n.getAttribute("href") || ""; return /^https?:\/\//i.test(h) ? `[${inner.trim()}](${h})` : inner; }
    return inner;
  }).join("");
  return walk(box).replace(/[ \t]+\n/g, "\n").replace(/ {2,}/g, " ").trim();
};

const listItemsOf = (d) => (d.items || []).map(it => typeof it === "string" ? { content: it, items: [], meta: {} } : it);
const docToMd = (doc, base = 3) => {
  const out = [];
  const listMd = (items, style, depth) => items.forEach((it, i) => {
    const pad = "  ".repeat(depth);
    const mark = style === "ordered" ? `${i + 1}.` : style === "checklist" ? (it.meta && it.meta.checked ? "- [x]" : "- [ ]") : "-";
    out.push(`${pad}${mark} ${inlineMd(it.content)}`);
    if (it.items && it.items.length) listMd(listItemsOf(it), style, depth + 1);
  });
  ((doc && doc.blocks) || []).forEach(b => {
    const d = b.data || {};
    if (b.type === "header") out.push("", "#".repeat(Math.min(6, base + Math.max(0, (d.level || 2) - 2))) + " " + inlineMd(d.text), "");
    else if (b.type === "paragraph") { const t = inlineMd(d.text); if (t) out.push(t, ""); }
    else if (b.type === "quote") { const t = inlineMd(d.text); if (t) out.push(t.split("\n").map(l => "> " + l).join("\n"), ""); }
    else if (b.type === "delimiter") out.push("---", "");
    else if (b.type === "list") { listMd(listItemsOf(d), d.style || "unordered", 0); out.push(""); }
    else if (b.type === "table") {
      const rows = (d.content || []).map(r => r.map(c => inlineMd(c).replace(/\|/g, "\\|").replace(/\n/g, " ")));
      if (rows.length) {
        const n = Math.max(...rows.map(r => r.length));
        const fill = (r) => Array.from({ length: n }, (_, i) => r[i] || "");
        const head = d.withHeadings ? fill(rows[0]) : Array(n).fill(" ");
        const body = d.withHeadings ? rows.slice(1) : rows;
        out.push("| " + head.join(" | ") + " |", "|" + " --- |".repeat(n), ...body.map(r => "| " + fill(r).join(" | ") + " |"), "");
      }
    }
    else if (d.text) out.push(inlineMd(d.text), "");
  });
  return out.join("\n");
};
const mapToMd = (name, blocks, edges, url) => {
  const out = ["# " + (name || "Mapa"), ""];
  if (url) out.push("Link: " + url, "");
  mapOutline(blocks, edges).forEach(({ block: b, depth }) => {
    const title = inlineMd(b.title) || "(sem título)";
    out.push((depth === 0 ? "## " : "### ") + title, "");
    const body = inlineMd(b.body); if (body) out.push(body, "");
    if (b.task) out.push(b.task.done ? "Status: feito" : "Status: pendente", "");
    if (b.doc) out.push(docToMd(b.doc, 4));
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
};
const fileSlug = (name) => (docPlain(name) || "mapa").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "mapa";
const downloadText = (filename, text, type) => {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

// documento do bloco em HTML (leitura corrida)
function DocRead({ doc }) {
  const html = (() => {
    const out = [];
    const listHtml = (items, style) => {
      const tag = style === "ordered" ? "ol" : "ul";
      return `<${tag} class="${style === "checklist" ? "rd-check" : ""}">` + items.map(it =>
        `<li class="${it.meta && it.meta.checked ? "done" : ""}">${style === "checklist" ? `<span class="rd-box">${it.meta && it.meta.checked ? "✓" : ""}</span>` : ""}${safeInline(it.content)}${it.items && it.items.length ? listHtml(listItemsOf(it), style) : ""}</li>`
      ).join("") + `</${tag}>`;
    };
    ((doc && doc.blocks) || []).forEach(b => {
      const d = b.data || {};
      if (b.type === "header") out.push(`<h${Math.min(6, 3 + (d.level || 2))}>${safeInline(d.text)}</h${Math.min(6, 3 + (d.level || 2))}>`);
      else if (b.type === "paragraph") { if (docPlain(d.text)) out.push(`<p>${safeInline(d.text)}</p>`); }
      else if (b.type === "quote") out.push(`<blockquote>${safeInline(d.text)}</blockquote>`);
      else if (b.type === "delimiter") out.push("<hr>");
      else if (b.type === "list") out.push(listHtml(listItemsOf(d), d.style || "unordered"));
      else if (b.type === "table") {
        const rows = d.content || [];
        out.push(`<div class="rd-table"><table>` + rows.map((r, i) =>
          `<tr>${r.map(c => (d.withHeadings && i === 0) ? `<th>${safeInline(c)}</th>` : `<td>${safeInline(c)}</td>`).join("")}</tr>`
        ).join("") + `</table></div>`);
      }
      else if (d.text) out.push(`<p>${safeInline(d.text)}</p>`);
    });
    return out.join("");
  })();
  return <div className="rd-doc" dangerouslySetInnerHTML={{ __html: html }} />;
}

function ReadingView({ name, blocks, edges }) {
  const items = mapOutline(blocks, edges);
  return (
    <div className="rd-overlay">
      <article className="rd-page">
        <h1 className="rd-title">{name || "Mapa"}</h1>
        {items.map(({ block: b, depth }) => {
          const st = b.doc ? docStats(b.doc) : null;
          const H = depth === 0 ? "h2" : "h3";
          return (
            <section key={b.id} className={`rd-sec ${depth === 0 ? "root" : ""}`} style={{ "--rc": b.color || DEFAULT_COLOR }}>
              <H className="rd-h" dangerouslySetInnerHTML={{ __html: safeInline(b.title) || "(sem título)" }} />
              {docPlain(b.body) && <p className="rd-body" dangerouslySetInnerHTML={{ __html: safeInline(b.body) }} />}
              {b.task && <p className="rd-meta">{b.task.done ? "Feito" : "Pendente"}</p>}
              {st && st.words > 0 && <p className="rd-meta">{st.words.toLocaleString("pt-BR")} palavras · {st.spoken}</p>}
              {b.doc && <DocRead doc={b.doc} />}
            </section>
          );
        })}
      </article>
    </div>
  );
}

/* ================== AttrTable (paleta lateral: colunas → valores → aplica) ========= */
/* ================== Bloco-documento ==================
   Cada bloco pode carregar um documento (block.doc = saída do Editor.js).
   Vai junto com o mapa no autosave e na nuvem; nada de tabela nova. */
const DOC_WPM = 150; // ritmo de fala pra estimar a duração do roteiro

const docPlain = (html) => {
  const d = document.createElement("div");
  d.innerHTML = String(html || "").replace(/<br\s*\/?>/gi, " ");
  return (d.textContent || "").replace(/\s+/g, " ").trim();
};
// textos de todos os blocos do documento, na ordem (inclui itens de lista aninhados)
const docTexts = (doc, { headers = true } = {}) => {
  const out = [];
  const walkItems = (items) => (items || []).forEach(it => {
    if (typeof it === "string") out.push(docPlain(it));
    else if (it) { out.push(docPlain(it.content)); walkItems(it.items); }
  });
  ((doc && doc.blocks) || []).forEach(b => {
    const d = b.data || {};
    if (b.type === "list") walkItems(d.items);
    else if (b.type === "table") (d.content || []).forEach(row => (row || []).forEach(c => out.push(docPlain(c))));
    else if (b.type === "header" && !headers) return;
    else if (d.text) out.push(docPlain(d.text));
  });
  return out.filter(Boolean);
};
const docStats = (doc) => {
  // títulos de seção (Abertura, Fala...) não são falados: ficam fora da contagem
  const texts = docTexts(doc, { headers: false });
  const words = texts.join(" ").split(/\s+/).filter(Boolean).length;
  // roteiro com fala em citação: o tempo falado conta só a fala (a direção não é dita),
  // sem as marcações de cena tipo "(pausa)" e "(olho na lente)"
  const falas = ((doc && doc.blocks) || []).filter(b => b.type === "quote").map(b => docPlain((b.data && b.data.text || "").replace(/<br\s*\/?>/gi, " ")).replace(/\([^)]*\)/g, " "));
  const spokenWords = falas.length ? falas.join(" ").split(/\s+/).filter(Boolean).length : words;
  const secs = Math.round(spokenWords / DOC_WPM * 60);
  const m = Math.floor(secs / 60), s = secs % 60;
  const spoken = spokenWords === 0 ? "" : m === 0 ? `~${Math.max(s, 1)}s falado` : `~${m}min${s ? String(s).padStart(2, "0") : ""} falado`;
  return { words, spoken, first: texts[0] || docTexts(doc)[0] || "" };
};
const docIsEmpty = (doc) => docTexts(doc).length === 0 && !((doc && doc.blocks) || []).some(b => b.type === "delimiter");

// Editor.js e plugins só carregam na primeira vez que um documento abre

const loadDocLibs = () => {
  if (_docLibs) return _docLibs;
  const add = (src) => new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error("falha ao carregar " + src));
    document.head.appendChild(s);

  const J = "https://cdn.jsdelivr.net/npm/";
  _docLibs = add(J + "@editorjs/editorjs@2.31.7/dist/editorjs.umd.js").then(() => Promise.all([
    add(J + "@editorjs/header@2.8.9/dist/header.umd.js"),
    add(J + "@editorjs/list@2.0.9/dist/editorjs-list.umd.js"),
    add(J + "@editorjs/quote@2.7.6/dist/quote.umd.js"),
    add(J + "@editorjs/delimiter@1.4.2/dist/delimiter.umd.js"),
    add(J + "editorjs-drag-drop@1.1.16/dist/bundle.js"),
    add(J + "@editorjs/table@2.4.6/dist/table.umd.js"),
  ])).catch(err => { _docLibs = null; throw err; });
  return _docLibs;
};

function DocEditor({ block, onSave, onClose, readOnly }) {
  const holderRef = useRef(null);
  const editorRef = useRef(null);
  const saveTimer = useRef(null);
  const lastDoc = useRef(block.doc || null);
  const closingRef = useRef(false);
  const [status, setStatus] = useState("loading"); // loading | ready | saving | saved | error
  const [stats, setStats] = useState(() => docStats(block.doc));
  const [title, setTitle] = useState(() => docPlain(block.title));
  const titleDirty = useRef(false);
  const titleRef = useRef(null);
  // título quebra linha e cresce junto (título longo não some no celular)
  useEffect(() => {
    const t = titleRef.current; if (!t) return;
    t.style.height = "auto"; t.style.height = t.scrollHeight + "px";
  }, [title]);

  // grava no bloco; documento vazio some do bloco
  const commit = useCallback(async () => {
    const ed = editorRef.current;
    if (!ed) return;
    try {
      const data = await ed.save();
      // parágrafos vazios no fim não entram no bloco
      while (data.blocks.length && data.blocks[data.blocks.length - 1].type === "paragraph" && !docPlain(data.blocks[data.blocks.length - 1].data.text).replace(/^\/$/, "")) data.blocks.pop();
      lastDoc.current = data;
      setStats(docStats(data));
      onSave(block.id, { doc: docIsEmpty(data) ? null : { blocks: data.blocks, time: data.time } });
      setStatus("saved");
    } catch { setStatus("error"); }
  }, [block.id, onSave]);

  useEffect(() => {
    let dead = false;
    loadDocLibs().then(() => {
      if (dead || !holderRef.current) return;
      const ed = new window.EditorJS({
        holder: holderRef.current,
        data: block.doc && block.doc.blocks ? { blocks: block.doc.blocks } : { blocks: [] },
        placeholder: readOnly ? "" : "Escreva aqui. Digite / pra títulos, listas, checklist e tabela",
        minHeight: 120,
        readOnly: !!readOnly,
        autofocus: !block.doc && !readOnly,
        i18n: DOC_I18N,
        tools: {
          header: { class: window.Header, inlineToolbar: true, shortcut: "CMD+SHIFT+H", config: { levels: [1, 2, 3], defaultLevel: 2, placeholder: "Título" } },
          list: { class: window.EditorjsList, inlineToolbar: true, config: { defaultStyle: "unordered" } },
          quote: { class: window.Quote, inlineToolbar: true, config: { quotePlaceholder: "Fala / citação", captionPlaceholder: "" } },
          delimiter: window.Delimiter,
          // o plugin ignora withHeadings da config quando o bloco nasce: vai pelo data do menu
          table: { class: window.Table, inlineToolbar: true, config: { rows: 2, cols: 3, withHeadings: true },
                   toolbox: { title: "Table", icon: window.Table.toolbox.icon, data: { withHeadings: true } } },
        },
        onReady: () => {
          if (dead) return;
          if (!readOnly) { try { new window.DragDrop(ed); } catch {} }
          setStatus("ready");
        },
        onChange: () => {
          setStatus("saving");
          clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(commit, 500);
        },
      });
      editorRef.current = ed;
    }).catch(() => { if (!dead) setStatus("error"); });
    return () => {
      dead = true;
      clearTimeout(saveTimer.current);
      const ed = editorRef.current;
      editorRef.current = null;
      if (ed && ed.destroy) { try { ed.destroy(); } catch {} }
    };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const saveTitle = () => {
    if (!titleDirty.current) return;
    titleDirty.current = false;
    const t = title.trim();
    const safe = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    onSave(block.id, { title: safe });
  };

  const close = useCallback(async () => {
    if (closingRef.current) return;
    closingRef.current = true;
    if (readOnly) { onClose(); return; }
    clearTimeout(saveTimer.current);
    saveTitle();
    await commit();
    onClose();
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [commit, onClose, title]);

  // Esc fecha (menos quando um menu do editor está aberto: aí o Esc é dele)
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Escape") return;
      if (holderRef.current && holderRef.current.querySelector(".ce-popover--opened, .ce-inline-toolbar--showed, .ce-conversion-toolbar--showed")) return;
      e.preventDefault(); e.stopPropagation();
      close();
    };
    window.addEventListener("keydown", onKey, true);
    return () => window.removeEventListener("keydown", onKey, true);
  }, [close]);

  const statusTxt = status === "loading" ? "Carregando..."
    : readOnly && status !== "error" ? "Só leitura"
    : status === "saving" ? "Salvando..."
    : status === "error" ? "Não consegui carregar o editor. Confira a internet e abra de novo."
    : status === "saved" ? "Salvo" : "Salvo automaticamente";

  return (
    <div className="doc-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) close(); }}>
      <div className="doc-panel" role="dialog" aria-label="Documento do bloco">
        <div className="doc-head">
          <div className="doc-status">
            {statusTxt}
            {stats.words > 0 && <> · <b>{stats.words.toLocaleString("pt-BR")} palavras</b> · {stats.spoken}</>}
          </div>
          <button className="doc-x" onClick={close} title="Fechar (Esc)">×</button>
        </div>
        <div className="doc-scroll">
          <textarea
            ref={titleRef}
            className="doc-title"
            rows={1}
            value={title}
            placeholder="Sem título"
            readOnly={!!readOnly}
            onChange={(e) => { titleDirty.current = true; setTitle(e.target.value.replace(/[\r\n]+/g, " ")); }}
            onBlur={saveTitle}
            onKeyDown={(e) => {
              if (e.key === "Enter") {
                e.preventDefault(); saveTitle();
                const ed = editorRef.current;
                if (ed && ed.caret) { try { ed.caret.setToFirstBlock("start"); } catch {} }
              }
            }}
          />
          {status === "loading" && <div className="doc-loading">Carregando editor...</div>}
          <div
            ref={holderRef}
            className="doc-editor"
            title={readOnly ? undefined : "Ctrl+clique num link abre ele"}
            onClick={(e) => {
              // link no documento: no modo leitura abre com clique; editando, com Ctrl+clique
              const a = e.target.closest && e.target.closest("a[href]");
              if (!a) return;
              const href = a.getAttribute("href") || "";
              if (!/^https?:\/\//i.test(href)) return;
              if (readOnly || e.ctrlKey || e.metaKey) { e.preventDefault(); window.open(href, "_blank", "noopener,noreferrer"); }
            }}
          />
        </div>
      </div>
    </div>
  );
}

/* ================== BoardPanel (quadro/pipeline dentro do bloco) ========= */
/* ---- quadro: helpers (modelo de cartão replicado do Valt "Não Esquece", face/quadro.html) ---- */
/* ---- quadro: helpers (modelo de cartão replicado do Valt "Não Esquece", face/quadro.html) ---- */
/* ---- quadro: helpers (modelo de cartão replicado do Valt "Não Esquece", face/quadro.html) ---- */
/* ---- quadro: helpers (modelo de cartão replicado do Valt "Não Esquece", face/quadro.html) ---- */
const BOARD_PRIOS = [
  { k: "urgente", label: "Urgente", color: "#ff6b6b", p: 0 },
  { k: "alta", label: "Alta", color: "#f2a63b", p: 1 },
  { k: "media", label: "Média", color: "#7fb4ff", p: 2 },
  { k: "baixa", label: "Baixa", color: "#8fd6a8", p: 3 },
  { k: "", label: "Sem", color: "#6b8aa0", p: 4 },
];
const boardPrio = (k) => BOARD_PRIOS.find(p => p.k === (k || "")) || BOARD_PRIOS[BOARD_PRIOS.length - 1];
// fluxo pronto por tipo de cartão (o de vídeo termina em "responder comentários", que gera lembrete)
const BOARD_TEMPLATES = {
  video: ["Roteiro / pauta", "Gravar", "Editar", "Miniatura", "Descrição + bloco fixo de links", "Publicar", "Responder comentários"],
  tarefa: ["Definir o que precisa", "Fazer", "Revisar"],
};
const BOARD_TYPE_LABEL = { video: "Vídeo", tarefa: "Tarefa" };
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const defaultBoard = () => ({ cols: [
  { id: newId("c"), name: "A FAZER", cards: [] },
  { id: newId("c"), name: "FAZENDO", cards: [] },
  { id: newId("c"), name: "FEITO", cards: [] },
] });
const boardMakeCard = (type) => ({
  id: newId("k"), type, title: "", prio: "", due: null, commentsDue: null, links: [], createdAt: Date.now(),
  steps: (BOARD_TEMPLATES[type] || []).map(l => ({ id: newId("s"), label: l, done: false, links: [] })),
});
// cartão/etapa da versão anterior (tag livre, etapa com "text", prazo em texto) vira o modelo do Valt
const boardNormCard = (c) => {
  const type = c.type || (/v[ií]deo/i.test(c.tag || "") ? "video" : "tarefa");
  let due = c.due || null;
  if (due && /^\d{2}\/\d{2}\/\d{4}$/.test(due)) { const [d, m, y] = due.split("/"); due = `${y}-${m}-${d}`; }
  else if (due && !/^\d{4}-\d{2}-\d{2}$/.test(due)) due = null;
  return { ...c, type, due, prio: c.prio || "", commentsDue: c.commentsDue || null, links: Array.isArray(c.links) ? c.links : [],
    steps: (c.steps || []).map(s => ({ ...s, label: s.label != null ? s.label : (s.text || ""), links: Array.isArray(s.links) ? s.links : [] })) };
};
const boardNorm = (b) => ({ ...b, cols: (b.cols || []).map(c => ({ ...c, cards: (c.cards || []).map(boardNormCard) })) });
// datas: chave yyyy-mm-dd no dado, dd/mm/yyyy na tela
const bdPad = (n) => (n < 10 ? "0" : "") + n;
const bdKey = (d = new Date()) => d.getFullYear() + "-" + bdPad(d.getMonth() + 1) + "-" + bdPad(d.getDate());
const bdAddDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return bdKey(d); };
const bdFromKey = (k) => { const p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); };
const bdDiff = (k) => Math.round((bdFromKey(k) - bdFromKey(bdKey())) / 86400000);
const bdBr = (k) => { const p = k.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; };
const boardPrazoLabel = (k) => {
  const d = bdDiff(k);
  if (d < 0) return { cls: "overdue", txt: "atrasado " + (d === -1 ? "desde ontem" : "há " + (-d) + " dias") };
  if (d === 0) return { cls: "soon", txt: "prazo hoje" };
  if (d === 1) return { cls: "soon", txt: "prazo amanhã" };
  if (d <= 6) return { cls: "soon", txt: "prazo em " + d + " dias" };
  return { cls: "", txt: "prazo " + bdBr(k) };
};
const boardComentsLabel = (k) => {
  const d = bdDiff(k);
  if (d < 0) return { cls: "overdue", txt: "responder coments · atrasado " + (d === -1 ? "desde ontem" : "há " + (-d) + " dias") };
  if (d === 0) return { cls: "soon", txt: "responder coments · hoje" };
  if (d === 1) return { cls: "soon", txt: "responder coments · amanhã" };
  return { cls: "soon", txt: "responder coments · " + bdBr(k) };
};
const boardProgress = (c) => { const st = c.steps || []; return { done: st.filter(s => s.done).length, total: st.length }; };
const boardComentsDone = (c) => { const s = (c.steps || []).find(x => /coment/i.test(x.label)); return s ? s.done : false; };
// atrasado de dois jeitos: lembrete de comentários vencido, ou prazo manual vencido fora da coluna Feito
const boardCardLate = (c, isDoneCol) => {
  if (c.commentsDue && bdDiff(c.commentsDue) < 0 && !boardComentsDone(c)) return true;
  return !!(c.due && bdDiff(c.due) < 0 && !isDoneCol);
};
// a ÚLTIMA coluna do quadro é a "Feito" (cartão com todas as etapas vai pra lá sozinho)
const boardDoneColId = (cols) => (cols.length > 1 ? cols[cols.length - 1].id : null);
const boardStats = (board) => {
  const cols = (board && board.cols) || [];
  const doneId = boardDoneColId(cols);
  let ativos = 0, atrasados = 0, total = 0;
  cols.forEach(c => { const isDone = c.id === doneId; (c.cards || []).forEach(cd => { total++; if (!isDone) ativos++; if (boardCardLate(boardNormCard(cd), isDone)) atrasados++; }); });
  return { ativos, atrasados, total };
};
// urgente em cima; empatou, quem tem prazo mais perto vem antes
const boardSortCards = (cards) => [...cards].sort((a, b) => {
  const d = boardPrio(a.prio).p - boardPrio(b.prio).p; if (d) return d;
  const da = a.due || "9999-99-99", db = b.due || "9999-99-99";
  return da < db ? -1 : (da > db ? 1 : 0);
});
const boardEhLink = (v) => /^(https?:|mailto:)/i.test(String(v || "").trim());
const boardNomeAnexo = (v) => {
  v = String(v || "").trim();
  if (boardEhLink(v)) { try { return decodeURIComponent(v.replace(/^https?:\/\//i, "").slice(0, 58)); } catch { return v.slice(0, 58); } }
  const partes = v.replace(/[\\/]+$/, "").split(/[\\/]/);
  return partes[partes.length - 1] || v;
};

function BoardPanel({ block, onSave, onClose, readOnly }) {
  const [board, setBoard] = useState(() => boardNorm(block.board && block.board.cols ? block.board : defaultBoard()));
  const [openId, setOpenId] = useState(null);   // ficha do cartão aberta
  const [pickCol, setPickCol] = useState(null); // "+ cartão": escolhe Vídeo ou Tarefa
  const [stepIn, setStepIn] = useState("");
  const [anexoIn, setAnexoIn] = useState("");
  const dragRef = useRef(null);
  const titleRef = useRef(null);

  const save = (b) => { setBoard(b); if (!readOnly) onSave(block.id, { board: b }); };
  const cols = board.cols;
  const doneColId = boardDoneColId(cols);
  const findCard = (id) => { for (const c of cols) { const k = c.cards.find(x => x.id === id); if (k) return { col: c, card: k }; } return null; };
  const patchCard = (cardId, fn) => save({ cols: cols.map(c => ({ ...c, cards: c.cards.map(cd => cd.id === cardId ? fn(cd) : cd) })) });
  const moveCard = (cardId, toColId) => {
    const f = findCard(cardId); if (!f || f.col.id === toColId) return;
    save({ cols: cols.map(c => c.id === f.col.id ? { ...c, cards: c.cards.filter(cd => cd.id !== cardId) } : (c.id === toColId ? { ...c, cards: [...c.cards, f.card] } : c)) });
  };
  const createCard = (colId, type) => {
    const card = boardMakeCard(type);
    save({ cols: cols.map(c => c.id === colId ? { ...c, cards: [...c.cards, card] } : c) });
    setPickCol(null); setOpenId(card.id);
    setTimeout(() => { if (titleRef.current) titleRef.current.focus(); }, 30);
  };
  const delCard = (cardId) => { save({ cols: cols.map(c => ({ ...c, cards: c.cards.filter(cd => cd.id !== cardId) })) }); setOpenId(null); };
  const addCol = () => save({ cols: [...cols, { id: newId("c"), name: "NOVA", cards: [] }] });
  const renameCol = (colId, name) => save({ cols: cols.map(c => c.id === colId ? { ...c, name } : c) });
  const delCol = (colId) => { if (!confirm("Apagar a coluna e seus cartões?")) return; save({ cols: cols.filter(c => c.id !== colId) }); };

  // etapas: marcar move o cartão de coluna sozinho (todas feitas -> Feito; desmarcou no Feito -> volta uma)
  const toggleStep = (cardId, stepId) => {
    const f = findCard(cardId); if (!f) return;
    const card = { ...f.card, steps: f.card.steps.map(s => s.id === stepId ? { ...s, done: !s.done } : s) };
    const s = card.steps.find(x => x.id === stepId);
    // vídeo publicado: lembrete de responder comentários pra amanhã (igual ao Valt)
    if (s && s.done && card.type === "video" && /publicar/i.test(s.label) && !card.commentsDue) card.commentsDue = bdAddDays(1);
    const allDone = card.steps.length > 0 && card.steps.every(x => x.done);
    let toColId = f.col.id;
    if (doneColId) {
      if (allDone) toColId = doneColId;
      else if (f.col.id === doneColId) toColId = cols[Math.max(0, cols.length - 2)].id;
    }
    save({ cols: cols.map(c => {
      if (toColId === f.col.id) return c.id === f.col.id ? { ...c, cards: c.cards.map(cd => cd.id === cardId ? card : cd) } : c;
      if (c.id === f.col.id) return { ...c, cards: c.cards.filter(cd => cd.id !== cardId) };
      if (c.id === toColId) return { ...c, cards: [...c.cards, card] };
      return c;
    }) });
  };
  const addStep = (cardId) => { const t = stepIn.trim(); if (!t) return; patchCard(cardId, cd => ({ ...cd, steps: [...cd.steps, { id: newId("s"), label: t, done: false, links: [] }] })); setStepIn(""); };
  const delStep = (cardId, stepId) => patchCard(cardId, cd => ({ ...cd, steps: cd.steps.filter(s => s.id !== stepId) }));
  const renameStep = (cardId, stepId, label) => patchCard(cardId, cd => ({ ...cd, steps: cd.steps.map(s => s.id === stepId ? { ...s, label } : s) }));
  const addStepLink = (cardId, stepId) => {
    const v = prompt("Link ou caminho do arquivo pra essa etapa:"); if (!v || !v.trim()) return;
    patchCard(cardId, cd => ({ ...cd, steps: cd.steps.map(s => s.id === stepId ? { ...s, links: [...(s.links || []), v.trim()] } : s) }));
  };
  const delStepLink = (cardId, stepId, i) => patchCard(cardId, cd => ({ ...cd, steps: cd.steps.map(s => s.id === stepId ? { ...s, links: s.links.filter((_, j) => j !== i) } : s) }));
  const addAnexo = (cardId) => { const v = anexoIn.trim(); if (!v) return; patchCard(cardId, cd => ({ ...cd, links: [...(cd.links || []), v] })); setAnexoIn(""); };
  const delAnexo = (cardId, i) => patchCard(cardId, cd => ({ ...cd, links: cd.links.filter((_, j) => j !== i) }));
  const abrirAnexo = (v) => {
    v = String(v || "").trim(); if (!v) return;
    if (boardEhLink(v)) { window.open(v, "_blank", "noopener,noreferrer"); return; }
    // caminho do PC: o navegador não abre (no Valt quem abre é o servidor local); aqui copia pra colar no Explorer
    try { navigator.clipboard.writeText(v); alert("Caminho copiado. Cola no Explorer pra abrir."); } catch { alert(v); }
  };
  const closeSheet = () => { setOpenId(null); setPickCol(null); setStepIn(""); setAnexoIn(""); };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Escape") return;
      e.preventDefault(); e.stopPropagation();
      if (openId || pickCol) closeSheet(); else onClose();
    };
    window.addEventListener("keydown", onKey, true);
    return () => window.removeEventListener("keydown", onKey, true);
  }, [onClose, openId, pickCol]);

  const boardTitle = (block.title || "").replace(/<[^>]*>/g, "").trim() || "Quadro";
  const stats = boardStats(board);
  const open = openId ? findCard(openId) : null;

  const renderAnexos = (lista, onDel) => (lista && lista.length ? (
    <div className="bs-anexos">
      {lista.map((a, i) => (
        <div className="bs-anexo" key={i} onClick={() => abrirAnexo(a)} title={a}>
          <span className="bs-ic">{boardEhLink(a) ? "🔗" : "📁"}</span>
          <span className="tx">{boardNomeAnexo(a)}</span>
          {!readOnly && <button className="bs-del" title="remover" onClick={(e) => { e.stopPropagation(); onDel(i); }}>×</button>}
        </div>
      ))}
    </div>
  ) : null);

  const renderCard = (col, card, isDoneCol) => {
    const pr = boardProgress(card);
    const pi = boardPrio(card.prio);
    const pct = pr.total ? Math.round((pr.done / pr.total) * 100) : 0;
    const prazo = card.due && !isDoneCol ? boardPrazoLabel(card.due) : null;
    const coments = card.commentsDue && !boardComentsDone(card) ? boardComentsLabel(card.commentsDue) : null;
    return (
      <div className={`board-card ${isDoneCol ? "done-card" : ""}`} key={card.id} draggable={!readOnly}
        onClick={() => setOpenId(card.id)}
        onDragStart={(e) => { dragRef.current = { cardId: card.id, fromColId: col.id }; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", card.id); } catch {} }}
        onDragEnd={() => { dragRef.current = null; }}>
        <div className="board-card-top">
          <span className={`bs-tag ${card.type}`}>{BOARD_TYPE_LABEL[card.type] || "Tarefa"}</span>
          {card.prio && <span className="bs-prio" style={{ color: pi.color, borderColor: pi.color + "6b", background: pi.color + "1a" }}><i className="pt" />{pi.label}</span>}
        </div>
        <div className={`board-card-title ${card.title ? "" : "empty"}`}>{card.title || "Sem título"}</div>
        <div className="board-card-prog">
          <div className="board-bar"><div className="board-bar-fill" style={{ width: pct + "%" }} /></div>
          <span className="board-frac">{pr.done}/{pr.total}</span>
        </div>
        {prazo && <span className={`bs-chip ${prazo.cls}`}>{prazo.txt}</span>}
        {coments && <span className={`bs-chip ${coments.cls}`}>{coments.txt}</span>}
      </div>
    );
  };

  const renderPicker = () => pickCol && (
    <div className="bs-scrim" onMouseDown={(e) => { if (e.target === e.currentTarget) setPickCol(null); }}>
      <div className="bs-sheet" role="dialog" aria-label="Novo cartão">
        <div className="bs-row">
          <span className="bs-label" style={{ flex: 1, marginBottom: 0 }}>Novo cartão em {(cols.find(c => c.id === pickCol) || {}).name || ""}</span>
          <button className="bs-x" onClick={() => setPickCol(null)}>×</button>
        </div>
        <div className="bs-picker">
          <div className="opt" onClick={() => createCard(pickCol, "video")}>
            <span className="bs-ic">🎬</span>
            <div><div className="t">Vídeo</div><div className="d">Vem com o fluxo pronto: roteiro, gravar, editar, miniatura, descrição + bloco fixo, publicar e responder comentários. Ao publicar, cria o lembrete pra amanhã.</div></div>
          </div>
          <div className="opt" onClick={() => createCard(pickCol, "tarefa")}>
            <span className="bs-ic">✷</span>
            <div><div className="t">Tarefa</div><div className="d">Cartão livre. Você adiciona as etapas do fluxo que quiser.</div></div>
          </div>
        </div>
      </div>
    </div>
  );

  const renderSheet = () => {
    if (!open) return null;
    const { col, card } = open;
    const coments = card.commentsDue && !boardComentsDone(card) ? boardComentsLabel(card.commentsDue) : null;
    return (

}

  const collectFarSide = useCallback((barrierId, startId, out) => {

  // finaliza: tira o ponto vivo, remove duplicados do final (duplo-clique) e comita

  }, []);

  /* ----- update ----- */
  const updateBlock = useCallback((id, patch) => {
    setBlocks(p => p.map(b => b.id === id ? { ...b, ...patch } : b));
  }, []);
  // salva vindo da popup do documento; doc vazio (null) sai do bloco
  const saveDocPatch = useCallback((id, patch) => {
    setBlocks(p => p.map(b => {

  // cria um bloco a partir de um modelo, no centro da tela, já em edição
  const createFromPreset = useCallback((preset) => {
    const d = JSON.parse(JSON.stringify(preset.data || {}));
    const w = d.w || 240, h = d.h || 80;
    const ws = wsRef.current ? wsRef.current.getBoundingClientRect() : { left: 0, top: 0, width: innerWidth, height: innerHeight };
    const c = screenToWorld(ws.left + ws.width / 2, ws.top + ws.height / 2);
    // procura um lugar livre perto do centro (não empilha em cima de outro bloco)
    const rects = blocksRef.current.map(o => ({ x: o.x, y: o.y, w: o.w || 240, h: (sizesRef.current[o.id] && sizesRef.current[o.id].h) || o.h || 80 }));
    const hits = (x, y) => rects.some(r => x < r.x + r.w + 24 && x + w + 24 > r.x && y < r.y + r.h + 24 && y + h + 24 > r.y);
    let x0 = Math.round(c.x - w / 2), y0 = Math.round(c.y - h / 2);

      const step = 60 * ring;
      const cands = ring === 0 ? [[0, 0]] : [[step, 0], [0, step], [-step, 0], [0, -step], [step, step], [-step, step], [step, -step], [-step, -step]];

    const id = uid();
    const b = { id, x: x0, y: y0, title: "", body: "", color: DEFAULT_COLOR, estilo: estiloPadrao(), ...(PC ? { fill: fundoPadrao() } : {}), ...d, w, h };
    const extraBlocks = [], extraEdges = [];
    if (preset.after === "yesno") {
      const CW = 150, CH = 64;

  const openDoc = useCallback((id) => {

  const openBoard = useCallback((id) => {

      strokes.forEach(s => { if (sel.has(s.id) || (s.anchorId && sel.has(s.anchorId))) items.push({ kind:"stroke", id:s.id, startX:s.x||0, startY:s.y||0 }); });

    setEdges(p => p.map(e => {

      }
      // Clicked on the target port → hide what's upstream (backward)
